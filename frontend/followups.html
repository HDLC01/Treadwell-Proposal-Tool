<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follow-ups · Treadwell Proposal Generator</title>
  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
  <!-- Styles itself, like portal.html and projects.html, so it needs its own opt-out:
       without it Chromium synthesizes a dark theme and flattens every near-white
       surface to one grey. There is no dark theme in this repo. -->
  <meta name="color-scheme" content="only light" />
  <style>
    :root { color-scheme: only light;
      --red:#c8102e; --red-dark:#9e001f; --ink:#1b1c1c; --ink-v:#5c403f;
      --surf:#f4f4f5; --line:rgba(27,28,28,.1); --ok:#0f7b34; --warn:#7a5c00; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--surf); color:var(--ink); padding:28px 22px 90px;
      font:400 14px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .top { display:flex; align-items:center; gap:14px; max-width:1360px; margin:0 auto 6px; }
    .logo { width:54px; height:34px; display:block; flex:none; }
    h1 { font-size:20px; margin:0; flex:1; }
    .wrap { max-width:1360px; margin:0 auto; }
    .hint { color:var(--ink-v); font-size:13px; margin:0 auto 16px; max-width:1360px; }
    /* toolbar — same shapes as Projects and the CRM board */
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 14px; }
    /* Both toolbars ship with the `hidden` attribute so they don't appear empty before the
       data lands — but the UA stylesheet's `[hidden]{display:none}` loses to the author
       `display:flex` directly above, so they showed anyway. Re-asserting it as an author
       rule is what makes `hidden` mean hidden. */
    .toolbar[hidden] { display:none; }
    .tw-search { flex:1; min-width:180px; max-width:300px; background:#fff; color:var(--ink);
      border:1px solid rgba(27,28,28,.15); border-radius:9px; padding:7px 12px; font:600 12.5px system-ui; }
    .tw-select { background:#fff; color:var(--ink-v); border:1px solid rgba(27,28,28,.15);
      border-radius:9px; padding:7px 10px; font:600 12.5px system-ui; cursor:pointer; }
    .tw-search:hover,.tw-select:hover,.tw-search:focus,.tw-select:focus { border-color:var(--red); outline:none; }
    .tw-count { color:var(--ink-v); font:600 12.5px system-ui; font-variant-numeric:tabular-nums; margin-left:auto; }
    .chip { background:#fff; color:var(--ink-v); border:1px solid rgba(27,28,28,.15); border-radius:999px;
      padding:6px 13px; font:600 12.5px system-ui; cursor:pointer; }
    .chip:hover { border-color:var(--red); color:var(--red); }
    .chip.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
    .chip .n { opacity:.6; margin-left:5px; font-weight:500; }
    /* the table */
    .tablewrap { overflow-x:auto; }
    table { width:100%; min-width:1080px; border-collapse:separate; border-spacing:0; background:#fff;
      border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px;
      box-shadow:0 1px 3px rgba(0,0,0,.05); }
    th, td { text-align:left; padding:9px 11px; border-bottom:1px solid rgba(27,28,28,.08); white-space:nowrap; }
    thead th { position:sticky; top:0; z-index:1; background:#faf9f9; font-size:10.5px; font-weight:700;
      text-transform:uppercase; letter-spacing:.05em; color:var(--ink-v); }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:#faf9f9; }
    tbody tr:focus-visible { outline:2px solid var(--red); outline-offset:-2px; }
    .th-sort { padding:0; }
    .th-sort button { width:100%; text-align:inherit; background:none; border:none; cursor:pointer;
      font:inherit; color:inherit; padding:9px 11px; }
    .th-sort button:hover { color:var(--red); }
    .th-sort.is-sorted { color:var(--ink); }
    .t-name { font-weight:700; white-space:normal; min-width:180px; }
    /* The reason wraps — it's a sentence, not a field. Everything else stays on one line
       so the columns you scan down stay aligned. */
    .t-why { white-space:normal; min-width:240px; color:var(--ink-v); font-size:12.5px; }
    .soft { color:var(--ink-v); font-style:italic; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    /* Overdue is the one thing worth colouring, and it says "overdue" in words too —
       this page can be re-tinted by a synthesized dark theme. */
    .due-over { color:var(--red-dark); font-weight:700; }
    .due-soon { font-weight:600; }
    .never { color:var(--red-dark); font-weight:600; }
    /* state pills */
    .st { font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 8px; white-space:nowrap;
      border:1px solid var(--line); background:#e9e8e7; color:var(--ink-v); }
    .st-on { background:#dcf5e3; color:var(--ok); border-color:#b7e3c4; }
    .st-off { background:#e9e8e7; }
    .st-paused { background:#fdf6e3; color:var(--warn); border-color:#e8d9a8; }
    .st-lost { background:#f3e8e8; color:var(--red-dark); border-color:#e6cccc; }
    .st-done { background:#e7eef7; color:#264b8b; border-color:#c9d8ec; }
    /* row actions */
    .acts { display:flex; gap:5px; justify-content:flex-end; align-items:center; }
    .acts button, .acts select { background:#fff; color:var(--ink-v); border:1px solid rgba(27,28,28,.15);
      border-radius:7px; padding:4px 8px; font:600 12px system-ui; cursor:pointer; }
    .acts button:hover { color:var(--red); border-color:var(--red); }
    .empty,.loading { color:var(--ink-v); text-align:center; padding:40px; }
    .alert { color:var(--red-dark); font-size:12.5px; margin:0 0 10px; min-height:1em; }
    .alert:empty { display:none; }
    /* Log dialog — same shell as the Projects assign dialog. */
    .ov { position:fixed; inset:0; z-index:10100; background:rgba(20,18,18,.55);
      display:flex; align-items:center; justify-content:center; padding:20px; }
    .dlg { background:#fff; border-radius:14px; padding:22px; width:min(460px,96vw);
      box-shadow:0 24px 60px rgba(0,0,0,.3); }
    .dlg-h { font-size:17px; font-weight:800; }
    .dlg-sub { color:var(--ink-v); font-size:12.5px; margin:6px 0 16px; }
    .dlg label { display:block; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; color:var(--ink-v); margin:10px 0 4px; }
    .dlg select, .dlg input { width:100%; box-sizing:border-box; font:inherit; padding:9px 10px;
      border:1px solid rgba(27,28,28,.15); border-radius:8px; background:#fff; }
    .dlg select:focus, .dlg input:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
    .dlg-act { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
    .go { background:var(--red); color:#fff; border:none; border-radius:7px; padding:8px 15px;
      font:600 13px system-ui; cursor:pointer; }
    .go:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="top">
    <img class="logo" src="/img/treadwell-bison.svg" width="54" height="34" alt="Treadwell" />
    <h1>Follow-ups</h1>
  </div>
  <p class="hint">Every proposal that has been sent to a customer, and where its chase stands.
    Logging a call here takes it off tomorrow morning's digest.</p>
  <div class="wrap">
    <div id="filters" class="toolbar" hidden></div>
    <div id="toolbar" class="toolbar" hidden>
      <input id="q" type="search" class="tw-search" placeholder="Search project, customer, estimator…"
             aria-label="Search follow-ups" autocomplete="off" />
      <select id="est" class="tw-select" aria-label="Filter by estimator">
        <option value="">Any estimator</option>
      </select>
      <select id="sort" class="tw-select" aria-label="Sort by">
        <option value="score">Needs attention</option>
        <option value="due">Next reminder</option>
        <option value="chased">Last chased</option>
        <option value="quiet">Customer silence</option>
        <option value="name">Project</option>
        <option value="value">Value</option>
      </select>
      <button type="button" id="dir" class="tw-select" aria-label="Toggle sort direction">↓ Desc</button>
      <span id="count" class="tw-count" aria-live="polite"></span>
    </div>
    <p id="alert" class="alert"></p>
    <div id="list" class="loading">Loading follow-ups…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <!-- Shared person rendering (names, initials, avatar colours) — must precede the
       page script, which reads window.TWCrm as it runs. -->
  <script src="/js/crm-core.js"></script>
  <script src="/js/followups.js"></script>
</body>
</html>
