<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follow-ups · Treadwell Proposal Generator</title>
  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
  <!-- Styles itself, like portal.html and projects.html, so it needs its own opt-out:
       without it Chromium synthesizes a dark theme and flattens every near-white
       surface to one grey. There is no dark theme in this repo. -->
  <meta name="color-scheme" content="only light" />
  <style>
    :root { color-scheme: only light;
      --red:#c8102e; --red-dark:#9e001f; --ink:#1b1c1c; --ink-v:#5c403f;
      --surf:#f4f4f5; --line:rgba(27,28,28,.1); --ok:#0f7b34; --warn:#7a5c00; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--surf); color:var(--ink); padding:28px 22px 90px;
      font:400 14px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .top { display:flex; align-items:center; gap:14px; max-width:1360px; margin:0 auto 6px; }
    .logo { width:54px; height:34px; display:block; flex:none; }
    h1 { font-size:20px; margin:0; flex:1; }
    .wrap { max-width:1360px; margin:0 auto; }
    .hint { color:var(--ink-v); font-size:13px; margin:0 auto 16px; max-width:1360px; }
    /* toolbar — same shapes as Projects and the CRM board */
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 14px; }
    /* Both toolbars ship with the `hidden` attribute so they don't appear empty before the
       data lands — but the UA stylesheet's `[hidden]{display:none}` loses to the author
       `display:flex` directly above, so they showed anyway. Re-asserting it as an author
       rule is what makes `hidden` mean hidden. */
    .toolbar[hidden] { display:none; }
    .tw-search { flex:1; min-width:180px; max-width:300px; background:#fff; color:var(--ink);
      border:1px solid rgba(27,28,28,.15); border-radius:9px; padding:7px 12px; font:600 12.5px system-ui; }
    .tw-select { background:#fff; color:var(--ink-v); border:1px solid rgba(27,28,28,.15);
      border-radius:9px; padding:7px 10px; font:600 12.5px system-ui; cursor:pointer; }
    .tw-search:hover,.tw-select:hover,.tw-search:focus,.tw-select:focus { border-color:var(--red); outline:none; }
    .tw-count { color:var(--ink-v); font:600 12.5px system-ui; font-variant-numeric:tabular-nums; margin-left:auto; }
    .chip { background:#fff; color:var(--ink-v); border:1px solid rgba(27,28,28,.15); border-radius:999px;
      padding:6px 13px; font:600 12.5px system-ui; cursor:pointer; }
    .chip:hover { border-color:var(--red); color:var(--red); }
    .chip.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
    .chip .n { opacity:.6; margin-left:5px; font-weight:500; }
    /* the table */
    .tablewrap { overflow-x:auto; }
    table { width:100%; min-width:1080px; border-collapse:separate; border-spacing:0; background:#fff;
      border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13px;
      box-shadow:0 1px 3px rgba(0,0,0,.05); }
    th, td { text-align:left; padding:9px 11px; border-bottom:1px solid rgba(27,28,28,.08); white-space:nowrap; }
    thead th { position:sticky; top:0; z-index:1; background:#faf9f9; font-size:10.5px; font-weight:700;
      text-transform:uppercase; letter-spacing:.05em; color:var(--ink-v); }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:#faf9f9; }
    tbody tr:focus-visible { outline:2px solid var(--red); outline-offset:-2px; }
    .th-sort { padding:0; }
    .th-sort button { width:100%; text-align:inherit; background:none; border:none; cursor:pointer;
      font:inherit; color:inherit; padding:9px 11px; }
    .th-sort button:hover { color:var(--red); }
    .th-sort.is-sorted { color:var(--ink); }
    .t-name { font-weight:700; white-space:normal; min-width:180px; }
    /* The reason wraps — it's a sentence, not a field. Everything else stays on one line
       so the columns you scan down stay aligned. */
    .t-why { white-space:normal; min-width:240px; color:var(--ink-v); font-size:12.5px; }
    .soft { color:var(--ink-v); font-style:italic; }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    /* Overdue is the one thing worth colouring, and it says "overdue" in words too —
       this page can be re-tinted by a synthesized dark theme. */
    .due-over { color:var(--red-dark); font-weight:700; }
    .due-soon { font-weight:600; }
    .never { color:var(--red-dark); font-weight:600; }
    /* state pills */
    .st { font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 8px; white-space:nowrap;
      border:1px solid var(--line); background:#e9e8e7; color:var(--ink-v); }
    .st-on { background:#dcf5e3; color:var(--ok); border-color:#b7e3c4; }
    .st-off { background:#e9e8e7; }
    .st-paused { background:#fdf6e3; color:var(--warn); border-color:#e8d9a8; }
    .st-lost { background:#f3e8e8; color:var(--red-dark); border-color:#e6cccc; }
    .st-done { background:#e7eef7; color:#264b8b; border-color:#c9d8ec; }
    /* row actions */
    .acts { display:flex; gap:5px; justify-content:flex-end; align-items:center; }
    .acts button, .acts select { background:#fff; color:var(--ink-v); border:1px solid rgba(27,28,28,.15);
      border-radius:7px; padding:4px 8px; font:600 12px system-ui; cursor:pointer; }
    /* The one button that actually reaches the customer. Given emphasis because it sits next to
       "Log a call", which only writes to our own records — two buttons a keystroke apart with
       very different consequences. */
    .acts .go-send, .fu-acts .go-send { background:var(--red); color:#fff; border-color:var(--red); }
    .acts .go-send:hover, .fu-acts .go-send:hover { background:var(--red-dark); border-color:var(--red-dark); }
    .acts button:hover { color:var(--red); border-color:var(--red); }
    /* ── the sent-history panel ──
       One expanded project's follow-up log, opened from the Emails button. Its own row in the
       same table: it is a list of unknown length read beside the project it belongs to, which is
       neither a tooltip nor a dialog. White-space is reset because every other cell in this table
       is nowrap and these lines are sentences. */
    tr.fh-row > td { background:#faf9f9; white-space:normal; padding:10px 14px 13px; }
    tr.fh-row { cursor:default; }
    .fh-sum { margin:0 0 3px; font:700 12.5px system-ui; }
    .fh-note { margin:0 0 8px; color:var(--ink-v); font-size:11.5px; max-width:70ch; }
    .fh-bad { color:var(--red-dark); }
    .fh-list { list-style:none; margin:0; padding:0; display:grid; gap:3px; }
    .fh-line { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; font-size:12.5px;
      border-left:3px solid rgba(27,28,28,.15); padding:2px 0 2px 8px; }
    /* The automation's own sends, marked so they read apart from what a person did: this panel
       exists because those were invisible everywhere else on the page. */
    .fh-line.is-auto { border-left-color:var(--red); }
    .fh-k { font-weight:700; }
    .fh-d { color:var(--ink-v); }
    .fh-t { margin-left:auto; color:var(--ink-v); font-size:11.5px; white-space:nowrap;
      font-variant-numeric:tabular-nums; }
    .empty,.loading { color:var(--ink-v); text-align:center; padding:40px; }
    /* Warm amber, the same tokens the board's degraded banner uses, so an outage reads the same
       way on both pages rather than as two different problems. `[hidden]` re-asserted below the
       display rule for the reason recorded beside the element itself. */
    .fu-degraded { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600;
      background:#fdf6e3; border:1px solid #e8d9a8; color:#7a5c00; border-radius:8px;
      padding:8px 12px; margin:0 0 10px; }
    .fu-degraded[hidden] { display:none; }
    .alert { color:var(--red-dark); font-size:12.5px; margin:0 0 10px; min-height:1em; }
    .alert:empty { display:none; }
    /* ── List | Board switcher ── */
    .views { display:flex; gap:2px; margin-left:auto; background:#efeeec; border-radius:10px; padding:2px; }
    .views button { border:0; background:none; padding:6px 14px; border-radius:8px; cursor:pointer;
      font:600 12.5px system-ui; color:var(--ink-v); }
    .views button[aria-pressed="true"] { background:#fff; color:var(--red-dark);
      box-shadow:0 1px 2px rgba(27,28,28,.12); }

    /* ── the board ── */
    #list.boardwrap { overflow-x:auto; padding-bottom:6px; }
    .fu-board { display:grid; grid-template-columns:repeat(6, minmax(224px, 1fr)); gap:10px;
      align-items:start; }
    .fu-col { background:#efeeec; border:1px solid var(--line); border-radius:12px; padding:8px;
      display:flex; flex-direction:column; gap:7px; min-height:180px; }
    /* A column the CUSTOMER owns. Dashed, and never a drop target — dragging a card into
       "Viewed" would assert that somebody opened a proposal they never opened, and that fact
       feeds the digest's ranking and its 6 AM sentence. */
    .fu-col.theirs { background:#f6f5f3; border-style:dashed; }
    .fu-col.over { outline:2px dashed var(--red); outline-offset:-3px; background:#fdf5f6; }
    .fu-chead { display:flex; align-items:center; gap:6px; padding:2px 3px 3px; }
    .fu-chead b { font:700 10.5px system-ui; text-transform:uppercase; letter-spacing:.07em; }
    .fu-chead .n { font:600 11px system-ui; color:var(--ink-v); font-variant-numeric:tabular-nums; }
    .fu-chead .v { margin-left:auto; font:600 11px system-ui; color:var(--ink-v);
      font-variant-numeric:tabular-nums; }
    .fu-dot { width:8px; height:8px; border-radius:50%; flex:none; }
    .fu-csub { font-size:10.5px; color:var(--ink-v); padding:0 3px 3px; margin:-3px 0 0; }
    .fu-lock { font:700 8.5px system-ui; letter-spacing:.05em; text-transform:uppercase;
      background:rgba(27,28,28,.08); color:var(--ink-v); border-radius:4px; padding:1px 5px; }

    /* ── card ── */
    .fu-card { background:#fff; border:1px solid var(--line); border-left:3px solid #4a6b8a;
      border-radius:9px; padding:8px 9px; box-shadow:0 1px 1px rgba(27,28,28,.05);
      text-align:left; width:100%; font:inherit; color:inherit; cursor:grab; display:block; }
    .fu-card:hover { box-shadow:0 4px 14px rgba(27,28,28,.10); }
    .fu-card:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
    .fu-card.theirs { cursor:default; }
    .fu-card.dragging { opacity:.45; }
    /* Colour = NEGLECT, not stage. The column already says the stage; this says how long it
       has been ignored, which is the only reason to look at this page. */
    .fu-card.cold { border-left-color:#b3261e; background:#fdf1f0; }
    .fu-card.warm { border-left-color:#9a5b00; background:#fdf6e8; }
    .fu-name { font:600 12.5px/1.3 system-ui; margin:0 0 3px; }
    .fu-cust { font-size:11px; color:var(--ink-v); margin:0 0 6px; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; }
    .fu-meta { display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-v);
      font-variant-numeric:tabular-nums; }
    .fu-meta .amt { margin-left:auto; font-weight:600; color:var(--ink); }
    .fu-quiet { margin-top:5px; font-size:10px; color:var(--ink-v); font-variant-numeric:tabular-nums; }
    .fu-quiet b { color:#b3261e; }
    /* The digest's own sentence, verbatim from the server — re-deriving it here is how a
       board ends up disagreeing with the email it exists to explain. */
    .fu-why { margin:6px 0 0; padding-top:6px; border-top:1px solid rgba(27,28,28,.07);
      font-size:10.5px; line-height:1.42; color:var(--ink-v); }
    /* "email link opened" — evidence the notification reached a mailbox, on a proposal nobody
       has opened yet. Deliberately quiet and green-ish: it is reassurance, not an action, and
       it must not read like the customer viewed the bid. */
    /* What WE are doing, on the card rather than as a column — it is an attribute of a
       proposal, not a place one lives, and making it a column is what let the board and the
       table disagree about the same proposal. */
    .fu-auto { font:700 8.5px system-ui; letter-spacing:.05em; text-transform:uppercase;
      border-radius:4px; padding:2px 5px; white-space:nowrap; border:1px solid transparent; }
    .fu-auto.is-chasing { background:#dcf5e3; color:var(--ok); border-color:#b7e3c4; }
    .fu-auto.is-paused { background:#fdf6e3; color:var(--warn); border-color:#e8d9a8; }
    .fu-auto.is-off { background:#e9e8e7; color:var(--ink-v); border-color:var(--line); }
    /* How they saw it, on the Seen column only. A portal view means a person definitely looked;
       an email click is weaker, so the two are not coloured the same. */
    .fu-seen { margin:5px 0 0; font-size:10px; }
    .fu-seen.is-portal { color:var(--ok); }
    .fu-seen.is-email { color:var(--ink-v); }
    .fu-unread { background:var(--red); color:#fff; font:700 9px system-ui; border-radius:999px;
      padding:1px 6px; margin-left:auto; }
    .fu-acts { display:flex; gap:4px; margin-top:7px; }
    .fu-acts button { background:#fff; border:1px solid rgba(27,28,28,.15); border-radius:6px;
      padding:2px 7px; font:600 10.5px system-ui; color:var(--ink-v); cursor:pointer; }
    .fu-acts button:hover { color:var(--red); border-color:var(--red); }
    .fu-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:11.5px;
      color:var(--ink-v); align-items:center; }
    .fu-legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
    @media (max-width:1100px) { .fu-board { grid-template-columns:repeat(3, minmax(224px,1fr)); } }
    @media (max-width:700px)  { .fu-board { grid-template-columns:1fr; } }

    /* Log dialog — same shell as the Projects assign dialog. */
    .ov { position:fixed; inset:0; z-index:10100; background:rgba(20,18,18,.55);
      display:flex; align-items:center; justify-content:center; padding:20px; }
    .dlg { background:#fff; border-radius:14px; padding:22px; width:min(460px,96vw);
      box-shadow:0 24px 60px rgba(0,0,0,.3); }
    .dlg-h { font-size:17px; font-weight:800; }
    .dlg-sub { color:var(--ink-v); font-size:12.5px; margin:6px 0 16px; }
    .dlg label { display:block; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; color:var(--ink-v); margin:10px 0 4px; }
    .dlg select, .dlg input { width:100%; box-sizing:border-box; font:inherit; padding:9px 10px;
      border:1px solid rgba(27,28,28,.15); border-radius:8px; background:#fff; }
    .dlg select:focus, .dlg input:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
    .dlg-act { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
    .go { background:var(--red); color:#fff; border:none; border-radius:7px; padding:8px 15px;
      font:600 13px system-ui; cursor:pointer; }
    .go:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="top">
    <img class="logo" src="/img/treadwell-bison.svg" width="54" height="34" alt="Treadwell" />
    <h1>Follow-ups</h1>
    <div class="views" role="group" aria-label="View">
      <button type="button" id="v-list" data-view="list">List</button>
      <button type="button" id="v-board" data-view="board">Board</button>
    </div>
  </div>
  <p class="hint" id="hint">Every proposal that has been sent to a customer, and where its chase
    stands. Press Emails on a row to see what the automation has already sent and who got it.
    Logging a call here takes it off tomorrow morning's digest.</p>
  <div class="wrap">
    <div id="filters" class="toolbar" hidden></div>
    <div id="toolbar" class="toolbar" hidden>
      <input id="q" type="search" class="tw-search" placeholder="Search project, customer, estimator…"
             aria-label="Search follow-ups" autocomplete="off" />
      <select id="est" class="tw-select" aria-label="Filter by estimator">
        <option value="">Any estimator</option>
      </select>
      <select id="sort" class="tw-select" aria-label="Sort by">
        <option value="score">Needs attention</option>
        <option value="due">Next reminder</option>
        <option value="chased">Last chased</option>
        <option value="quiet">Customer silence</option>
        <option value="name">Project</option>
        <option value="value">Value</option>
      </select>
      <button type="button" id="dir" class="tw-select" aria-label="Toggle sort direction">↓ Desc</button>
      <span id="count" class="tw-count" aria-live="polite"></span>
    </div>
    <p id="alert" class="alert"></p>
    <!-- Same banner, same tokens and the same [hidden] guard as the board's #crm-degraded: a class
         `display:flex` outranks the hidden ATTRIBUTE, which this repo has shipped as a bug four
         times (test_hidden_is_actually_hidden.py). Outside #list so a repaint of the list, in
         either view, cannot take the explanation away with it. -->
    <div id="fu-degraded" class="fu-degraded" hidden></div>
    <div id="list" class="loading">Loading follow-ups…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <!-- Shared person rendering (names, initials, avatar colours) — must precede the
       page script, which reads window.TWCrm as it runs. -->
  <script src="/js/crm-core.js"></script>
  <!-- Board columns, drop rules and the cadence plan for a drag — pure, tested under node.
       Must precede the page script, which reads window.TWFu as it runs. -->
  <script src="/js/followups-core.js"></script>
  <script src="/js/followups.js"></script>
</body>
</html>
