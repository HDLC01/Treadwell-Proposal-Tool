<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notification Sending · Treadwell Proposal Generator</title>
<link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
<style>
  :root { --red:#c8102e; --red-dark:#9e001f; --ink:#1b1c1c; --ink-v:#5c403f;
    --surf:#fbf9f8; --surf-low:#f5f3f3; --surf-high:#e9e8e7; --line:#e4e2e2; --ok:#1f7a34; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--surf); color:var(--ink);
    font:400 14px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { padding:24px 28px 64px; max-width:880px; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.01em; margin:0 0 2px; }
  .sub { color:var(--ink-v); margin:0 0 18px; font-size:13px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--ink-v); margin-bottom:8px; }
  .note { color:var(--ink-v); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px;
    padding:7px 12px; font-size:13px; font-weight:700; background:var(--surf-high); color:var(--ink-v); }
  .chip.can { cursor:pointer; }
  .chip.on { background:#dcf5e3; color:#0f7b34; border-color:#bfe3c8; }
  .chip .em { font-weight:400; font-size:11px; opacity:.8; }
  /* "also on deposits" / "also on the team" — the same address may sit on BOTH rosters (a row's
     unique key is kind + email), and that is a deliberate "everything, deposits included", not a
     duplicate to be tidied away. Outlined in the chip's OWN colour rather than given a tint of its
     own: on this card colour already means receives / off, and a third hue would read as a third
     state. Rejected alternative: a warning-amber badge — it says "conflict", which this isn't. */
  .chip .also { font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.04em;
    border:1px solid currentColor; border-radius:999px; padding:1px 6px; opacity:.75; }
  .chip .x { border:none; background:none; color:inherit; cursor:pointer; font-size:15px; line-height:1; padding:0; }
  .addrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .addrow input { flex:1; min-width:220px; min-height:40px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .btn { min-height:40px; padding:0 16px; border-radius:7px; border:1px solid transparent; font:inherit; font-weight:700; cursor:pointer; }
  .btn-p { background:var(--red-dark); color:#fff; } .btn-p:hover { background:var(--red); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .alert { font-size:13px; margin:6px 0; min-height:1em; }
  .alert.err { color:var(--red-dark); }
  .alert.ok { color:var(--ok); }
  /* per-project card */
  .pp-search { width:100%; max-width:420px; min-height:38px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; margin:2px 0 12px; }
  /* Active / Won / Lost / Test. The CRM board's pill shape, copied rather than shared: these
     rules live in portal.html's own <style> — there is no stylesheet for them to come from, and
     this page loads none. Deliberately NOT this page's own .chip, which already means "a person,
     and green means they receive": a tab wearing that class would make green ambiguous on the one
     screen where green is the whole point. */
  .tw-tabs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px; }
  .tw-tab { background:#fff; color:var(--ink-v); border:1px solid var(--line); border-radius:999px;
    min-height:34px; padding:0 13px; font:700 13px system-ui; cursor:pointer; display:inline-flex;
    align-items:center; gap:6px; }
  .tw-tab:hover { border-color:var(--red); color:var(--red); }
  .tw-tab[aria-pressed="true"] { background:var(--red-dark); border-color:var(--red-dark); color:#fff; }
  .tw-tab .n { font-size:11px; font-weight:800; font-variant-numeric:tabular-nums;
    background:var(--surf-high); color:var(--ink-v); border-radius:999px; padding:1px 6px; }
  .tw-tab[aria-pressed="true"] .n { background:rgba(255,255,255,.22); color:#fff; }
  /* Pagination: quiet by design — it is navigation for a list, not a control anyone came here
     to use. Real <button>s so Tab reaches them and Enter/Space work with no key handling. */
  .pp-pager { display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  /* `hidden` is a UA rule (`[hidden] { display: none }`) and a class rule beats it on specificity,
     so `display:flex` above silently un-hid the pager: a staging walk found "Page 1 of 1 · 10
     projects" with both arrows dead, sitting under a list that fits on one page. The JS was right
     all along — it sets .hidden — which is why no DOM-level test could see this. */
  .pp-pager[hidden] { display:none; }
  .pp-pg { min-height:32px; padding:0 12px; border:1px solid var(--line); border-radius:999px;
    background:#fff; color:var(--ink-v); font:700 12px system-ui; cursor:pointer; }
  .pp-pg:hover:not(:disabled) { border-color:var(--red); color:var(--red); }
  .pp-pg:disabled { opacity:.45; cursor:not-allowed; }
  .pp-pgn { color:var(--ink-v); font-size:12px; font-variant-numeric:tabular-nums; }
  .pp-row { padding:12px 0; border-top:1px solid var(--line); }
  .pp-row:first-child { border-top:none; }
  .pp-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .pp-name { font-weight:700; }
  .pp-cust { color:var(--ink-v); font-size:12px; }
  .pp-badge { background:#fff4d6; color:#8a6d00; border:1px solid #f0e0a8; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; }
  /* Only ever drawn on the Lost tab, the one tab where scratch work and real dead deals sit
     together. Grey, not amber: it labels what a row IS, it is not an exception to notice. */
  .pp-badge-test { background:var(--surf-high); color:var(--ink-v); border-color:var(--line); }
  .pp-reset { border:none; background:none; color:var(--red-dark); font:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:0; }
  .nt-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .nt-chip { border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:12px; font-weight:700; cursor:pointer;
    background:var(--surf-high); color:var(--ink-v); }
  .nt-chip.on { background:#dcf5e3; color:#0f7b34; border-color:#bfe3c8; }
  .nt-chip:disabled { cursor:not-allowed; opacity:.6; }
  /* The avatar inside a toggle chip, deliberately colourless — NOT the shared .tw-av.
     On this control colour IS the state (green = receives this project's email), so an
     identity colour would compete with the one signal that matters. It borrows the chip's
     own on/off tint instead of carrying its own, and keeps .tw-av's geometry so a name
     still sits at the same height as everywhere else. Same class and same reasoning as
     portal.html, which carries this control in the CRM drawer. */
  .nt-chip .nt-av { display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; margin-right:5px; flex:0 0 auto;
    font:800 9.5px/1 system-ui; letter-spacing:.02em; vertical-align:middle; text-transform:uppercase;
    background:rgba(27,28,28,.09); color:var(--ink-v); }
  .nt-chip.on .nt-av { background:rgba(15,123,52,.15); color:#0f7b34; }
</style>
</head>
<body>
  <div class="wrap" id="root">
    <h1>Notification Sending</h1>
    <p class="sub">Loading…</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <!-- Shared person rendering (names, initials, avatar colours) — one source of
       truth so an estimator looks identical on every page. Must precede the page's
       own script, which reads window.TWCrm as it runs. -->
  <script src="/js/crm-core.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
