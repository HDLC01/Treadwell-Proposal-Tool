<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potential BD Contacts · BD CRM · Treadwell</title>
  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
  <!-- Warm the jsdelivr connection (DNS + TLS, no bytes) before the parser reaches the CDN script tag below. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- One light theme, like every page of the tool: no synthesized dark mode. -->
  <meta name="color-scheme" content="only light" />
  <link rel="stylesheet" href="/bd/bd.css" />
</head>
<body class="bd-app">
  <!-- Potential BD Contacts (#809): BD's review.html moved in as it is today, restyled like the tool.
       Its route (GET /api/bd/review/candidates) is not built yet: the page shows the server's own
       "not built yet" sentence. Building it is #816. bd-review.js fills #rv-body. -->
  <main class="page rv-page" id="main">
    <header class="page-head">
      <p class="eyebrow">BD CRM</p>
      <h1 class="page-title" id="rv-title" tabindex="-1">Potential BD Contacts</h1>
      <p class="page-sub">People from recent direct quotes who are not on the list yet.</p>
    </header>

    <div class="tabs rv-views" role="group" aria-label="Show" id="rv-views">
      <button type="button" data-view="new" aria-pressed="true">To review <span class="count" data-count="new">0</span></button>
      <button type="button" data-view="added" aria-pressed="false">Added <span class="count" data-count="added">0</span></button>
      <button type="button" data-view="ignored" aria-pressed="false">Not added <span class="count" data-count="ignored">0</span></button>
    </div>

    <section class="rv-list" id="rv-body" aria-label="People from recent quotes" aria-busy="true">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/js/icons.js"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <script src="/js/crm-core.js"></script>
  <script src="/bd/js/bd-api.js"></script>
  <script src="/bd/js/bd-shared.js"></script>
  <script src="/bd/js/bd-core.js"></script>
  <script src="/bd/js/bd-review.js"></script>
</body>
</html>
