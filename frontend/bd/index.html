<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />

  <meta name="color-scheme" content="only light" />

<body class="bd-app">

    <header class="page-head">
      <p class="eyebrow">This Week</p>
      <h1 class="page-title" id="bd-greeting">This Week</h1>
      <p class="page-sub hm-role" id="bd-role" role="status" aria-live="polite">Loading your BD role...</p>
    </header>
    <section class="card hm-note" id="bd-home-note" aria-label="This Week" hidden>
      <p class="hm-note-text" id="bd-home-note-text"></p>
    </section>
  </main>
