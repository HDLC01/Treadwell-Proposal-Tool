<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · BD CRM · Treadwell</title>
  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
  <!-- Warm the jsdelivr connection (DNS + TLS, no bytes) before the parser reaches the CDN script tag below. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- One light theme, like every page of the tool: no synthesized dark mode. -->
  <meta name="color-scheme" content="only light" />
  <link rel="stylesheet" href="/bd/bd.css" />
</head>
<body class="bd-app">
  <!-- One BD contact (#808): BD's contact.html moved in, restyled like the tool. bd-contact.js fills
       #cd-root; the skeleton below shows until the contact loads. The call sheet is This Week's
       (bd-call.js), the one copy. -->
  <main class="page cd-page" id="main">
    <div id="cd-root" aria-busy="true">
      <div class="cd-skel-head">
        <div class="skeleton cd-skel-avatar"></div>
        <div class="cd-skel-lines">
          <div class="skeleton cd-skel-line cd-skel-wide"></div>
          <div class="skeleton cd-skel-line"></div>
        </div>
      </div>
      <div class="layout-2 cd-layout">
        <div class="cd-main">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card cd-skel-tall"></div>
        </div>
        <div class="cd-side">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card cd-skel-tall"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/js/icons.js"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <script src="/js/crm-core.js"></script>
  <script src="/bd/js/bd-api.js"></script>
  <script src="/bd/js/bd-shared.js"></script>
  <script src="/bd/js/bd-core.js"></script>
  <script src="/bd/js/bd-call.js"></script>
  <script src="/bd/js/bd-contact.js"></script>
</body>
</html>
