<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History · Treadwell Proposal Generator</title>
  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
  <style>
    :root { --red:#c8102e; --ink:#1b1c1c; --ink-v:#5c403f; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f4f5; color:var(--ink); font:400 14px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:28px 22px 90px; }
    .top { display:flex; align-items:center; gap:14px; max-width:900px; margin:0 auto 20px; }
    .logo { width:54px;height:34px;display:block;flex:none; }
    h1 { font-size:20px; margin:0; flex:1; }
    .wrap { max-width:900px; margin:0 auto; }
    .row { display:flex; gap:12px; padding:12px 14px; background:#fff; border:1px solid rgba(27,28,28,.1); border-radius:10px; margin-bottom:8px; align-items:baseline; box-shadow:0 1px 3px rgba(0,0,0,.04); }
    .dot { width:8px;height:8px;border-radius:50%;background:#c7c4c2;flex:none;align-self:center; }
    .dot.generated { background:#1a7f37; } .dot.created { background:#1f6feb; }
    .dot.banned,.dot.deleted_user,.dot.deleted_project { background:#c8102e; } .dot.role_changed,.dot.status_changed,.dot.unbanned { background:#bf8700; }
    .who { font-weight:700; } .act { color:var(--ink-v); } .proj { font-weight:600; }
    .total { color:#1a7f37; } .when { margin-left:auto; color:#8a8a8a; font-size:12px; white-space:nowrap; }
    .empty,.loading { color:var(--ink-v); text-align:center; padding:40px; }
  </style>
</head>
<body>
  <div class="top"><img class="logo" src="/img/treadwell-bison.svg" width="54" height="34" alt="Treadwell" /><h1>History</h1><a href="/projects.html" style="color:var(--red);text-decoration:none;font-weight:600;">← Projects</a></div>
  <div class="wrap"><div id="feed" class="loading">Loading activity…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <!-- Shared person rendering (names, initials, avatar colours) — one source of
       truth so an estimator looks identical on every page. Must precede the page's
       own script, which reads window.TWCrm as it runs. -->
  <script src="/js/crm-core.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
