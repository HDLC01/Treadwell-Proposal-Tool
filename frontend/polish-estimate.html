<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estimating Tool v2 · Estimate · Treadwell Proposal Generator</title>
  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
  <!-- Warm the jsdelivr connection (DNS + TLS, no bytes) before the parser reaches the CDN script tag below. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- Styles itself, like library.html and followup-settings.html, so it needs its own opt-out. -->
  <meta name="color-scheme" content="only light" />
  <style>
    :root { color-scheme: only light;
      --red:#c8102e; --red-dark:#9e001f; --red-tint:#fbe9ec;
      --ink:#1b1c1c; --ink-v:#5c403f; --ink-3:#8a7a79;
      --surf:#f4f4f5; --card:#ffffff; --surf-low:#f3f1ea;
      --line:rgba(27,28,28,.11); --line-2:rgba(27,28,28,.06);
      --ok:#0f7b34; --warn:#7a5c00; --warn-bg:#fdf6e3;
      --amber:#ffcf3f; --amber-ink:#b26a00;
      --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
      --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --r:12px; --r-s:7px; --shadow:0 1px 3px rgba(0,0,0,.05); }
    *{box-sizing:border-box}
    /* THE PAGE'S BOTTOM PADDING IS THE TOTAL BAR'S HEIGHT AND 24px OF AIR (2026-10-21, the audit of the sixth round). The bar (.bid, below) is position:fixed, so it takes no room in the page, and the
       step's last row, Back / Next, has to end above it. The bar is not a fixed height: with the staff sidebar open it wraps its sums onto a second row, 154px tall at 1000px in Chrome against 84px of
       one row, and the 132px this padding was left that row 21px under it. js/polish-estimate.js reads the bar's height and writes it onto the html element as --bid-h (a ResizeObserver on the bar,
       with a fallback on its repaint and the window's resize); 132px stands until it has, which is what the page reserved before. backend/tests/test_v2_bid_bar_height.py reads this rule and runs
       the script. */
    body{margin:0;background:var(--surf);color:var(--ink);font:400 14px/1.55 var(--sans);
         padding:0 22px calc(var(--bid-h,132px) + 24px)}
    [hidden]{display:none!important}
    .wrap{max-width:1000px;margin:0 auto}

    .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
    .head h1{font-size:20px;margin:0 0 3px;letter-spacing:-.01em}
    .head p{margin:0;color:var(--ink-v);font-size:13px}
    .beta{font:700 10px/1 var(--sans);letter-spacing:.09em;background:var(--red-tint);
          color:var(--red-dark);border:1px solid var(--line);border-radius:20px;
          padding:5px 9px;white-space:nowrap;margin-left:auto}

    /* ── THE STEPS LIVE IN THE TOP BAR, as on the intake page (polish-intake.html) ─────────────────────────────
       auth.js (initShell) finds `header.topbar` and folds the burger, .brand, .progress and the bell into ONE row;
       it keeps only .brand and .progress and destroys anything else inside the header. This page does not link
       styles.css, so the rules the bar needs are ported from it here in this page's own tokens, scoped to
       header.topbar so nothing else on the page changes. The bar runs edge to edge: the body's side padding is
       taken back by the sticky head around it (.v2head, below), and the bar is 8px shorter above and below than the
       intake page's, because on this page it stays on screen. */
    header.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;
      padding:8px 24px;border-bottom:1px solid var(--line);background:var(--card)}
    header.topbar .brand{display:flex;align-items:center;gap:12px}
    header.topbar .brand-mark{display:block;width:58px;height:36px;flex:none}
    header.topbar .brand-name{font-weight:800;font-size:16px}
    header.topbar .brand-sub{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-v)}
    header.topbar .progress{display:flex;gap:4px;flex-wrap:wrap}
    header.topbar .progress .step{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-v);
      padding:4px 10px;border-radius:99px;background:var(--surf-low);text-decoration:none;cursor:pointer;
      transition:background .15s}
    header.topbar .progress a.step:hover{background:var(--red-tint);color:var(--red-dark)}
    header.topbar .progress .step.active{background:var(--red);color:#fff;font-weight:700;cursor:default}
    header.topbar .progress .step.active:hover{background:var(--red);color:#fff}
    @media (max-width:768px){
      header.topbar{flex-direction:column;align-items:flex-start;gap:8px;padding:10px 14px}
      header.topbar .progress{flex-wrap:wrap;justify-content:flex-start;gap:4px}
      header.topbar .progress .step{font-size:10px;padding:3px 8px}
    }
    @media (max-width:480px){
      header.topbar .brand-sub{display:none}
      header.topbar .progress .step{font-size:9px;letter-spacing:.03em}
    }

    /* ── THE STICKY HEAD (Hanz, 2026-10-20: "that header bar when estimating in v2 should be sticky") ─────────────
       The top bar and, directly under it, the sheet bar are ONE block that stays at the top of the screen while the
       steps scroll under it, so a sheet can be opened, copied or made the base from Material, Labor and Review alike
       without going back up. The page runs: this block, the page heading, the step rail, the step.

       THE BAR AND THE SHEETS ARE SIBLINGS IN IT. auth.js folds the burger, brand, steps and bell into header.topbar's
       one row and destroys whatever else is in that header, so the sheets cannot live inside it.

       WIDTH. It takes the body's side padding back (the negative margin) so the bar and its background run edge to
       edge, and the sheets inside it are held to the page column (see .sheets). It is a child of body, so the
       sidebar's body margin-left moves it with the rest of the page.

       STACKING. 30: over the page (the bid bar at the bottom is 9) and under every overlay the shell draws: the
       toasts 9990, the sidebar 9998, the notification panel 10001 and the modal scrim 10100 (auth.js, shared.js).

       STICKY ONLY WHERE IT HAS ROOM. On a phone or a narrow window (820px wide and under, where the top bar also stacks
       into two rows) or a short one (540px tall and under) pinned it would leave the step a sliver, so it is in the normal
       flow there. A 1080p laptop at 150% (about 600px tall) keeps it pinned. The order is the same either way.
       AND NEVER TALLER THAN MOST OF THE WINDOW: with the Add-sheet list or a description open it can grow, so past 70% of
       the window it scrolls inside itself rather than covering the step.

       NOTHING SCROLLED TO MAY STOP BEHIND IT. html's scroll-padding-top is the block's height, kept in --v2head-h by
       js/polish-estimate.js (a ResizeObserver on #v2head, with a fallback for a browser without one) and put back to
       nothing wherever the block is static. The few pixels on top of the height keep a focus ring in view.
       ONE COST, FOUND IN A BROWSER: a control IN the head sits inside that padded-off band, so a plain focus() on it scrolls
       the page up to put it below the head (a click on Add sheet threw a scrolled page to the top). Whatever focuses a
       control in the head passes preventScroll: focusSheetsKey and the tab arrow keys, in js/polish-estimate.js.
       AND TYPING OR TABBING IN THE HEAD (2026-10-20 audit, in Chrome): every keystroke in the Rename or Description box,
       and every Tab between the head's controls, scrolled the page about 100px up for the same reason, and preventScroll
       cannot reach a browser's own caret-follow or Tab. So while focus is anywhere in the head the padding is nothing:
       the head is pinned, so what is focused in it is already on screen. */
    .v2head{position:sticky;top:0;z-index:30;margin:0 -22px 22px;background:var(--surf);
      box-shadow:0 6px 10px -8px rgba(27,28,28,.3);max-height:70vh;overflow-y:auto}
    html{scroll-padding-top:calc(var(--v2head-h,0px) + 6px)}
    html:has(#v2head :focus-within){scroll-padding-top:0}
    @media (max-width:820px),(max-height:540px){
      .v2head{position:static;box-shadow:none}
      html{scroll-padding-top:0}
    }

    /* The beta works on a test COPY of a real project (see polish-sandbox.js). Silently editing a
       different project than the one that was clicked would be worse than the bug that fixes, so
       the copy says so before anything can be typed. Amber, like every other "this figure was
       touched by hand" mark in the tool. */
    .sandbox{display:flex;gap:9px;align-items:flex-start;background:var(--warn-bg);
          border:1px solid #e8d9a8;color:var(--warn);border-radius:9px;padding:10px 13px;
          font-size:12.5px;margin:0 0 12px}
    .sandbox b{color:var(--ink)}
    .sandbox .ic{font-size:14px;line-height:1.25;flex:none}

    .alert{font-size:12.5px;margin:0 0 12px;color:var(--red-dark);min-height:1em}
    .alert:empty{display:none}
    .alert.ok{color:var(--ok)}
    .loading{color:var(--ink-v);text-align:center;padding:44px}

    /* sub-step rail */
    .rail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
          box-shadow:var(--shadow);padding:5px;display:flex;gap:2px;overflow-x:auto;margin:0 0 14px}
    .rail button{flex:1 0 auto;display:flex;align-items:center;gap:8px;background:none;border:0;
          border-radius:9px;padding:9px 12px;cursor:pointer;color:var(--ink-v);
          font:600 12.5px var(--sans);white-space:nowrap}
    .rail button:hover{background:var(--surf-low)}
    .rail button[aria-current="true"]{background:var(--red-tint);color:var(--red-dark)}
    .pip{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;
         font:700 10.5px var(--mono);border:1.5px solid var(--line);color:var(--ink-3)}
    .rail button[aria-current="true"] .pip{background:var(--red);color:#fff;border-color:transparent}
    .pip.ok{background:var(--ok);border-color:transparent;color:#fff}
    .pip.att{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}

    /* ── THE SHEET BAR (js/bid-model.js sheetsPanelHtml, painted by js/polish-estimate.js) ────────────────────────
       The bid's sheets as TABS, the way the live estimate draws its worksheet tabs, under the four steps in the top bar
       (Hanz, 2026-10-19). It was a floating panel (2026-10-13), and a widget over the page is not a place an estimator
       navigates from. Since 2026-10-20 it sits in the sticky head (.v2head, above), directly under the top bar, on every bid:
         ROW 1  .sh-strip: one tab a sheet (the base-bid radio, the name, the price; double-click or F2 renames it)
                when the bid has the pair, and + Add sheet last. It scrolls sideways on a narrow screen, never the page.
         ROW 2  .sh-open: the open sheet only, its type and its controls, laid out in a row that wraps.
       The open tab is white and joined to the bar below it (its 1px overlap rubs out the strip's baseline); the base
       sheet carries a red top edge.

       THE LOOK IS THIS PAGE'S OWN TOKENS. This page does not load styles.css, so the shared .options-panel rules
       are not here, and they hard-code a grey and a red this page does not use. Reused instead: .kindpick (the pill
       button), .mw-sw (the switch), .btn and .x. Anything the page already had, restyled for the bar only, is
       scoped under .sheets, so no other control on the page moves. The readable small lines use --ink-v: --ink-3 is
       about 4.1:1 on white, under what 11.5px text needs. */
    /* The side padding holds the bar to the page's column (the .wrap below is 1000px and centred, with the body's 22px each side), while
       the background and the line under it run the full width of the head. */
    .sheets{margin:0;padding:8px max(22px,calc((100% - 1000px) / 2));background:var(--surf);border-bottom:1px solid var(--line);
      font:400 13px/1.45 var(--sans);color:var(--ink);text-align:left}
    .sheets .tw-ico{flex:none;pointer-events:none}
    .sheets .sh-warn{display:flex;gap:7px;margin:0 0 6px;background:var(--warn-bg);border:1px solid #e8d9a8;
      border-radius:9px;padding:5px 9px;font-size:11px;line-height:1.35;color:var(--warn)}
    .sheets .sh-warn .tw-ico{margin-top:1px}
    .sheets .btn{display:inline-flex;align-items:center;gap:7px;line-height:1.2;white-space:nowrap}
    .sheets .btn:active{transform:translateY(1px)}
    .sheets .btn.sm{padding:5px 11px;font-size:12px}
    .sheets .x{padding:3px;border-radius:var(--r-s)}

    /* ROW 1. The strip is the scroller; the list inside it is as wide as its tabs (max-content), so a long bid scrolls
       the strip and not the page. Its last pixel row is the baseline the open tab rubs out. */
    .sheets .sh-stripwrap{position:relative}
    .sheets .sh-strip{overflow-x:auto;overflow-y:hidden;padding:6px 6px 1px;background:var(--surf-low);
      background-image:linear-gradient(var(--line),var(--line));background-repeat:no-repeat;background-position:0 100%;
      background-size:100% 1px;border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
    .sheets .sh-list{list-style:none;margin:0;padding:0;display:flex;align-items:flex-end;gap:3px;min-width:max-content}
    .sheets .sh-tab{display:flex;align-items:center;padding:0 10px 0 3px;background:rgba(27,28,28,.045);
      border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
    .sheets .sh-tab:hover{background:rgba(27,28,28,.08)}
    /* THE OPEN TAB is the one with the red edge; the base says "Base" in its tab (2026-10-20: a red edge on the base read
       as a second selected tab). */
    .sheets .sh-tab.base .sh-basetag{flex:none;font:700 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--card);background:var(--ink);border-radius:999px;padding:2px 6px}
    /* "Bid N": the sheet is the base bid of its own proposal (Create Multiple Proposals). Outlined, so it never reads as the base's tag. */
    .sheets .sh-bidtag{flex:none;font:700 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;
      color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:1px 6px;margin-left:4px}
    .sheets .sh-tab.open{position:relative;z-index:1;margin-bottom:-1px;padding-bottom:1px;background:var(--card);
      box-shadow:inset 0 3px 0 var(--red)}
    .sheets .sh-addbtn.on{background:var(--red-tint);color:var(--red-dark)}
    /* The pair priced together as the base, asked from either sheet's bar (the strip's dashed "Epoxy + Polish" tab until 2026-10-21). */
    .sheets .sh-combine .sh-cmb{color:var(--ink-v);font-variant-numeric:tabular-nums}
    .sheets .sh-slot{display:flex;align-items:center;justify-content:center;width:22px;height:32px}
    .sheets .sh-slot:empty{width:8px}
    .sheets .sh-radio{width:15px;height:15px;margin:0;accent-color:var(--red-dark);cursor:pointer}
    .sheets .sh-name{display:flex;align-items:baseline;gap:8px;min-width:0;background:none;border:0;
      border-radius:var(--r-s);padding:8px 2px;font:600 13px var(--sans);color:var(--ink-v);text-align:left;cursor:pointer;
      white-space:nowrap}
    .sheets .sh-name.static{cursor:default}
    .sheets .sh-tab.open .sh-name{color:var(--red-dark);cursor:default}
    .sheets .sh-name:focus-visible,.sheets .sh-radio:focus-visible{outline:2px solid var(--red);outline-offset:1px}
    .sheets .sh-nm{max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sheets .sh-price{flex:none;font:600 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
    .sheets .sh-price.none{font-weight:400;color:var(--ink-v)}
    .sheets .sh-ren-in{width:16ch;min-width:0;margin:3px 0;font:600 13px var(--sans);color:var(--ink);background:var(--card);
      border:1px solid var(--red);border-radius:var(--r-s);padding:4px 6px;outline:2px solid var(--red);outline-offset:1px}
    .sheets .sh-addli{align-self:center;margin-left:4px}
    .sheets .sh-addbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px dashed var(--line);
      border-radius:8px;padding:6px 12px;font:600 12.5px var(--sans);color:var(--ink-v);cursor:pointer;white-space:nowrap}
    .sheets .sh-addbtn:hover{color:var(--red);border-color:var(--red)}
    .sheets .sh-addbtn[disabled]{opacity:.5;cursor:not-allowed}
    .sheets .sh-addbtn[disabled]:hover{color:var(--ink-v);border-color:var(--line)}

    /* The picker opens just under the strip IN THE FLOW (it pushes the open sheet's bar down; nothing is laid over it), and the
       refusal of an Add, or the words that say adding is off, sit in the flow under the strip in .sh-flow. */
    .sheets .sh-add{position:static;margin:6px 8px 4px;width:min(320px,calc(100% - 16px));
      background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
    .sheets .sh-flow{margin:6px 8px 0}
    .sheets .sh-flow .sh-note,.sheets .sh-flow .sh-cap{margin:0 0 6px}
    .sheets .sh-pick-h{display:flex;align-items:center;justify-content:space-between;font:700 12.5px var(--sans);
      padding:0 0 0 2px}
    .sheets .sh-pick .sh-cap{margin:0 0 4px 2px}
    .sheets .sh-pick-l{list-style:none;margin:0 -4px;padding:0}
    .sheets .sh-pick-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
      background:none;border:0;border-radius:var(--r-s);padding:7px 8px;font:600 13px var(--sans);color:var(--ink);
      cursor:pointer;text-align:left}
    .sheets .sh-pick-row:hover{background:var(--surf-low)}
    .sheets .sh-pick-row:active{transform:translateY(1px)}
    .sheets .sh-pick-row[disabled]{opacity:.5;cursor:not-allowed}
    .sheets .sh-pick-row[disabled]:hover{background:none}
    .sheets .sh-pick-row[disabled]:active{transform:none}

    /* A base change waiting for its yes, whichever tab it is for: between the two rows. */
    .sheets .sh-confirm{margin:6px 0;background:var(--warn-bg);border:1px solid #e8d9a8;border-radius:9px;
      padding:7px 12px;font-size:11px;line-height:1.35;color:var(--warn)}
    .sheets .sh-confirm b{display:block;color:var(--ink);font-size:12px;margin:0 0 3px}
    .sheets .sh-confirm p{margin:0 0 6px}
    .sheets .sh-btns{display:flex;flex-wrap:wrap;gap:6px}

    /* ROW 2. What the open sheet is, then its controls, in a row that wraps. ONE TIGHT ROW while nothing is being renamed, confirmed or
       described: the sticky head carries it on every screen, so its notes (.sh-note) sit in the row when they fit, not under it. */
    .sheets .sh-open{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;background:var(--card);
      border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:7px 12px;box-shadow:var(--shadow)}
    .sheets .sh-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .sh-type{font:700 10px var(--mono);letter-spacing:.06em;color:var(--ink-v)}
    .sheets .pill{font:700 10px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
      border-radius:999px;padding:3px 8px;white-space:nowrap;border:1px solid var(--line);background:var(--card);
      color:var(--ink-v)}
    .sheets .pill.base{background:var(--ink);border-color:var(--ink);color:var(--card)}
    /* The job is labelled a renovation (the Material step's Renovation switch): said on the open sheet's bar on every step. */
    .sheets .pill.reno{background:var(--warn-bg);border-color:#e8d9a8;color:var(--amber-ink)}
    .sh-sum{font-size:12px;color:var(--ink-v)}
    .sh-sum b{font:600 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
    .sh-sum.off{color:var(--ink-v);font-style:italic}
    /* The controls are the open bar's own flex items (display:contents), so what the sheet is and what it can do share one row and only
       the parts that do not fit wrap onto the next. */
    .sheets .sh-body{display:contents}
    .sheets .mw-sw{background:none;border:0;padding:0;font:600 12px var(--sans);color:var(--ink);text-align:left}
    .sheets .sh-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
    .sheets .sh-ctl:has(.sh-desc-in){flex:1 1 100%}
    /* Not on the proposal: dimmed and still usable, the page's own convention for "not applying right now"
       (.tk.inert above), never a disabled control. */
    .sheets .sh-ctl.inert{opacity:.55}
    .sheets .sh-mode{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
    .sheets .sh-lbl{font:600 11.5px var(--sans);color:var(--ink-v);white-space:nowrap}
    .sheets .seg{position:relative;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;
      background:var(--card)}
    .sheets .seg input{position:absolute;width:1px;height:1px;margin:0;padding:0;border:0;clip-path:inset(50%);
      overflow:hidden;white-space:nowrap}
    .sheets .seg label{padding:3px 9px;border-radius:999px;font:600 11.5px/1.3 var(--sans);color:var(--ink-v);
      cursor:pointer;white-space:nowrap}
    .sheets .seg label:hover{color:var(--red)}
    .sheets .seg input:checked + label{background:var(--red-dark);color:var(--card)}
    .sheets .seg input:focus-visible + label{outline:2px solid var(--red);outline-offset:1px}
    .sheets .sh-desc{min-width:0}
    .sheets .sh-ctl:has(.sh-desc-in) .sh-desc{flex:1 1 100%}
    .sheets .sh-desc-t{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;
      font:600 11.5px var(--sans);color:var(--ink-v);cursor:pointer}
    .sheets .sh-desc-t:hover{color:var(--red)}
    .sheets .sh-desc-t .tw-ico{transition:transform .12s ease}
    .sheets .sh-desc-t[aria-expanded="true"] .tw-ico{transform:rotate(90deg)}
    .sheets .sh-desc-t .opt{font-weight:400;color:var(--ink-v)}
    .sheets .sh-desc-prev{display:inline-block;max-width:34ch;margin:0 0 0 8px;vertical-align:bottom;font-size:11.5px;color:var(--ink);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sheets .sh-desc-in{display:block;width:100%;max-width:640px;margin:5px 0 0;font:400 12px/1.4 var(--sans);color:var(--ink);
      background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;resize:vertical}
    .sheets .sh-desc-in:hover{border-color:var(--red)}
    .sheets .sh-desc-in:focus-visible{outline:2px solid var(--red);outline-offset:1px}
    .sheets .sh-cap{margin:4px 0 0;font-size:11px;line-height:1.4;color:var(--ink-v)}
    .sheets .sh-acts{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
    /* .kindpick is the page's pill button (the Takeoff picker's "which one did you mean"); in the bar it is
       tighter and gains the two states it needs: disabled, and armed for the second press of Delete. */
    .sheets .kindpick{margin:0;gap:4px;padding:3px 7px 3px 6px;white-space:nowrap}
    .sheets .kindpick[disabled]{opacity:.5;cursor:not-allowed}
    .sheets .kindpick[disabled]:hover{border-color:var(--line);color:var(--ink-v)}
    .sheets .kindpick[disabled]:active{transform:none}
    .sheets .kindpick.armed{background:var(--red-dark);border-color:var(--red-dark);color:var(--card)}
    .sheets .kindpick.armed:hover{color:var(--card)}
    .sheets .sh-note{margin:0;flex:1 1 auto;font-size:11px;line-height:1.35;color:var(--ink-v)}
    .sheets .sh-note.warn{color:var(--red-dark)}
    /* The one line under the bar, and only when it has something to say: the note about copies, or on a one-sheet bid how to add an option. */
    .sheets .sh-hint{margin:5px 2px 0;font-size:11px;line-height:1.3;color:var(--ink-v)}
    .sheets .sh-empty{margin:5px 2px 0;font-size:11px;line-height:1.3;color:var(--ink-v)}
    @media (max-width:760px){
      .sheets .sh-acts{margin-left:0}
      .sheets .sh-open{padding:10px 12px}
    }

    .sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
         box-shadow:var(--shadow);overflow:hidden}
    .sec-h{padding:16px 19px;border-bottom:1px solid var(--line-2)}
    .sec-h h2{font-size:16px;margin:0 0 2px}
    .sec-h p{margin:0;color:var(--ink-3);font-size:12.5px}
    .sec-b{padding:18px 19px}
    .nav{display:flex;align-items:center;gap:10px;padding:14px 19px;
         border-top:1px solid var(--line-2);background:var(--surf-low)}
    .nav .step-of{font-size:12px;color:var(--ink-3);margin-right:auto;
         font-variant-numeric:tabular-nums}
    .btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 17px;
         font:600 13px var(--sans);cursor:pointer;text-decoration:none;display:inline-block}
    .btn:hover{background:var(--red-dark)}
    .btn.ghost{background:transparent;color:var(--ink-v);border:1px solid var(--line)}
    .btn.ghost:hover{color:var(--red);border-color:var(--red)}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    /* THE STEP'S OWN PRIMARY ACTION, and nothing more than `.btn` plus a layout. Adding a row is
       what this step is for, so it wears the button the rest of the app presses -- no fifth
       shape, no new colour, no radius that exists nowhere else. It replaced a pair of dashed
       ghosts under the last row on 2026-09-23: Hanz, "that button should be at the top and make
       it more visible". Above the list, because that is where the thing it makes appears from.
       `.below` is the same control under a list instead, which is where the Labor step's sits. */
    .addline{display:inline-flex;align-items:center;gap:7px;margin:0 0 13px;padding:10px 16px;
       line-height:1;cursor:pointer}
    .addline.below{margin:11px 0 0}
    .addline:active{transform:translateY(1px)}
    .addline svg{flex:none}

    /* THE SEARCH POP-UP BOTH "ADD" BUTTONS OPEN (js/library-picker.js). The scrim (.tw-ov) comes
       from shared.js; these are the .bulk-* rules library.html's "Add materials" dialog uses,
       carried over with this page's own tokens so the two read as one dialog. */
    .bulk-ov{align-items:flex-start}
    .bulk-dlg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      width:min(760px,100%);max-height:min(82vh,720px);margin-top:6vh;display:flex;
      flex-direction:column;overflow:hidden;box-shadow:0 18px 48px rgba(92,64,63,.22);text-align:left}
    .bulk-head{display:grid;grid-template-columns:1fr auto;align-items:start;gap:4px 10px;
      padding:16px 16px 12px;border-bottom:1px solid var(--line)}
    .bulk-head h2{grid-column:1;margin:0;font:700 15px var(--sans);letter-spacing:-.01em}
    .bulk-head .icon{grid-column:2;grid-row:1 / span 2;align-self:center;background:none;border:0;padding:6px;
      color:var(--ink-v);cursor:pointer;border-radius:var(--r-s)}
    .bulk-head .icon:hover{color:var(--red)}
    .bulk-sub{grid-column:1;margin:0;color:var(--ink-v);font-size:12.5px}
    .bulk-filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;
      background:var(--surf-low);border-bottom:1px solid var(--line)}
    .bulk-filters .searchbox{flex:1 1 auto;display:flex}
    .bulk-filters input,.bulk-oneoff input{flex:1 1 auto;min-width:0;font:400 14px var(--sans);
      padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);
      color:var(--ink)}
    .bulk-list{flex:1 1 auto;overflow-y:auto;padding:6px 0}
    .bulk-none{margin:0;padding:22px 16px;color:var(--ink-v);font-size:13px}
    .bulk-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
      padding:8px 16px;cursor:pointer;transition:background .12s ease}
    .bulk-row:hover{background:var(--surf-low)}
    .bulk-row > input{position:absolute;width:1px;height:1px;margin:0;padding:0;border:0;
      clip-path:inset(50%);overflow:hidden;white-space:nowrap}
    .bulk-box{width:17px;height:17px;flex:none;border:1px solid var(--line);border-radius:var(--r-s);
      background:var(--card);display:inline-flex;align-items:center;justify-content:center;
      transition:background .12s ease,border-color .12s ease}
    .bulk-box::after{content:"";width:4px;height:8px;margin-top:-1px;border:solid #fff;
      border-width:0 2px 2px 0;transform:rotate(45deg) scale(.7);opacity:0;
      transition:opacity .12s ease,transform .12s ease}
    .bulk-row > input:checked + .bulk-box{background:var(--red);border-color:var(--red)}
    .bulk-row > input:checked + .bulk-box::after{opacity:1;transform:rotate(45deg)}
    .bulk-row > input:focus-visible + .bulk-box{outline:2px solid var(--red);outline-offset:2px}
    .bulk-nm{min-width:0}
    .bulk-nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bulk-nm span{display:block;color:var(--ink-v);font-size:11.5px;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .bulk-cost{color:var(--ink-v);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .bulk-row.on{cursor:default}
    .bulk-row.on .bulk-nm b{color:var(--ink-v)}
    .bulk-row.on:hover{background:none}
    .bulk-in{font:600 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ok);
      white-space:nowrap}
    .bulk-side{display:flex;align-items:center;gap:10px;justify-content:flex-end}
    .bulk-oneoff{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;
      border-top:1px solid var(--line);background:var(--surf-low)}
    .bulk-oneoff b{font-weight:600;white-space:nowrap}
    .bulk-oneoff-note{flex:1 0 100%;margin:0;color:var(--ink-v);font-size:12px}
    .bulk-foot{display:flex;align-items:center;gap:12px;padding:12px 16px;
      border-top:1px solid var(--line);background:var(--card)}
    .bulk-count{color:var(--ink-v);font-size:12.5px;font-variant-numeric:tabular-nums}
    .bulk-spacer{flex:1 1 auto}
    @media (max-width:560px){
      .bulk-dlg{margin-top:0;max-height:100%;border-radius:0;border:0}
      .bulk-ov{padding:0}
      .bulk-oneoff{flex-wrap:wrap}
    }

    .grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
    .f label{display:flex;align-items:baseline;gap:6px;font:600 12.5px var(--sans);
             margin:0 0 5px;flex-wrap:wrap}
    .unit{font:600 10.5px var(--mono);color:var(--ink-3);background:var(--surf-low);
          border-radius:4px;padding:2px 5px}
    .f input,.f select{width:100%;font:inherit;color:var(--ink);background:var(--card);
          border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
    .f input.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
    .f input:hover,.f select:hover{border-color:var(--red)}
    :where(input,select,button,a,[tabindex]):focus-visible{outline:2px solid var(--red);
          outline-offset:1px}
    .f .hint{color:var(--ink-3);font-size:11.5px;margin:5px 0 0}
    /* The Unit line is a link to Items & Assemblies, where the unit is set. It reads as a hint, not
       a link, until it is hovered; `.note` is the saved-bid case (saved unit differs from the
       library's), which gets the same amber the page's other warnings use. */
    .f a.unithint{display:block;text-decoration:none}
    .f a.unithint:hover{text-decoration:underline}
    .f a.unithint.note{color:var(--warn)}

    /* ── takeoff rows ──────────────────────────────────────────────────────── */
    .tk{border:1px solid var(--line);border-radius:10px;padding:15px;margin:0 0 11px;
        background:var(--surf-low)}
    .tk-h{display:flex;align-items:center;gap:9px;margin:0 0 13px}
    @media (max-width:760px){ .tk-h{flex-wrap:wrap} }
    .tk-h .tag{font:700 10.5px var(--mono);letter-spacing:.06em;color:var(--ink-v)}
    /* A category heading over its rows (Admin > Item categories), Kyle's "MATERIAL - Patch", with the
       rows' subtotal on the right. */
    .tk-cat{display:flex;align-items:baseline;gap:12px;margin:16px 0 8px;padding:0 0 5px;border-bottom:1px solid var(--line)}
    .tk-cat-h{margin:0;font:700 11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-v)}
    .tk-cat-sub{margin-left:auto;font:600 12.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-v)}
    .tk-cat-sub b{color:var(--ink)}
    /* A row nobody has searched on yet. Amber because that is this app's "waiting on a person"
       colour -- the sandbox note, the rail's att pip -- and a pill because it labels. It leaves
       the moment a name resolves, so a finished takeoff shows none of them. */
    .tk-mark{font:700 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;
       background:var(--warn-bg);border:1px solid #e8d9a8;color:var(--warn);border-radius:20px;
       padding:2px 9px;white-space:nowrap}
    /* The two candidates, when one name is both an item and an assembly. Borrows `.labsw`'s pill
       geometry on purpose: this page already has one small pill-shaped button and a second shape
       for the same weight of control would be a fifth way to draw a button. Sits inside the hint
       line under the picker, which is where the question is being asked. */
    .kindpick{display:inline-flex;align-items:center;gap:5px;cursor:pointer;margin:4px 4px 0 0;
       border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card);
       font:600 11.5px var(--sans);color:var(--ink-v)}
    .kindpick:hover{border-color:var(--red);color:var(--red)}
    .kindpick:active{transform:translateY(1px)}
    .tk-sub{margin-left:auto;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
    .tk-g{display:grid;gap:14px;grid-template-columns:2.1fr 1fr .75fr 1.15fr;align-items:start}
    /* A material row carries one more field than an assembly row -- coverage, which an assembly
       keeps on its own lines. Its own column template rather than a fifth column on the shared
       one, so an assembly row does not grow an empty gap where coverage would go. */
    .tk-g.matg{grid-template-columns:1.9fr .9fr .7fr .85fr 1.05fr}
    /* A saved assembly row that still prices with coverage typed on this bid: one line and one
       button under the card's four columns. New rows have no such line. */
    .asmcov-note{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
    .asmcov-note .hint{color:var(--ink-3);font-size:11.5px;margin:0}
    .asmcov-note .btn.sm{padding:5px 11px;font-size:12px}
    /* Marked, not restyled. It is the same kind of thing as the row above it -- something the job
       buys -- so it reads as one list. The tag says which kind it is; the card does not need to. */
    .tk.mat .tag{background:var(--surf-low);color:var(--ink-v)}
    /* `.addrow2` held the two add buttons side by side and went with them on 2026-09-23. */
    @media (max-width:640px){ .tk-g.matg{grid-template-columns:1fr} }
    @media (max-width:760px){ .tk-g{grid-template-columns:1fr} }
    .x{background:none;border:0;color:var(--ink-3);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:2px}
    .x:hover{color:var(--red)}
    /* A figure the page worked out, in a field's slot. A box rather than bare text so it reads
       as that field's answer, but never an input: it is the library's price for the measurement
       beside it, or -- on the Joint Filler and Dye cards since 2026-09-19 -- the derived
       measurement and unit themselves. What tells it apart from a box you type in is the hover:
       `.f input` takes a red border under the cursor, this does not.

       FULL CONTRAST, NEVER DIMMED. Read-only and disabled are different states: disabled sits
       at .38-.5 and says "not available", read-only says "a fact, not yours to change". Only
       `.empty` greys, and that is about the VALUE being absent, not the box being inert. */
    .costbox{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);
        background:var(--card);text-align:right;font:600 14px var(--mono);
        font-variant-numeric:tabular-nums;min-height:37px}
    .costbox.empty{color:var(--ink-3);font-weight:400}
    /* The same box holding a WORD rather than a figure -- a material's name, a unit. Right-aligned
       tabular mono is money typography and says the wrong thing about "Joint filler, 10 gal kit".
       A modifier rather than a second class, because a fifth way to draw a box is a bug. */
    .costbox.txt{text-align:left;font:600 13.5px var(--sans);font-variant-numeric:normal}

    /* ── labor cards ──────────────────────────────────────────────────────────
       One card per task, reusing the takeoff row's `.tk` shell so the two steps read as the same
       screen. Only the differences live here: four even columns instead of takeoff's weighted
       ones, and a task NAME in the header where takeoff has a fixed "ROW n" tag -- a labor line
       is renameable, an added one starts blank, so it is an input rather than a label. */
    .lab-g{grid-template-columns:1fr 1fr 1fr 1.15fr}
    @media (max-width:760px){ .lab-g{grid-template-columns:1fr} }
    .labname{font:600 13.5px var(--sans);color:var(--ink);background:transparent;
       border:1px solid transparent;border-radius:5px;padding:4px 7px;margin-left:-7px;
       min-width:0;flex:1 1 auto}
    .labname:hover{border-color:var(--line);background:var(--card)}
    .lab .tk-sub,.trv .tk-sub,.pwcard .tk-sub{font-variant-numeric:tabular-nums;color:var(--ink-v)}
    /* The Prevailing wage card: a labor-style card at the bottom of the Labor step. Dimmed while the job's switch
       is off, like the other cards, and every box stays typeable. */
    /* The prevailing wage trades: one box per trade, side by side like the sheet's two (Polish!I47:L54). */
    .pwtrades{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
    .pwtrade{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
    .pwtrade.paid{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
    .pwtrade-h{display:flex;align-items:center;gap:8px;margin:0 0 8px}
    .pwtrade-h .pwname{flex:1;min-width:0;font-weight:700}
    .pwtrade-h input.pwname{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-weight:700}
    .pwtrade-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .pwpay{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:600;cursor:pointer}
    /* CLOSED (the job's switch is off) the card is its header alone, so the header keeps no gap under it. */
    .pwcard.off .tk-h{margin:0}
    /* Travel block: a dividing line, then Travel Labor, Lodging and Per Diem. Lodging and Per Diem
       have three boxes (quantity, rate, cost), not four, and a fixed name rather than an input. */
    .trvsep{display:flex;align-items:center;gap:10px;margin:22px 0 8px;color:var(--ink-3);
       font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase}
    .trvsep:before,.trvsep:after{content:"";flex:1;border-top:1px solid var(--line)}
    .lab-g.trv-g{grid-template-columns:1fr 1fr 1.15fr}
    @media (max-width:760px){ .lab-g.trv-g{grid-template-columns:1fr} }
    .labname.static{display:block}
    .labname.static:hover{border-color:transparent;background:transparent}
    .trvnote{margin:9px 0 0}
    /* "How this is worked out": one .cap paragraph, one line per sentence. pre-line keeps the
       newlines the live repaint writes; overflow-wrap lets a long sum break at 390px. */
    .cap.trvhow{white-space:pre-line;overflow-wrap:anywhere;margin:0 0 12px;font-variant-numeric:tabular-nums}
    /* Where the Travel Labor card goes when the line has been removed: one sentence and the control that brings it back (js/polish-estimate.js addTravelHtml). */
    .trvadd{margin:0 0 12px}
    .trvadd .cap{margin:0}
    .trvdist{margin:6px 0 10px}
    .trvdist .distrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
    .trvdist .distrow label{font:600 12px var(--sans);color:var(--ink-3)}
    .trvdist .distrow input{width:110px;font:inherit;color:var(--ink);background:var(--card);
       border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
    /* Fields inside a card are real boxes, unlike the old table's borderless cells. */
    .lab-g input{width:100%;font:inherit;color:var(--ink);background:var(--card);
       border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
    .lab-g input.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
    .lab-g .mny{display:flex;align-items:center;gap:3px;width:100%}
    .lab-g .mny input{min-width:0}
    /* The way in and out of the derived Guys figure, in the card header where it is visible
       rather than tucked under the Guys box as a link. Flex:none so it keeps its own width
       instead of being squeezed by .labname's flex:1 1 auto; nowrap so its two words never break
       and grow the header a second line. */
    /* The Guys switch. Borrows `.mw-sw`'s track and knob so it reads as the same family as
       the Review step's switches, and wraps them in a pill of its own.

       THE PILL IS NOT DECORATION. The control it replaced was a red-bordered button, and
       that loudness was the entire point of the change that put it here: it had been an
       underlined link in the small print under Guys, and nobody found it. A bare track and
       label sitting in a busy card header is quieter than the link was, which walks the
       same mistake backwards.

       It stays a <button> rather than the <span role="switch"> the conditions use, because
       a span has no keyboard behaviour and this control had some. */
    .labsw{flex:none;white-space:nowrap;cursor:pointer;
       border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 8px;
       background:var(--card);font:600 11.5px var(--sans);color:var(--ink-v)}
    .labsw:hover{border-color:var(--red);color:var(--red)}
    /* ON IS THE LOUD ONE, and that is the right way round: off is the resting state every
       Travel card sits in, so shouting there would be 23 cards shouting at once. On means
       this row's Guys is a typed number that no longer follows the tasks above -- the one
       state worth spotting from across the card. */
    .labsw.on{background:var(--red-tint);border-color:var(--red);color:var(--red-dark)}
    .labsw:focus-visible{outline:2px solid var(--red);outline-offset:2px}
    /* NOT APPLICABLE RIGHT NOW, AND STILL TYPEABLE -- `.sw.inert`'s convention in styles.css, and
       its reasoning: say plainly that an input is not affecting the price rather than disabling it
       and losing what somebody set. The house rule keeps a real `disabled` at .38-.5 and never
       dims a live control by opacity alone, so this stays at .55 with nothing disabled under it. */
    .tk.inert{opacity:.55}
    /* The three that came off the intake form. Grouped under the takeoff rows rather than mixed
       into them: they are not rows, they price nothing, and a switch sitting in a list of priced
       lines reads as though it changes one. */
    /* A condition card, styled IDENTICALLY to the takeoff row above it -- Hanz, 2026-09-18,
       pointing at Row 1: "can we make it or make the containers look like row one on the
       assembly container". The white-card-plus-left-rule treatment tried to draw the
       distinction visually (a row prices to a number; these price to a Yes or No that only
       Kyle's workbook reads) but read instead as the condition being SEPARATE FURNITURE below
       the real takeoff, which is the opposite of "these describe the work the same way a
       takeoff row does" a few lines up in takeoffPanel(). The distinction now lives only in
       the tag text (JOINT FILLER / DYE vs ROW n) and the hint line, not in a different card. */
    .tk.cond{}
    /* .tk.floor: the Renovation card (a fact about the building, Polish!B10), dressed as a condition card. */
    .tk.cond .tk-h,.tk.floor .tk-h{margin:0 0 7px}
    .tk.cond .tk-sub,.tk.floor .tk-sub{margin-left:auto;font:600 10.5px var(--mono);color:var(--ink-3);
      letter-spacing:.02em}
    .tk.cond .hint,.tk.floor .hint{margin:0}
    /* `.cond-cost` lived here from 2026-09-18 to 2026-09-19: one dollar figure beside the switch,
       which was the most a switch-shaped card could say. Joint Filler and Dye are material rows
       now and their money is in a real `.costbox` in the Total cost column, so the class is gone
       rather than left behind for something to reach for by mistake. */
    /* The switch in a card header, wherever it sits. flex:none so it keeps its own width against
       .tk-sub's margin-left:auto, nowrap so its label never breaks and grows the header a line. */
    .tk-h .mw-sw{flex:none;white-space:nowrap}
    /* Dimmed, still clickable. Same rule and same reason as .tk.inert above. */
    .mw-sw.inert{opacity:.5}
    .inertline{color:var(--ink-v);font-style:italic;font-size:11.5px;margin:9px 0 0}
    /* Rendered unconditionally on every hours row; the card's OWN class decides whether it shows,
       so there is one source of truth for the dimming and the caption instead of two keyed
       attributes a live repaint could let drift apart. */
    .lab:not(.inert) .inertline{display:none}
    /* Switched OFF with the row's own slider (not "local job"): dimmed like .inert, and the
       "this job is marked local" caption would be the wrong sentence, so it stays hidden. */
    .lab.off .inertline{display:none}

    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;font:600 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;
       color:var(--ink-3);padding:0 9px 7px;white-space:nowrap}
    th.r,td.r{text-align:right}
    td{padding:6px 9px;border-top:1px solid var(--line-2)}
    td.calc{font-family:var(--mono);font-variant-numeric:tabular-nums}
    td input{width:100%;font:inherit;color:var(--ink);background:transparent;
       border:1px solid transparent;border-radius:5px;padding:5px 7px}
    td input:hover{border-color:var(--line);background:var(--card)}
    td input.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
    /* A rate is money, so it wears the sign. Outside the input, because a "$" inside the box gets
       parsed as part of the number the estimator typed. */
    .mny{display:inline-flex;align-items:center;gap:1px;color:var(--ink-3);
       font:400 12px var(--mono)}
    .mny input{min-width:48px}
    .flag{color:var(--amber-ink);font-weight:700;cursor:help}
    .sum-row td{border-top:2px solid var(--line);font-weight:700;font-family:var(--mono);
       font-variant-numeric:tabular-nums}
    /* `.addbtn`, the dashed full-width ghost, drew every add button on this page until
       2026-09-23. Both of its consumers now use `.addline`, so the rules are gone rather than
       left behind for something to reach for by mistake. library.html has its own, unrelated. */
    .cap{color:var(--ink-3);font-size:11.5px;margin:8px 0 0}
    .warnline{color:var(--warn);font-size:11.5px;margin:6px 0 0}

    /* ── review ───────────────────────────────────────────────────────────── */
    .rev{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 11px}
    /* One muted hue per Review card (Hanz, 2026-10-12), each in two shades: -band is the darker
       tint for the card's title, -tot the lighter tint for its total row. Picked by the card's
       data-rev key, never by position, so a card added or reordered keeps its colour. Ink on the
       darker shade is 11:1 or better and the Edit link (red-dark) is 5.4:1 or better, both past
       WCAG AA. The page is light-only (color-scheme above), so there is no dark set. The lump-sum
       row keeps the brand red-tint of .mk tr.grand. */
    :root{
      --rev-takeoff-band:#cddcc7; --rev-takeoff-tot:#e6efe2;
      --rev-labor-band:#c9d8e8;   --rev-labor-tot:#e4edf6;
      --rev-travel-band:#e8d8ae;  --rev-travel-tot:#f5eed7;
      --rev-markup-band:#dccadb;  --rev-markup-tot:#f0e7ef;
      /* An option's own card (Phase 15): a clay tint, apart from the four above. Same AA checks. */
      --rev-option-band:#e3cbbf;  --rev-option-tot:#f3e6df}
    .rev[data-rev="takeoff"]{--rev-band:var(--rev-takeoff-band);--rev-tot:var(--rev-takeoff-tot)}
    .rev[data-rev="labor"]{--rev-band:var(--rev-labor-band);--rev-tot:var(--rev-labor-tot)}
    .rev[data-rev="travel"]{--rev-band:var(--rev-travel-band);--rev-tot:var(--rev-travel-tot)}
    .rev[data-rev="markup"]{--rev-band:var(--rev-markup-band);--rev-tot:var(--rev-markup-tot)}
    .rev[data-rev="option"]{--rev-band:var(--rev-option-band);--rev-tot:var(--rev-option-tot)}
    .rev-h{display:flex;align-items:center;gap:10px;padding:10px 14px;
           background:var(--rev-band,var(--surf-low));font:600 12.5px var(--sans)}
    .rev-h button{background:none;border:0;color:var(--red-dark);font:600 12px var(--sans);
           cursor:pointer;text-decoration:underline}
    .rev-t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
    .rev-t td{padding:7px 8px;border-top:1px solid var(--line-2);color:var(--ink-v)}
    .rev-t td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
           color:var(--ink)}
    .rev-t tr.tot td{border-top:1px solid var(--line);font-weight:700;color:var(--ink);
           background:var(--rev-tot,transparent)}
    /* THE WORKING (Hanz, 2026-10-19): every Review table has a labelled header row, Item | Quantity | Unit | Rate | Total. The
       table keeps a width a row can be read in and scrolls inside its own box, so a phone scrolls the table, never the page.
       THE SCROLL PADDING is the pinned Total column's width (see the pin below) AND what a Rate cell holds to the right of a box: a box tabbed or typed into scrolls clear of
       that column with the rest of its line, not under it. 126px + 16px for the "%" and its gap + the cell's 8px of padding = 150px (round 7, part 2, L4, 2026-10-21): at the
       column's 126px alone the browser brought a % box just to the column's edge and left the "%", its gap and the end of the refusal's line under it (Chrome, sidebar open:
       11px at 850, 820 and 600px wide); at 150px it scrolls the table to its end and they end 8px clear. WHILE FOCUS IS IN THAT
       COLUMN THE PADDING IS NOTHING: its boxes sit inside the padded-off band, so a focus or a keystroke in one would scroll the table to put it clear of itself (the
       cost the sticky head found in a browser, see .v2head), and a pinned box is on screen already. */
    .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;scroll-padding-right:150px}
    .tscroll:has(td:nth-child(5):focus-within){scroll-padding-right:0}
    /* 550: THE FOUR FIXED COLUMNS (below) AND 144px FOR ITEM, 122px of it room for words. It was 640 until the 2026-10-20 sixth round. Round 5 chose 640 for the
       markup card's boxes, with columns wider than their contents need, and at 916px with the staff sidebar open the table's box is 575px: every card scrolled 65px
       and the TOTAL column, the one figure the page is for, was the part out of view. 550 fits a 575px box (916px, sidebar open) and a 559px one (900px, sidebar open).
       Below it the box scrolls and the Total column is pinned to its edge (below). backend/tests/test_v2_review_table_fits.py does this arithmetic on this CSS. */
    .rev-t,.mk{min-width:550px}
    /* ONE SET OF COLUMNS FOR EVERY CARD (browser walk, 2026-10-20: each card sized its own, so Quantity and Unit wandered
       from card to card). Fixed layout takes the widths from the header row. Quantity, Unit, Rate and Total are PIXELS, each as wide as what the cards put in
       it needs and no wider (the heading and a working line in Quantity, the longest word of Unit, which wraps, the % box and a twelve character figure in Rate,
       and in Total the 104px box and the cell's padding); Item, which wraps, takes what is left. */
    .rev-t,.mk{table-layout:fixed}
    .rev-t th:nth-child(2),.mk th:nth-child(2){width:82px}
    .rev-t th:nth-child(3),.mk th:nth-child(3){width:90px}
    .rev-t th:nth-child(4),.mk th:nth-child(4){width:108px}
    .rev-t th:nth-child(5),.mk th:nth-child(5){width:126px}
    /* THE CELLS' PADDING: 8px between columns and 14px at the card's two edges (the inset of its title). Padding is the one thing in a column that holds nothing,
       and the table has no room to spare at 916px. */
    .rev-t th:first-child,.mk th:first-child,.rev-t td:first-child,.mk td:first-child{padding-left:14px}
    .rev-t th:last-child,.mk th:last-child,.rev-t td:last-child,.mk td:last-child{padding-right:14px}
    /* THE TOTAL STAYS IN VIEW (2026-10-20 sixth round). Where the box is narrower than the table it scrolls, and the Total column, header and cells, is pinned to the
       box's right edge, so the figure is on screen at every width down to a phone while Quantity, Unit and Rate scroll beneath it. The pinned cells are opaque (a
       tinted row keeps its own tint: those rules weigh more), and the tables' borders are the cells' own (border-collapse above), because a collapsed border belongs
       to the table and would not travel with a pinned cell. Where the table fits its box, a pinned cell is where it would have been. */
    .rev-t th:nth-child(5),.mk th:nth-child(5),.rev-t td:nth-child(5),.mk td:nth-child(5){position:sticky;right:0}
    .rev-t td:nth-child(5),.mk td:nth-child(5){background:var(--card)}
    .rev-t th,.mk th{padding:6px 8px;text-align:left;font:700 10.5px var(--sans);letter-spacing:.06em;
           text-transform:uppercase;color:var(--ink-v);background:var(--rev-band,var(--surf-low));white-space:nowrap}
    .rev-t th.r,.mk th.r{text-align:right}
    .rev-t td.u,.mk td.u{color:var(--ink-3);white-space:normal}
    .rev-t td.q,.rev-t td.rt,.mk td.q,.mk td.rt{white-space:nowrap}
    /* A RATE'S UNIT WRAPS UNDER ITS FIGURE (round 7, part 4, P8: the round-6 staging walk's X2, a regression of #697). A Rate cell holds 92px of text (108 less its padding), and a rate worked
       to four places with a long unit is wider: "$16.8113 / gallon", the Gyp Primer row, is 116.8px in Chrome, and it ran under the pinned Total column ("$16.8113 / gall"). The cell may break
       between the figure and its unit, balanced, so it reads "$16.8113" over "/ gallon"; its widest piece is the figure, never the whole line, so no width or minimum moves and the table still
       fits from 900px with the sidebar open. A browser without text-wrap:balance breaks at the last space that fits. backend/tests/test_v2_review_table_fits.py does this arithmetic. */
    .rev-t td.rt{white-space:normal;text-wrap:balance}
    .rev-t .note.work,.mk .note.work{display:block;font:11px var(--mono);color:var(--ink-3)}
    .mk td.q,.mk td.rt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
    .mk td.rt{min-width:96px}
    .blockers{background:var(--warn-bg);border:1px solid #e8d9a8;color:var(--warn);
           border-radius:9px;padding:11px 13px;font-size:12.5px;margin:0 0 12px}
    .blockers ul{margin:6px 0 0;padding-left:18px}

    /* The markup block, laid out like rows 64-82 of the Polish tab so an estimator who knows
       Kyle's sheet can read down it and recognise every line. */
    .mk{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin:0}
    .mk td{padding:7px 8px;border-top:1px solid var(--line-2)}
    .mk td.pct,.mk td.amt{text-align:right;font-family:var(--mono);
        font-variant-numeric:tabular-nums}
    .mk td.pct{color:var(--ink-3);width:104px}
    .mk td.amt{width:126px}
    .mk tr.grand td.rt{color:var(--red-dark)}
    .mk tr.band td{background:var(--surf-low);font:700 10.5px var(--sans);letter-spacing:.06em;
        text-transform:uppercase;color:var(--ink-v);border-top:1px solid var(--line)}
    .mk tr.sub td,.mk tr.tot td{border-top:2px solid var(--line);font-weight:700;color:var(--ink)}
    /* The markup card has no title bar of its own, so its two section bands wear the darker shade
       and its sub-total and total rows the lighter one. (0,3,2) beats the (0,2,2) rules above. */
    .rev .mk tr.band td{background:var(--rev-band,var(--surf-low))}
    .rev .mk tr.sub td,.rev .mk tr.tot td{background:var(--rev-tot,transparent)}
    .mk tr.grand td{border-top:2px solid var(--line);font-weight:700;
        background:var(--red-tint);color:var(--red-dark)}
    .mk tr.grand td.amt{font:700 18px var(--mono);font-variant-numeric:tabular-nums}
    .mk tr.off td{color:var(--ink-3)}
    .mk .note{font-size:11px;color:var(--ink-3);font-family:var(--sans)}
    .mk .note a{color:var(--red-dark)}
    .mk input{width:104px;text-align:right;font:inherit;font-family:var(--mono);
        font-variant-numeric:tabular-nums;border:1.5px solid var(--ink-3);border-radius:6px;
        padding:5px 8px;background:var(--card);color:var(--ink)}
    .mk input:hover{border-color:var(--red)}
    /* The override boxes over the sheet's rules (Review step): a short % box with its greyed rule, and the warning
       beside one that is typed but cannot be used. [hidden] restated: a class display rule outranks the attribute. */
    /* 2026-10-17 (Hanz: "make the editable fields more visible"): a box reads as a box -- a solid edge, a white
       face and a focus ring -- and holds the line's ONE figure. Blank shows the sheet's rule in grey; a typed figure
       wears the brand tint, so what somebody changed stands out from what the sheet decided. The rate the chain used
       is kept beside it for the repaint, not drawn (.mkused). */
    .mkused{display:none}
    /* THE WARNING GETS A LINE OF ITS OWN INSIDE ITS CELL (2026-10-21, the audit of the sixth round). It was a third item in a one-line row (nowrap, no narrower than the 64px box, its "%" and the
       warning's longest word side by side, which is more than the 92px a Rate cell holds), so the words stood in a column that began inside the cell and ended under the pinned Total column,
       whose opaque background painted over them. Now the row wraps and the warning takes the whole line (flex-basis 100%), so it is as wide as its cell and no wider, wraps there, may break a
       long word and is not capped. The box and its % keep to the right of the cell, where they sit with no warning, so nothing jumps when one appears. The dollar box in the Total cell does
       the same inside its own. backend/tests/test_v2_review_table_fits.py reads these two rules, and test_v2_review_working.py draws a Review with every box invalid to see the warning is in its cell. */
    .adjbox{display:inline-flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px;white-space:nowrap}
    .adjbox input,.mk .adjbox input{width:64px;text-align:right;font:600 13px var(--mono);
        font-variant-numeric:tabular-nums;border:1.5px solid var(--ink-3);border-radius:6px;padding:5px 8px;
        background:var(--card);color:var(--ink);box-shadow:inset 0 1px 2px rgba(27,28,28,.06)}
    .adjbox.adjamt input,.mk .adjbox.adjamt input{width:92px}
    .adjbox input::placeholder{color:var(--ink-3);opacity:1;font-weight:500}
    .adjbox input:not(:placeholder-shown){background:var(--red-tint);border-color:var(--red);color:var(--red-dark)}
    .adjbox input:hover,.mk input:hover{border-color:var(--red)}
    .adjbox input:focus,.mk input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.16)}
    .mk tr.band .bandnote{margin-left:8px;font:500 11px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-v)}
    .adjwarn{display:block;flex:1 0 100%;white-space:normal;overflow-wrap:anywhere;color:var(--red);font:600 11.5px var(--sans);text-align:right;max-width:none}
    .adjwarn[hidden]{display:none}

    /* Intake's `.sw` switch (styles.css), shrunk to sit inside a table cell instead of its own
       padded row. This page carries its own tokens and does not link styles.css, so the track
       and knob are restated here rather than shared. */
    .mw-sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;vertical-align:middle}
    .mw-sw .track{width:30px;height:18px;border-radius:10px;background:var(--surf-low);
        border:1px solid var(--line);position:relative;flex:none;transition:background .13s}
    .mw-sw .track::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;
        border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);
        transition:left .13s}
    .mw-sw:hover .track{border-color:var(--red)}
    .mw-sw.on .track{background:var(--red);border-color:transparent}
    .mw-sw.on .track::after{left:13px;background:#fff}

    /* THE BAR STARTS WHERE THE PAGE DOES (2026-10-20 sixth round, the staging walk). It is position:fixed, and a fixed element is not moved by the body's margin-left,
       so with the staff sidebar open (a 240px rail beside the page from 768px up, auth.js) the bar ran UNDER it and the first 240px of its text were hidden at 916px.
       It follows the rail as auth.js's own top bar does, from the same breakpoint, and slides when the body does. Under 768px the sidebar is a sheet over the page
       with a scrim and the body does not move, so the bar does not either. backend/tests/test_v2_total_bar_beside_sidebar.py reads the cascade for every width and state. */
    .bid{position:fixed;left:0;right:0;bottom:0;background:var(--card);
         border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(0,0,0,.07);z-index:9;transition:left .2s ease}
    @media (min-width:768px){ html.tw-nav-open .bid{left:var(--tw-w,240px)} }
    /* A FOCUSED FIELD SCROLLS CLEAR OF THE BAR (round 7, part 2, L3, 2026-10-21). The body's padding keeps the page's LAST row above the bar, but a field anywhere else that is focused (a Tab, a
       focus() the page makes) was scrolled only just into the window, whose bottom is the bar's: Chrome left the Review's Shipping % box at 673 to 700px of a 700px window, the bar's top at 616,
       wholly behind it. html's scroll-padding-bottom is the bar's measured height (--bid-h, which js/polish-estimate.js writes; 132px until it has, as the body's padding) and 8px of air, so the
       browser brings a focused field into the part of the window the bar does not cover. The bar holds nothing that takes focus, so this needs no :focus-within exception like the sticky head's
       scroll-padding-top. backend/tests/test_v2_bid_bar_height.py reads the rule and that premise. */
    html{scroll-padding-bottom:calc(var(--bid-h,132px) + 8px)}
    .bid-in{max-width:1000px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;
         gap:18px;flex-wrap:wrap}
    .maths{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;
         color:var(--ink-v);font-family:var(--mono);font-variant-numeric:tabular-nums}
    .maths i{font-style:normal;color:var(--ink-3)}
    .src{font-size:11px;color:var(--ink-3);max-width:230px;line-height:1.35}
    .total{margin-left:auto;text-align:right}
    .total .lbl{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;
         color:var(--ink-3)}
    .total .v{font:700 26px/1.05 var(--mono);font-variant-numeric:tabular-nums;color:var(--red);
         letter-spacing:-.02em}
    .total .psf{font-size:12px;color:var(--ink-v);font-family:var(--mono)}
    @media (max-width:760px){ .total{margin-left:0;text-align:left;width:100%} .maths{width:100%} }
    /* The scope bar (paintScopeBar): one row per thing it says, the controls at the row's end. */
    .scope-bar{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
    .scope-bar .scope-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    .scope-bar .scope-row span{flex:1 1 280px;min-width:0}
    .scope-bar input[type="text"]{flex:1 1 200px;min-width:0;min-height:36px;padding:6px 9px;font:inherit}
    .scope-bar .note{margin:0}
    .scope-bar .note.bad{color:#9b1c1c;font-weight:600}
  </style>
</head>
<body>
  <!-- THE STICKY HEAD (2026-10-20, Hanz): the top bar, then the sheet bar under it, in ONE block that stays at the top of the screen
       (see .v2head in the style block). They are siblings on purpose: auth.js folds the burger, brand, step pills and bell into the
       header's one row and destroys whatever else is inside that header, so the sheets cannot live in it. The page's own heading
       (the BETA badge, the project line) comes after the block. -->
  <div class="v2head" id="v2head">
    <!-- THE SHARED SHELL, as polish-intake.html has it. auth.js folds the burger + brand + step pills + bell into this one
         row instead of drawing its own white bar with only the bell. NOTHING may be added inside this header: auth.js keeps
         only .brand and .progress and destroys the rest. The page's own heading (the BETA badge, the project line) is
         below it. polish-sandbox.js repoints all four links onto the draft it settled on (?d=). -->
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/img/treadwell-bison.svg" width="57" height="36" alt="Treadwell">
        <div>
          <div class="brand-name">Treadwell</div>
          <div class="brand-sub">Proposal Generator</div>
        </div>
      </div>
      <div class="progress">
        <a class="step" href="/polish-intake.html">1 · Intake</a>
        <span class="step active">2 · Estimate</span>
        <a class="step" href="/proposal-review.html">3 · Proposal</a>
        <a class="step" href="/done.html">4 · Files</a>
      </div>
    </header>
    <!-- THE SHEET BAR, on every bid (js/polish-estimate.js paintSheets, markup from B.sheetsPanelHtml): a strip of tabs, one a
         sheet, and under it the open sheet's controls. Hidden until the first paintSheets has drawn it, the way #main is hidden
         until the page is ready, so it never shows as an empty bar that then jumps open. -->
    <section class="sheets" id="sheets-panel" aria-label="Sheets on this bid" hidden></section>
  </div>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Estimating Tool v2</h1>
        <p id="proj-line">Loading…</p>
      </div>
      <span class="beta">BETA</span>
    </div>

    <p class="sandbox" id="sandbox-note" role="status" aria-live="polite" hidden></p>
    <p class="alert" id="alert" role="status" aria-live="polite"></p>
    <!-- Which scope of its project this draft is, and the split of a several-sheet bid into one proposal per sheet (RJ, 2026-10-24).
         Drawn by js/polish-estimate.js paintScopeBar; hidden while it has nothing to say. -->
    <section class="scope-bar" id="scope-bar" aria-label="Scopes of this project" hidden></section>
    <div class="loading" id="loading">Loading the item library…</div>

    <div id="main" hidden>
      <div class="rail" id="rail"></div>
      <div id="panels"></div>
    </div>
  </div>

  <!-- Every assembly AND every material, in one list. A list= input searches anywhere in the
       name, which is how somebody who remembers "grind" finds the assembly, and each option
       carries a label saying which collection it came from.

       IT WAS TWO LISTS UNTIL 2026-09-23, deliberately: a row is one thing or the other, and a
       merged list can offer a system to a field that prices a single product. What that cost in
       practice was worse than what it prevented -- the row's kind was fixed when the row was
       created, so half the library was missing from the box before anybody had typed. The row
       decides its own kind now; see renderDatalist and pickHint in js/polish-estimate.js. -->
  <datalist id="dl-lines"></datalist>

  <div class="bid" id="bidbar" hidden>
    <div class="bid-in">
      <div class="maths" id="maths"></div>
      <p class="src">Priced from the <b>Items &amp; Assemblies</b> library through the Polish tab's
        own markup chain.</p>
      <div class="total">
        <div class="lbl">Total lump sum</div>
        <div class="v" id="bid-total">—</div>
        <div class="psf" id="bid-psf"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/js/icons.js"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <!-- Which tab a reload lands on. Pure functions over location.hash, no DOM and no fetch; it
       must precede the page script, which reads window.TWTabMemo as it restores the open tab. -->
  <script src="/js/tab-memo.js"></script>
  <!-- library-core before the page script: the page does `var L = window.TWLib` at parse time.
       Same reason library.html loads it first. bid-model is the markup chain; it is pinned
       to Kyle's worksheet by backend/tests/test_polish_markup_parity.py. -->
  <script src="/js/library-core.js"></script>
  <!-- bid-model reads its number helpers off window.TWExcelMath as it loads, so that goes first. -->
  <script src="/js/excel-math.js"></script>
  <!-- The one work-type vocabulary and job-conditions table: bid-model derives from it as it loads, and
       this page's own script reads its Takeoff cards off it (var T = window.TWWorkTypes). -->
  <script src="/js/work-types.js"></script>
  <!-- The bid engine and what it reads: the Markups formula reader, the profiles (rates as formula text),
       then the engine. bid-model hands its chain to the engine as it loads, so all three go first. -->
  <script src="/js/markup-core.js"></script>
  <script src="/js/bid-profiles.js"></script>
  <script src="/js/bid-engine.js"></script>
  <script src="/js/bid-model.js"></script>
