<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lead Inbox · Treadwell Proposal Generator</title>
<style>
  :root { --red:#c8102e; --red-dark:#9e001f; --ink:#1b1c1c; --ink-v:#5c403f;
    --surf:#fbf9f8; --surf-low:#f5f3f3; --surf-high:#e9e8e7; --line:#e4e2e2; --ok:#1f7a34; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--surf); color:var(--ink);
    font:400 14px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { padding:24px 28px 64px; }
  .top { display:flex; align-items:center; gap:12px; margin:0 0 4px; }
  .logo { width:34px; height:34px; border-radius:9px; background:var(--red); color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-weight:800; }
  h1 { font-size:22px; font-weight:700; letter-spacing:-.01em; margin:0; }
  .sub { color:var(--ink-v); margin:0 0 18px; font-size:13px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .search { flex:0 0 250px; max-width:100%; min-height:38px; padding:8px 12px; border:1px solid var(--line);
    border-radius:7px; font:inherit; background:#fff; }
  .search:focus { outline:none; border-color:var(--red); }
  .views { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:#fff; color:var(--ink-v); border-radius:999px;
    padding:6px 12px; font:600 12.5px system-ui; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .chip:hover { background:var(--surf-low); }
  .chip.sel { background:var(--red-dark); border-color:var(--red-dark); color:#fff; }
  .chip .n { background:var(--surf-high); color:var(--ink-v); border-radius:999px; padding:0 6px; font:800 11px system-ui; }
  .chip.sel .n { background:rgba(255,255,255,.24); color:#fff; }
  .count { color:var(--ink-v); font-size:12px; margin-left:auto; }
  /* Quiet, non-blocking: a failed refresh must not wipe the cached list under it. */
  .alert { border:1px solid var(--line); border-left:3px solid var(--red); background:#fdf3f3;
    border-radius:8px; padding:9px 12px; color:var(--red-dark); font-size:12.5px; margin-bottom:12px; }
  .tablewrap { background:#fff; border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:960px; }
  th { text-align:left; font:700 10.5px system-ui; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-v); padding:10px 12px; border-bottom:1px solid var(--line); background:var(--surf-low); white-space:nowrap; }
  td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
  tbody tr[data-id] { cursor:pointer; }
  tbody tr[data-id]:hover td { background:var(--surf-low); }
  tbody tr[data-id]:focus-visible { outline:2px solid var(--red); outline-offset:-2px; }
  tbody tr:last-child td { border-bottom:none; }
  .subj { font-weight:700; display:block; }
  .subj-sub { color:var(--ink-v); font-size:11.5px; display:block; margin-top:2px; }
  .nowrap { white-space:nowrap; }
  .muted { color:var(--ink-v); }
  .cell-empty { color:var(--ink-v); text-align:center; padding:44px 16px; }
  /* Type / status / relation badges. Colour is decoration only — every badge
     also carries its word, so a browser-synthesized dark theme can't hide meaning. */
  .badge { display:inline-block; border-radius:999px; padding:1px 8px; white-space:nowrap;
    font:700 10.5px system-ui; text-transform:uppercase; letter-spacing:.04em;
    background:var(--surf-high); color:var(--ink-v); }
  .badge.t-bid { background:#e7eefb; color:#264b8b; }
  .badge.t-reply { background:#f1eaf8; color:#5b3d86; }
  .badge.s-ok { background:#e3f3e6; color:var(--ok); }
  .rel { display:inline-block; margin-left:6px; border:1px solid var(--line); border-radius:999px;
    padding:0 7px; font:700 10.5px system-ui; color:var(--ink-v); background:#fff; white-space:nowrap; }
  .score { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:1px 8px;
    font:800 10.5px system-ui; letter-spacing:.03em; white-space:nowrap; background:var(--surf-high); color:var(--ink-v); }
  .score.rec-pursue { background:#e3f3e6; border-color:#bfe3c8; color:var(--ok); }
  .score.rec-review { background:var(--surf-high); border-color:var(--line); color:var(--ink-v); }
  .score.rec-pass { background:#f3f2f2; border-color:var(--line); color:#8d8b8b; }
  /* detail — centered modal pop-up, matching the Customer Portal CRM drawer so
     both staff surfaces open the same way. Wider than that one (720px): a lead
     is mostly a long email body, and 560px turns it into a column of slivers. */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10000; display:none; }
  #drawer { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(720px,94vw); max-height:88vh; background:#fff; z-index:10001;
    border-radius:12px; box-shadow:0 16px 48px rgba(0,0,0,.30); overflow:hidden;
    display:none; flex-direction:column; }
  #drawer.open { display:flex; }
  .dhead { flex:0 0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:18px 20px; border-bottom:1px solid var(--line); }
  .dhead h2 { margin:0; font-size:17px; line-height:1.3; }
  .dsub { color:var(--ink-v); font-size:12px; margin:4px 0 0; }
  .dclose { border:none; background:none; font-size:22px; line-height:1; cursor:pointer; color:var(--ink-v); padding:0 2px; }
  .dbody { flex:1 1 auto; min-height:0; overflow-y:auto; padding:18px 20px 30px; }
  .sec { margin-bottom:20px; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--ink-v); margin-bottom:6px; }
  .fgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 16px; }
  .f { min-width:0; }
  .f .k { font:700 10px system-ui; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-v); }
  .f .v { font-size:13px; word-break:break-word; }
  .row3 { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { min-height:38px; padding:0 14px; border-radius:7px; border:1px solid transparent; font:inherit;
    font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    text-decoration:none; }
  .btn-p { background:var(--red-dark); color:#fff; } .btn-p:hover { background:var(--red); }
  .btn-s { background:#fff; color:var(--ink); border-color:var(--line); } .btn-s:hover { background:var(--surf-low); }
  .btn-s.on { background:#e3f3e6; border-color:#bfe3c8; color:var(--ok); }
  .btn-xs { min-height:30px; padding:0 10px; font-size:12px; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .card { border:1px solid var(--line); border-radius:9px; background:var(--surf-low); padding:12px 13px; }
  .card.ai { border-left:3px solid var(--red); }
  .aihead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .big { font:800 24px/1 system-ui; font-variant-numeric:tabular-nums; }
  .of100 { font:600 11px system-ui; color:var(--ink-v); }
  .kvs { margin:9px 0 0; padding:0; list-style:none; font-size:12.5px; }
  .kvs li { padding:4px 0; border-top:1px solid var(--line); }
  .kvs li .k { font:700 10px system-ui; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-v); display:block; }
  pre.email { white-space:pre-wrap; word-break:break-word; margin:0; max-height:340px; overflow:auto;
    background:var(--surf-low); border:1px solid var(--line); border-radius:8px; padding:12px;
    font:400 12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .note { color:var(--ink-v); font-size:12px; margin:8px 0 0; }
  .note.warn { color:var(--red-dark); }
  /* An auto-created draft was written by the machine, not by an estimator —
     say so in words next to the link, so nobody mistakes it for a reviewed bid. */
  .auto { display:inline-block; border:1px solid #bfe3c8; background:#e3f3e6; color:var(--ok);
    border-radius:999px; padding:2px 9px; font:700 11px system-ui; }
  @media (max-width:600px) { .wrap { padding:20px 14px 56px; } .fgrid { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo">T</div>
      <h1>Lead Inbox</h1>
    </div>
    <p class="sub">Bid invites and project email as BasisBoard scraped them. BasisBoard stays read-only — qualifying, AI scoring and the estimates drafted from a lead all live here.</p>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Search subject, project, company, city…" autocomplete="off" />
      <div id="views" class="views"></div>
      <span id="count" class="count"></span>
    </div>
    <div id="alert" class="alert" hidden></div>
    <div class="tablewrap">
      <table id="lead-table">
        <thead>
          <tr>
            <th>Project / Subject</th>
            <th>Company</th>
            <th>Location</th>
            <th>Bid deadline</th>
            <th>Distance · Travel</th>
            <th>Type</th>
            <th>Received</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="lead-rows">
          <tr><td class="cell-empty" colspan="8">Loading leads…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="scrim"></div>
  <aside id="drawer"></aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <script src="/js/leads.js"></script>
</body>
</html>
