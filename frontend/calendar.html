<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bid Calendar · Treadwell Proposal Generator</title>
  <link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
  <!-- Styles itself, like followups.html and portal.html, so it needs its own opt-out:
       without it Chromium synthesizes a dark theme, which flattens the urgency stripe
       and the stage dots into each other. There is no dark theme in this repo. -->
  <meta name="color-scheme" content="only light" />
  <style>
    :root { color-scheme: only light;
      --red:#c8102e; --red-dark:#9e001f; --red-tint:#fbe9ec; --red-wash:#fdf5f6;
      --ink:#1b1c1c; --ink-v:#5c403f; --ink-mut:#8a857c;
      --surf:#f4f4f5; --card:#ffffff; --surf-low:#f3f1ea; --surf-high:#eae6dd;
      --line:rgba(27,28,28,.1); --line-soft:#f0ece4;
      /* Urgency is its own scale, deliberately NOT the brand red: if "overdue" were
         the accent colour, ordinary page chrome would read as an alarm. */
      --late:#b3261e; --late-bg:#fdf1f0;
      --soon:#9a5b00; --soon-bg:#fdf5e8;
      --calm:#4a6b8a;
      --ok:#0f7b34; --warn:#7a5c00;
      --shadow:0 1px 2px rgba(60,50,40,.05), 0 4px 16px rgba(60,50,40,.055);
      --shadow-lift:0 2px 4px rgba(60,50,40,.06), 0 10px 28px rgba(60,50,40,.10);
      --display:'Georgia','Iowan Old Style','Times New Roman',serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--surf); color:var(--ink); padding:28px 22px 90px;
      font:400 14px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .top { display:flex; align-items:center; gap:14px; max-width:1660px; margin:0 auto 6px; }
    .logo { width:54px; height:34px; display:block; flex:none; }
    h1 { font:400 29px/1.15 var(--display); letter-spacing:-.012em; margin:0; }
    .views { display:flex; gap:2px; margin-left:auto; }
    .views a { padding:7px 13px; border-radius:9px; font:600 13px system-ui; color:var(--ink-v);
      text-decoration:none; border:1px solid transparent; }
    .views a:hover { background:var(--surf-low); color:var(--ink); }
    .views a[aria-current] { background:var(--card); border-color:var(--line);
      color:var(--red-dark); box-shadow:var(--shadow); }
    .hint { max-width:1660px; margin:0 auto 18px; color:var(--ink-v); font-size:13.5px; }
    .wrap { max-width:1660px; margin:0 auto; }

    /* ── toolbar ── */
    .toolbar { display:flex; align-items:center; gap:9px; flex-wrap:wrap; background:var(--card);
      border:1px solid var(--line); border-radius:14px; padding:10px 12px;
      box-shadow:var(--shadow); margin-bottom:12px; }
    .range { font:400 17px var(--display); letter-spacing:-.005em; min-width:170px; }
    .btn { min-height:34px; padding:6px 12px; border:1px solid var(--line); background:var(--card);
      border-radius:9px; font:600 13px system-ui; color:var(--ink); cursor:pointer; }
    .btn:hover { background:var(--surf-low); }
    .btn:disabled { color:var(--ink-mut); background:var(--surf-low); cursor:default; }
    .btn.icon { width:34px; padding:0; font-size:14px; line-height:1; }
    .btn.primary { background:var(--red); border-color:var(--red); color:#fff; }
    .btn.primary:hover { background:var(--red-dark); }
    .nav { display:flex; gap:4px; }
    .seg { display:inline-flex; background:var(--surf-low); border:1px solid var(--line);
      border-radius:10px; padding:2px; gap:2px; }
    .seg button { border:0; background:none; padding:6px 11px; border-radius:8px;
      font:600 12.5px system-ui; color:var(--ink-v); cursor:pointer; }
    .seg button[aria-pressed="true"] { background:var(--card); color:var(--red-dark);
      box-shadow:0 1px 2px rgba(60,50,40,.08); }
    .grow { flex:1; }
    .tw-select, .tw-search { min-height:34px; padding:6px 10px; border:1px solid var(--line);
      border-radius:9px; font:inherit; font-size:13px; background:var(--card); color:var(--ink); }
    .tw-search { width:190px; }
    .tw-select:focus, .tw-search:focus, .btn:focus-visible, .seg button:focus-visible,
    .card:focus-visible { outline:2px solid var(--red); outline-offset:2px; }

    /* ── summary strip: the answer before the detail ── */
    .sum { display:flex; background:var(--card); border:1px solid var(--line); border-radius:14px;
      box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden; flex-wrap:wrap; }
    .sum > div { padding:11px 18px; border-right:1px solid var(--line-soft); }
    .sum > div:last-child { border-right:0; }
    .sum b { display:block; font:600 19px system-ui; font-variant-numeric:tabular-nums;
      letter-spacing:-.01em; }
    .sum span { font:700 9.5px system-ui; text-transform:uppercase; letter-spacing:.07em;
      color:var(--ink-mut); }
    .sum .s-late b { color:var(--late); }
    .sum .s-soon b { color:var(--soon); }

    /* ── grid ── */
    .dows { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:6px; }
    .dow { font:700 9.5px system-ui; text-transform:uppercase; letter-spacing:.08em;
      color:var(--ink-mut); padding:0 4px; }
    .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .cell { background:var(--card); border:1px solid var(--line); border-radius:11px;
      min-height:170px; padding:7px; display:flex; flex-direction:column; gap:5px; }
    .cell.we { background:#f8f6f1; }
    .cell.past { opacity:.62; }
    .cell.today { border-color:var(--red); box-shadow:0 0 0 2px var(--red-tint); }
    .cell.other-month .dnum b { color:var(--ink-mut); }
    .dnum { display:flex; align-items:baseline; gap:6px; padding:1px 3px 3px; }
    .dnum b { font:600 14px system-ui; font-variant-numeric:tabular-nums; }
    .cell.today .dnum b { color:var(--red-dark); }
    .dnum .tag { font:700 8.5px system-ui; text-transform:uppercase; letter-spacing:.06em;
      color:#fff; background:var(--red); padding:2px 5px; border-radius:5px; }
    .dnum .load { margin-left:auto; font:600 10.5px system-ui; color:var(--ink-mut);
      font-variant-numeric:tabular-nums; }
    .cell.heavy .dnum .load { color:var(--soon); }

    /* ── card ── */
    .card { display:block; text-decoration:none; color:inherit; background:var(--card);
      border:1px solid var(--line); border-left:3px solid var(--calm); border-radius:8px;
      padding:6px 8px 7px; box-shadow:0 1px 1px rgba(60,50,40,.04);
      transition:box-shadow .12s, transform .12s, border-color .12s; }
    .card:hover { box-shadow:var(--shadow-lift); border-color:var(--surf-high);
      transform:translateY(-1px); }
    @media (prefers-reduced-motion:reduce) {
      .card { transition:none; } .card:hover { transform:none; }
    }
    .card.u-late { border-left-color:var(--late); background:var(--late-bg); }
    .card.u-soon { border-left-color:var(--soon); background:var(--soon-bg); }
    .card.u-none { border-left-color:var(--ink-mut); }
    .cname { font:600 12px/1.32 system-ui; margin:0 0 3px; overflow:hidden;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .cmeta { display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-v);
      font-variant-numeric:tabular-nums; }
    .cmeta .amt { margin-left:auto; font-weight:600; color:var(--ink); }
    .cgc { font-size:10.5px; color:var(--ink-mut); margin-top:3px; display:flex;
      align-items:center; gap:4px; min-width:0; }
    .cgc b { font-weight:500; color:var(--ink-v); overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; }
    .plus { font:700 9px system-ui; background:var(--surf-high); color:var(--ink-v);
      padding:1px 4px; border-radius:4px; flex:none; }
    /* Nobody assigned. Hollow and dashed, and the "?" plus the word "Unassigned" say so
       too — the styling is reinforcement, never the only signal.
       A MODIFIER, deliberately not a redefinition of `.tw-av`: that class is declared
       once in auth.js for every page, and a page-local copy is how one person ends up a
       different size on one screen. This adds only the fill, so the shared geometry (and
       any future fix to it) still applies. `.tw-av` sets no background of its own, so
       this needs no !important to win. */
    .av-none { background:#fff; color:var(--ink-mut); border:1px dashed #c9c3b8;
      font-size:11px; font-weight:600; }

    /* ── undated tray ── */
    .tray { margin-top:20px; background:var(--card); border:1px solid var(--line);
      border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; }
    .tray h2 { font:400 17px var(--display); margin:0 0 3px; }
    .tray p { margin:0 0 11px; font-size:12.5px; color:var(--ink-v); }
    .tray .row { display:flex; flex-wrap:wrap; gap:7px; }
    .tray .card { width:242px; }

    .legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:18px; font-size:11.5px;
      color:var(--ink-mut); align-items:center; }
    .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px;
      vertical-align:-1px; }
    .alert { border:1px solid #f0d9dd; border-left:3px solid var(--red); background:var(--red-wash);
      border-radius:10px; padding:10px 13px; color:var(--red-dark); font-size:12.5px;
      margin:0 0 14px; }
    .alert[hidden] { display:none; }
    /* The `hidden` ATTRIBUTE only works while nothing outcompetes it. The UA stylesheet's
       `[hidden]{display:none}` loses to any author rule that sets `display`, so every one
       of these — each of which sets flex or grid above — rendered as an empty toolbar and
       an empty summary strip on first paint, before any data existed. Re-asserting it here
       as an author rule is what makes `hidden` mean hidden. */
    .toolbar[hidden], .sum[hidden], .dows[hidden], .legend[hidden], .grid[hidden] { display:none; }
    .stale { border-color:#e8dcc0; border-left-color:var(--warn); background:#fdf9ee;
      color:var(--warn); }
    .loading, .empty { background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:34px; text-align:center; color:var(--ink-v); box-shadow:var(--shadow); }
    /* ── add/edit dialog ── */
    dialog { border:0; border-radius:16px; padding:0; max-width:560px; width:calc(100% - 32px);
      box-shadow:0 10px 50px rgba(27,28,28,.28); color:var(--ink); background:var(--card); }
    dialog::backdrop { background:rgba(27,28,28,.42); }
    dialog form { padding:20px 22px 18px; display:flex; flex-direction:column; gap:4px; }
    dialog h2 { font:400 20px var(--display); margin:0 0 12px; }
    dialog label { font:700 10px system-ui; text-transform:uppercase; letter-spacing:.07em;
      color:var(--ink-mut); margin-top:9px; }
    dialog .fhint { text-transform:none; letter-spacing:0; font-weight:500; color:var(--ink-mut); }
    dialog input, dialog select, dialog textarea { font:inherit; font-size:13.5px; padding:8px 10px;
      border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink);
      width:100%; }
    dialog textarea { resize:vertical; min-height:58px; }
    dialog input:focus, dialog select:focus, dialog textarea:focus { outline:none;
      border-color:var(--red); box-shadow:0 0 0 3px var(--red-tint); }
    .frow { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .dlg-foot { display:flex; align-items:center; gap:8px; margin-top:18px;
      padding-top:14px; border-top:1px solid var(--line-soft); }
    .btn.danger { border-color:#e6c9c9; color:var(--late); background:var(--card); }
    .btn.danger:hover { background:var(--late-bg); }
    .ferr { border:1px solid #f0d9dd; border-left:3px solid var(--red); background:var(--red-wash);
      border-radius:9px; padding:9px 12px; color:var(--red-dark); font-size:12.5px; margin:0 0 4px; }
    .ferr[hidden] { display:none; }
    /* Ours are editable, so they invite a click. The mirrored Basisboard ones open in
       Basisboard instead, and the dotted underline on the source dot is the only hint
       needed at this size. */
    .card.mine { cursor:pointer; }
    .src { font:700 8px system-ui; letter-spacing:.05em; text-transform:uppercase;
      padding:1px 4px; border-radius:4px; background:var(--surf-high); color:var(--ink-v);
      flex:none; }
    .card.mine .src { background:var(--red-tint); color:var(--red-dark); }
    @media (max-width:640px) { .frow { grid-template-columns:1fr; } }
    @media (max-width:1000px) {
      .grid { grid-template-columns:repeat(2,1fr); }
      .dows { display:none; }
      .cell { min-height:0; }
    }
  </style>
</head>
<body>
  <div class="top">
    <img class="logo" src="/img/treadwell-bison.svg" width="54" height="34" alt="Treadwell" />
    <h1>Bid Calendar</h1>
    <nav class="views" aria-label="Bid views">
      <a href="/crm.html">Pipeline</a>
      <a href="/calendar.html" aria-current="page">Calendar</a>
      <a href="/analytics.html">Analytics</a>
    </nav>
  </div>
  <p class="hint">Every bid we're chasing, on the day it's due. Deadlines are shown in Central
    time, and bids with no deadline set are listed underneath rather than hidden.</p>

  <div class="wrap">
    <p id="alert" class="alert" hidden></p>

    <div id="toolbar" class="toolbar" hidden>
      <span id="range" class="range"></span>
      <span class="nav">
        <button type="button" id="prev" class="btn icon" aria-label="Previous range">‹</button>
        <button type="button" id="next" class="btn icon" aria-label="Next range">›</button>
        <button type="button" id="today" class="btn">Today</button>
      </span>
      <span id="modes" class="seg" role="group" aria-label="Range length"></span>
      <span class="grow"></span>
      <input id="q" type="search" class="tw-search" placeholder="Search bid, GC, city…"
             aria-label="Search bids" autocomplete="off" />
      <select id="est" class="tw-select" aria-label="Filter by estimator">
        <option value="">Any estimator</option>
      </select>
      <select id="stage" class="tw-select" aria-label="Filter by stage">
        <option value="">Any stage</option>
      </select>
      <a id="bb" class="btn" href="https://app.basisboard.com/calendar"
         target="_blank" rel="noopener noreferrer">BasisBoard ↗</a>
      <button type="button" id="add" class="btn primary">+ Add</button>
    </div>

    <div id="sum" class="sum" hidden></div>
    <div id="dows" class="dows" aria-hidden="true" hidden></div>
    <div id="grid" class="loading">Loading bids…</div>
    <section id="tray" class="tray" hidden></section>
    <div id="legend" class="legend" hidden></div>
  </div>

  <!-- One dialog for add and edit. <dialog> gives focus trapping, Esc and the backdrop
       for free; hand-rolling those is where keyboard access quietly goes missing. -->
  <dialog id="dlg" aria-labelledby="dlg-title">
    <form id="dlg-form" method="dialog">
      <h2 id="dlg-title">Add to the calendar</h2>
      <p id="dlg-err" class="ferr" hidden></p>
      <label for="f-title">Name</label>
      <input id="f-title" name="title" type="text" required maxlength="500"
             placeholder="e.g. Monticello Trails Middle School" />
      <div class="frow">
        <div>
          <label for="f-deadline">Deadline <span class="fhint">Central</span></label>
          <input id="f-deadline" name="deadline_at" type="datetime-local" />
        </div>
        <div>
          <label for="f-kind">Kind</label>
          <select id="f-kind" name="kind">
            <option value="bid">Bid due</option>
            <option value="site_visit">Site visit</option>
            <option value="submission">Submission</option>
            <option value="reminder">Reminder</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div>
          <label for="f-customer">Customer / GC</label>
          <input id="f-customer" name="customer" type="text" maxlength="500" />
        </div>
        <div>
          <label for="f-value">Value</label>
          <input id="f-value" name="value" type="text" inputmode="decimal" placeholder="$" />
        </div>
      </div>
      <div class="frow">
        <div>
          <label for="f-location">Location</label>
          <input id="f-location" name="location" type="text" maxlength="500" />
        </div>
        <div>
          <label for="f-est">Estimator</label>
          <select id="f-est" name="estimator_email"><option value="">Unassigned</option></select>
        </div>
      </div>
      <label for="f-notes">Notes</label>
      <textarea id="f-notes" name="notes" rows="3" maxlength="4000"></textarea>
      <div class="dlg-foot">
        <button type="button" id="f-del" class="btn danger" hidden>Delete</button>
        <span class="grow"></span>
        <button type="button" id="f-cancel" class="btn">Cancel</button>
        <button type="submit" id="f-save" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <!-- Shared person rendering (names, initials, avatar colours) — must precede the page
       script, which reads window.TWCrm as it runs. -->
  <script src="/js/crm-core.js"></script>
  <!-- Central-calendar day stamping, shared with the Analytics dashboard. -->
  <script src="/js/analytics-core.js"></script>
  <script src="/js/calendar-core.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>
