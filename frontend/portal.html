<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Active Projects · Treadwell Proposal Generator</title>
<link rel="icon" type="image/svg+xml" href="/img/treadwell-bison.svg" />
<!-- This page styles itself and does not link styles.css, so it needs its own
     opt-out. Without it Chromium synthesizes a dark theme over the whole drawer
     and flattens every near-white surface to the same grey — which is what made
     the two chat sides indistinguishable. There is no dark theme in this repo. -->
<meta name="color-scheme" content="only light" />
<style>
  :root { color-scheme: only light;
    --red:#c8102e; --red-dark:#9e001f; --ink:#1b1c1c; --ink-v:#5c403f;
    --surf:#fbf9f8; --surf-low:#f5f3f3; --surf-high:#e9e8e7; --line:#e4e2e2; --ok:#1f7a34;
    /* styles.css's --treadwell-red-light, mirrored here like the rest of this block. It is the
       one warm tint in the palette that is legible ON the red bubble, which is what a failure
       note inside a staff message needs. */
    --red-light:#ffdad8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--surf); color:var(--ink);
    font:400 14px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { padding:24px 28px 64px; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.01em; margin:0 0 2px; }
  .sub { color:var(--ink-v); margin:0 0 18px; font-size:13px; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .toolbar input { flex:1; max-width:340px; min-height:40px; padding:8px 12px; border:1px solid var(--line);
    border-radius:6px; font:inherit; }
  .count { color:var(--ink-v); font-size:12px; margin-left:auto; }
  /* sort/filter controls — same shapes as the Projects toolbar so the two pages
     don't feel like different apps. Palette vars are already compatible. */
  .toolbar { flex-wrap:wrap; }
  .tw-select { background:#fff; color:var(--ink-v); border:1px solid var(--line); border-radius:6px;
    min-height:40px; padding:7px 10px; font:600 12.5px system-ui; cursor:pointer; }
  .tw-select:hover, .tw-select:focus { border-color:var(--red); outline:none; }
  .tw-dir { min-width:76px; text-align:center; font-variant-numeric:tabular-nums; }
  .tw-dir[aria-pressed="true"] { color:var(--red); border-color:var(--red); }
  .tw-clear { background:#fff; color:var(--ink-v); border:1px solid var(--line); border-radius:999px;
    min-height:40px; padding:0 14px; font:600 12.5px system-ui; cursor:pointer; }
  .tw-clear:hover { border-color:var(--red); color:var(--red); }
  /* Pressed state on a pill has to be visible without colour alone — this page can
     be re-tinted by a synthesized dark theme — so the label itself flips too
     ("Show"/"Hide", "Table"/"Board"). */
  .tw-clear[aria-pressed="true"] { border-color:var(--ink-v); color:var(--ink); background:var(--surf-high); }
  /* Active / Test. Same two categories, same `is_test` flag, as the Proposals Database, so
     these are pills in the toolbar family rather than a new shape, and the selected one is
     marked by weight and a filled background as well as tint (this page can be re-tinted by a
     synthesized dark theme, so colour alone would not survive). Its own row above the
     toolbar: it says which board you are on, not how it is filtered. */
  /* Wraps since 2026-08-20, when Won made it four pills. Flex does not wrap by default, and four
     pills plus their counts are within reach of a phone's width: a pill pushed off the right edge is
     a tab that does not exist as far as the rep is concerned. */
  .tw-tabs { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
  .tw-tab { background:#fff; color:var(--ink-v); border:1px solid var(--line); border-radius:999px;
    min-height:36px; padding:0 14px; font:700 13px system-ui; cursor:pointer; display:inline-flex;
    align-items:center; gap:6px; }
  .tw-tab:hover { border-color:var(--red); color:var(--red); }
  .tw-tab[aria-pressed="true"] { background:var(--red-dark); border-color:var(--red-dark); color:#fff; }
  .tw-tab .n { font-size:11px; font-weight:800; font-variant-numeric:tabular-nums;
    background:var(--surf-high); color:var(--ink-v); border-radius:999px; padding:1px 6px; }
  .tw-tab[aria-pressed="true"] .n { background:rgba(255,255,255,.22); color:#fff; }
  .board { display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:8px; }
  /* The table replaces the columns inside the same #board node, so it has to undo
     the flex row that node is otherwise carrying. */
  .board.as-table { display:block; overflow-x:auto; }
  .col { flex:0 0 270px; background:var(--surf-low); border:1px solid var(--line); border-radius:10px; padding:10px; }
  /* ── THE BOARD ON A PHONE: ONE COLUMN PER SWIPE ──────────────────────────────────────────────
     WHICH COLUMN A JOB SITS IN IS THE INFORMATION on this page. Flattening the five stages into one
     scrolling list of cards - the obvious way to make a kanban board fit 375px - throws away the
     only thing the board says that the Proposals Database does not. And 270px columns at 375px are
     a column and a half of a five-column pipeline: legible, but with nothing to tell a rep that
     there is more, because the horizontal scrollbar is hidden on touch.
     So the columns stay and the phone gets one at a time. 86% wide, snapped, which leaves the next
     stage's edge showing at every width - that sliver is the affordance the scrollbar used to be.
     .board already owned its overflow-x, so the BODY never scrolls sideways either way; scroll-snap
     is what makes a swipe land somewhere legible rather than halfway between two stages.
     Not applied to .board.as-table: the Table view is one wide table and snapping its columns to
     the viewport would fight reading a row across. */
  @media (max-width:767px) {
    /* 28px of gutter each side spends 15% of a 375px screen on nothing. 12 is still a margin. */
    .wrap { padding:14px 12px 64px; }
    .board:not(.as-table) { scroll-snap-type:x mandatory; }
    .board:not(.as-table) > .col { flex:0 0 86%; scroll-snap-align:start; }
    /* Files / Info sit on every card and are the two things a phone user reaches for most, so they
       take a real touch target. 10.5px type is kept: the label is not what was too small. */
    .deal-act { min-height:44px; padding:0 12px; }
  }
  .col h2 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-v);
    margin:2px 4px 10px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  /* "+ New" in the Created-but-not-sent header. The count keeps the middle of the row, so
     the button is pushed to the end rather than replacing space-between with a 3-way split. */
  .col h2 .col-add { margin-left:auto; font:inherit; font-size:10px; letter-spacing:.04em;
    border:1px solid var(--red-dark); color:var(--red-dark); background:#fff;
    border-radius:999px; padding:2px 9px; cursor:pointer; white-space:nowrap; }
  .col h2 .col-add:hover { background:var(--red-dark); color:#fff; }
  /* Files / Info on every card. Quiet by default — they are always-available utilities, not
     the point of the card — and they must not compete with the project name above them. */
  .deal-acts { display:flex; gap:6px; margin-top:8px; }
  .deal-act { font:inherit; font-size:10.5px; font-weight:600; border:1px solid var(--line);
    background:#fff; color:var(--ink-v); border-radius:6px; padding:3px 9px; cursor:pointer; }
  .deal-act:hover { border-color:var(--red-dark); color:var(--red-dark); }
  /* "Deposit submitted" — the customer has paid and nobody has confirmed it yet,
     so this column is the one that needs a human. Flagged only when occupied. */
  .col.col-attn { border-color:var(--red); background:#fdf3f3; }
  .col.col-attn h2 { color:var(--red-dark); }
  .deal { position:relative; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:8px; cursor:pointer;
    transition:border-color .15s,box-shadow .15s; }
  .deal:hover { border-color:var(--red); box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .deal .name { font-weight:700; padding-right:26px; }
  .deal .unread { position:absolute; top:8px; right:8px; min-width:20px; height:20px; padding:0 6px; border-radius:999px;
    background:var(--red); color:#fff; font-size:11px; font-weight:800; line-height:20px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .deal .meta { color:var(--ink-v); font-size:12px; margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deal .meta.who, .deal .meta.act { color:var(--ink); font-weight:600; }
  /* The label is the quiet half — the name and the date are what you scan for. */
  .deal .meta .k { color:var(--ink-v); font-weight:500; }
  .deal .val { color:var(--red-dark); font-weight:700; font-variant-numeric:tabular-nums; margin-top:4px; }
  /* A name with no confirmed owner behind it — whoever built the estimate. The "?" in
     the text carries the same meaning where colour can't. */
  .unassigned { color:var(--ink-v); font-weight:500; font-style:italic; }
  /* .tw-av / .tw-av-dim (the person chip) are defined once in auth.js's
     injected stylesheet, which every page loads. */
  .empty { color:var(--ink-v); font-size:12px; padding:8px 4px; }
  /* Follow-up state chips (paused / automation off / closed lost). Every one of them
     says its state in words; the tint is only reinforcement. */
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .chip { font-size:10px; font-weight:700; border-radius:999px; padding:1px 7px;
    border:1px solid var(--line); background:var(--surf-high); color:var(--ink-v); white-space:nowrap; }
  .chip-pause { background:#fdf6e3; border-color:#e8d9a8; color:#7a5c00; }
  .chip-off { background:var(--surf-high); }
  /* Kept for a lost proposal opened straight from a link, even though no card on the board
     can carry it any more: closed-lost rows leave the board entirely (portal.js:boardPool). */
  .chip-lost { background:var(--surf-high); color:var(--ink-v); text-decoration:none; }
  /* Only ever seen on the Lost tab, which is the one place test and real work sit together. */
  .chip-test { background:#eef4ff; border-color:#c9dbff; color:#20408a; }
  /* Approved AND the deposit settled. Green because it is the one chip that is good news; the word
     still carries it on its own, for the synthesized dark theme some browsers apply here. */
  .chip-won { background:#eaf7ee; border-color:#b6ddc2; color:#1c6b35; }
  /* Every proposal as one sortable list — the answer to "show me all sixty". */
  .ptable { width:100%; border-collapse:separate; border-spacing:0; background:#fff;
    border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13px; }
  .ptable th, .ptable td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  .ptable thead th { position:sticky; top:0; z-index:1; background:var(--surf-low); font-size:10.5px;
    font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-v); white-space:nowrap; }
  .ptable tbody tr:last-child td { border-bottom:none; }
  .ptable tbody tr { cursor:pointer; }
  .ptable tbody tr:hover { background:var(--surf-low); }
  .ptable tbody tr:focus-visible { outline:2px solid var(--red); outline-offset:-2px; }
  .ptable .num { text-align:right; font-variant-numeric:tabular-nums; }
  .ptable .t-name { font-weight:700; }
  .ptable .th-sort { padding:0; }
  .ptable .th-sort button { width:100%; text-align:inherit; background:none; border:none; cursor:pointer;
    font:inherit; color:inherit; padding:9px 12px; }
  .ptable .th-sort button:hover { color:var(--red); }
  .ptable .th-sort.is-sorted { color:var(--ink); }
  .ptable .num.th-sort button { text-align:right; }
  .unread-dot { display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background:var(--red); color:#fff; font-size:10px; font-weight:800; line-height:18px; text-align:center; }
  /* detail — centered modal pop-up (dimmed backdrop; Esc / backdrop / × to close) */
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10000; display:none; }
  #drawer { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(780px,95vw); max-height:92vh; background:#fff; z-index:10001;
    border-radius:12px; box-shadow:0 16px 48px rgba(0,0,0,.30); overflow:hidden;
    display:none; flex-direction:column; }
  #drawer.open { display:flex; }
  /* per-project notification chips (in the detail drawer) */
  .nt-chips { display:flex; flex-wrap:wrap; gap:6px; margin:0; }
  /* ── Sent versions ─────────────────────────────────────────────────────────
     One row per snapshot, the money right-aligned so a revised price is scannable down the
     column, and the download buttons trailing it.

     THE 57px ROW WAS NEVER A DESIGN DECISION, and this is the fix. Each download control is
     `class="btn btn-s rev-dl"`, and the rule below overrides its padding and its font-size but
     NOT `.btn { min-height:42px }` — so an 11.5px inline download inherited a primary button's
     floor, and 42 plus 7 top and 7 bottom made a 57px row, eight times over. `min-height` is
     added at the SAME selector, which is where the other two overrides already live and
     therefore already outranks `.btn` on specificity. That alone takes eight rows from 456px to
     240px, before a single one is folded away. */
  .rev-list { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .rev-row { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; min-height:28px;
    padding:5px 10px; font-size:12.5px; }
  /* A hairline BETWEEN rows rather than above every one of them: the .rev-list border is
     already the top edge, and a border on the first row doubled it. */
  .rev-row + .rev-row { border-top:1px solid var(--line); }
  /* The one row anybody reads in a meeting, at full weight and given the room for it. */
  .rev-row.is-current { background:var(--surf-low); padding:8px 10px; }
  .rev-n { font-weight:700; min-width:44px; }
  .rev-row .rev-when { color:var(--ink-v); font-variant-numeric:tabular-nums; min-width:52px; }
  .rev-who { color:var(--ink-v); display:inline-flex; align-items:center; gap:5px; }
  .rev-row .rev-amt { margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums; }
  /* AN UNCHANGED PRICE LOSES ITS WEIGHT, so the column reads as a change log. Seven of eight
     rows normally carry the same figure. Nothing is hidden: a repeated amount is still printed,
     at the same size, in the muted ink, so the rows where the price actually moved are the rows
     that read. */
  .rev-row.same .rev-amt { font-weight:400; color:var(--ink-v); }
  .rev-cur { font:700 9.5px system-ui; letter-spacing:.06em; text-transform:uppercase;
    color:#0f7b34; background:#dcf5e3; border-radius:999px; padding:2px 7px; }
  .rev-row .rev-dl { min-height:26px; padding:3px 9px; font-size:11.5px; }
  /* The fold. NO INNER SCROLLER: the drawer body already scrolls and the chat thread owns a
     second, and a third nested scroll region inside a card is worse than the wall of rows it
     would be hiding. The earlier sends collapse instead, and the fold says how many there are
     and whether the price ever moved, which is the only reason anybody opens it. */
  .rev-fold { padding:0 10px; border-top:1px solid var(--line); background:#fff; }
  .rev-fold > summary { padding:7px 0; }
  /* No box of its own for the rows it hides: .rev-list IS the box, and a second border inside
     it would be a fifth way to draw a card. The negative margin undoes .rev-fold's padding so
     the folded rows line up with the current one exactly. */
  .rev-folded { margin:0 -10px; border-top:1px solid var(--line); }
  .rev-folded .rev-row:first-child { border-top:0; }
  .rev-fold .note { padding:2px 0 9px; }
  .nt-chip { border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700;
    cursor:pointer; background:var(--surf-high); color:var(--ink-v); }
  .nt-chip.on { background:#e3f3e6; color:var(--ok); border-color:#bfe3c8; }
  /* Read-only chips (a non-admin looking at somebody else) render as spans, not disabled buttons.
     The state colour must keep reading the same — only the cursor changes. */
  span.nt-chip { cursor:default; }
  .nt-chip:disabled { cursor:not-allowed; opacity:.7; }
  /* The avatar inside a toggle chip, deliberately colourless — NOT the shared .tw-av.
     On this control colour IS the state (green = receives this project's email), so an
     identity colour would compete with the one signal that matters: a purple Alejandro
     beside a green Hanz leaves "green" ambiguous. It borrows the chip's own on/off tint
     instead of carrying its own, and keeps .tw-av's geometry so a name still sits at the
     same height as everywhere else. Same class and same reasoning as notifications.html,
     which hosts the global version of this control. */
  .nt-chip .nt-av { display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; margin-right:5px; flex:0 0 auto;
    font:800 9.5px/1 system-ui; letter-spacing:.02em; vertical-align:middle; text-transform:uppercase;
    background:rgba(27,28,28,.09); color:var(--ink-v); }
  .nt-chip.on .nt-av { background:rgba(31,122,52,.15); color:var(--ok); }
  .dhead { flex:0 0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:15px 20px 13px; border-bottom:1px solid var(--line); }
  .dhead .dh-t { min-width:0; display:flex; flex-direction:column; gap:3px; }
  .dhead h2 { margin:0; font-size:18px; line-height:1.25; letter-spacing:-.01em; }
  /* The one line that holds still on every tab: who the project is for, and what it is
     worth. The step strip below says which STAGE it has reached; this says what it IS,
     so replying on the Chat tab no longer means guessing whose job this is. Money is
     tabular so two drawers opened in turn line their figures up. */
  .dh-meta { display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 7px; font-size:12.5px; color:var(--ink-v); }
  .dh-meta .dh-who { font-weight:600; color:var(--ink); }
  .dh-meta .dh-amt { font-weight:700; color:var(--ink); }
  .dh-meta .dh-sep { opacity:.45; }
  .dclose { border:none; background:none; font-size:22px; cursor:pointer; color:var(--ink-v); line-height:1;
    align-self:flex-start; padding:0 2px; }
  .dclose:hover { color:var(--red-dark); }
  .dbody { flex:1 1 auto; min-height:0; overflow-y:auto; padding:18px 20px; }
  /* drawer section tabs — a third flex item between .dhead and .dbody, so it
     pins without position:sticky (#drawer is a flex column; .dhead is flex:0 0 auto).
     Every attention state is carried by WORDS and a badge as well as colour: the
     rep's browser synthesizes dark mode over this page, so tint can be rewritten. */
  /* WRAPPING FLEX, NOT A FIXED COLUMN COUNT. It was `grid-template-columns:repeat(6,1fr)`
     while renderSecTabs rendered five tabs — Schedule went on 2026-08-11 and the sixth
     column stayed — so the strip carried a dead sixth of its width and every card was
     narrower than it needed to be. A hard count is also a number that can silently
     disagree with SEC_TABS in the other direction: add a tab and one of them wraps onto a
     second row, half-clipped. `flex:1 1 120px` cannot disagree with anything — the cards
     share whatever room there is, and only genuinely run out at phone widths, where they
     wrap on purpose instead of being squeezed to nothing. */
  .dtabs { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:6px;
    padding:10px 20px 12px; border-bottom:1px solid var(--line); background:#fff; }
  .dtabs .step { position:relative; flex:1 1 120px; min-width:0; display:block; text-align:left; font:inherit; cursor:pointer;
    border:1px solid var(--line); border-radius:8px; padding:7px 9px 8px; background:var(--surf-low); }
  /* Hover as an OUTLINE, not a border or a background: `border-color` here would repaint the
     red of a tab that needs a human, and `background` would repaint the white that marks the
     one you are on — so hovering would erase the two states this strip exists to show.
     :focus-visible below re-declares outline and comes later, so the keyboard ring still wins. */
  .dtabs .step:hover { outline:1px solid var(--ink-v); outline-offset:-1px; }
  .dtabs .step .lbl { margin-bottom:2px; }
  .dtabs .step .val { display:block; font-size:11.5px; font-weight:700; color:var(--ink-v); }
  /* CHAT IS THE ONE YOU ALWAYS LOOK AT. Hanz, 2026-08-21: "move that tab to the leftmost and
     make it a different color tab I guess so its just intuittive to always look there". It sits
     first in the strip and carries a blue tint that nothing else on this page uses, so the eye
     finds it without reading. Deliberately NOT red: red already means "needs a human" on this
     strip (.needs) and green means "done", so a third meaning had to pick a third hue.
     TARGETED BY ATTRIBUTE, NOT BY ID, AND THAT IS THE WHOLE POINT. This rule has to LOSE to
     .is-done, .needs and [aria-selected="true"], because a chat tab with unread messages must
     still read as needing attention and the tab you are on must still look selected. Those three
     each weigh (0 ids, 3 classes); `.dtabs .step#dtab-chat` weighed (1, 2), and one id beats any
     number of classes, so it silently defeated all three no matter what order they were written
     in. Measured in Brave on staging, on a Test project with one unread message: the chat tab
     carried `needs is-active` and aria-selected="true" and still painted #eff5fc, not the selected
     white and not the needs pink. `[data-sec="chat"]` weighs (0, 3) - equal - so being declared
     FIRST is what makes the three state rules below win. Order matters here only because the
     weights now match.
     A left accent bar carries the same signal for anyone whose browser rewrites the tint, or who
     cannot separate blue from grey; it outlives the state rules on purpose, because it marks WHICH
     tab this is rather than what state the tab is in. */
  .dtabs .step[data-sec="chat"] { border-color:#b9cfe8; background:#eff5fc; }
  .dtabs .step[data-sec="chat"]::before { content:""; position:absolute; left:0; top:6px; bottom:6px;
    width:3px; border-radius:2px; background:#2f6fb0; }
  .dtabs .step[data-sec="chat"] .lbl { padding-left:6px; }
  .dtabs .step[data-sec="chat"] .val { padding-left:6px; color:#2f6fb0; }
  .dtabs .step.is-done { border-color:#bfe3c8; background:#e3f3e6; }
  .dtabs .step.is-done .val { color:var(--ok); }
  .dtabs .step.needs { border-color:var(--red); background:#fdf3f3; }
  .dtabs .step.needs .lbl, .dtabs .step.needs .val { color:var(--red-dark); }
  .dtabs .step[aria-selected="true"] { background:#fff; border-color:var(--red-dark);
    box-shadow:inset 0 -3px 0 0 var(--red-dark); }
  /* The one you are on carries the strongest label on the strip. Weight as well as tint,
     because this page gets a synthesized dark theme in some browsers, which rewrites tint. */
  .dtabs .step[aria-selected="true"] .lbl { color:var(--ink); font-weight:800; }
  .dtabs .step:focus-visible { outline:2px solid var(--red); outline-offset:1px; }
  .tab-badge { display:inline-block; min-width:16px; height:16px; padding:0 4px; margin-left:4px; border-radius:999px;
    background:var(--red); color:#fff; font-size:10px; font-weight:800; line-height:16px; text-align:center; }
  /* One flex column per tab, so the gap between cards is declared once here instead of by
     every card carrying its own bottom margin. That matters because applySecPanel hides
     cards: a margin on a hidden card leaves a hole, a gap on the container does not. */
  .dpanel { display:flex; flex-direction:column; gap:18px; }
  .dpanel:focus { outline:none; }
  /* The drawer's paragraphs are all `.note`, and a <p>'s 1em margins do NOT collapse inside
     a flex column — they would stack on top of the gaps. Spacing belongs to the layout. */
  .dpanel p { margin:0; }
  .hidden { display:none !important; }
  /* ── follow-up section ────────────────────────────────────────────────────
     Each control row is one line that wraps rather than squeezing: the drawer is
     780px at most and the note input has to stay wide enough to type a sentence in. */
  /* The Follow-up tab is FOUR groups inside ONE registered section, and this is the column that
     spaces them. It cannot be .sec's own 7px gap, which holds a heading off its content, and it
     must not be .dpanel: that class carries a focus rule and a paragraph rule that belong to a tab
     panel, and reusing it on something that is not one is a lie the next reader has to unpick.
     Same 18px the panel puts between cards, because these read as cards. See followupPanelHtml for
     why the groups do not each take a dsec-* id of their own. */
  .fu-groups { display:flex; flex-direction:column; gap:18px; }
  /* margin:0 — the panel is a flex column with a gap, and a margin here would add to it. */
  .fu-line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0; }
  .fu-line .tw-select { min-height:38px; }
  /* ── WHERE THIS BID GOES ───────────────────────────────────────────────────
     The five controls that move the card to another tab or stop the chasing for months, and
     which used to look exactly like logging a phone call: same heading rank, same button, same
     grey paragraph above them. So they get the one tonal group on the tab, and every consequence
     sits BESIDE its control on one line instead of above the whole group as a paragraph.
     Rows rather than a two-column grid, which is the one place this differs from the mockup: one
     of the five states renders NO control at all (a job won by the deposit landing has nothing to
     undo), and in a grid that sentence lands in the control column unless a spacer cell is
     invented for it. A wrapping row needs no spacer and degrades on a narrow drawer by wrapping,
     which is what it should do. */
  .acts { display:flex; flex-direction:column; gap:9px; background:var(--surf-low);
    border:1px solid var(--line); border-radius:9px; padding:11px 13px; }
  .act { display:flex; gap:6px 14px; align-items:center; flex-wrap:wrap; }
  .acts-say { font-size:11.5px; color:var(--ink-v); }
  /* THE ONE SENTENCE THAT MUST NEVER BE BEHIND A DISCLOSURE. It was said three times, inside
     three paragraphs, in three different wordings; now it is said once, in full ink, above the
     controls it governs, always visible. It is what stops somebody believing Mark delayed sends
     the customer something. */
  .acts-warn { font-size:12px; color:var(--ink); font-weight:600; }
  .fu-note { flex:1 1 220px; min-height:38px; padding:8px 10px; border:1px solid var(--line);
    border-radius:7px; font:inherit; }
  .fu-note:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
  /* The follow-up panel is one long section of six groups, so its sub-headings buy the break
     the panel-level gap gives every other card: 11px on top of the 7px section gap. */
  .fu-lbl { margin-top:11px; }
  .fu-alert:empty { display:none; }
  .fu-alert { color:var(--red-dark); margin:0; }
  /* The log. Three columns so the WHAT lines up down the page — scanning "did anyone
     call?" should not mean reading every row. Fixed-width first column, date last. */
  .fu-log { border:1px solid var(--line); border-radius:8px; background:var(--surf-low);
    max-height:260px; overflow-y:auto; }
  .fu-log .note { margin:10px 12px; }
  .fu-row { display:grid; grid-template-columns:118px 1fr auto; gap:8px; align-items:baseline;
    padding:7px 11px; border-bottom:1px solid var(--line); font-size:12px; }
  .fu-log .fu-row:last-child { border-bottom:none; }
  .fu-row .fu-k { font-weight:700; color:var(--ink); }
  .fu-row .fu-d { color:var(--ink-v); word-break:break-word; }
  .fu-row .fu-t { color:var(--ink-v); font-size:11px; white-space:nowrap; }
  @media (max-width:560px) { .fu-row { grid-template-columns:1fr; gap:2px; } }
  /* Chat owns its own scroll so a long thread never pushes the composer away. */
  .dbody[data-sec="chat"] { display:flex; flex-direction:column; overflow:hidden; padding-bottom:0; }
  .dbody[data-sec="chat"] #dpanel-chat,
  .dbody[data-sec="chat"] #dsec-chat { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }
  /* gap:0 on the chat section only: the composer brings its own border-top and padding, and
     the section gap would open a stripe of white between the thread and that rule. */
  .dbody[data-sec="chat"] #dsec-chat { gap:0; }
  /* A flex column, so each row can choose its own side with align-self and the
     gap does the spacing. Auto-margins can't centre a system note. */
  .dbody[data-sec="chat"] #thread { flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px; }
  /* A SHORT THREAD SITS ON THE COMPOSER, not at the far end of a tall empty panel. #thread is a
     flex column with room to spare on a two-message conversation, so the messages painted at the
     top and 400px of white sat between them and the box you reply in. One `margin-top:auto` on the
     first child pushes the whole run down; a long thread has no spare room, so it does nothing
     there. Not `justify-content:flex-end`, which would fight the scroll position applySecPanel
     restores. */
  .dbody[data-sec="chat"] #thread > :first-child { margin-top:auto; }
  /* The composer spaces itself too, so the alert can be empty without leaving a gap above
     the box somebody is typing in. :empty hides it outright rather than reserving a line. */
  .dbody[data-sec="chat"] #chat-compose { flex:0 0 auto; padding:10px 0 16px; background:#fff;
    border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  /* #won-note joined these on 2026-08-27 with the Won control's move into the .acts group. It is
     empty except after a failed save, and inside a flex ROW an empty child still earns the row's
     gap: 14px of nothing between the button and the sentence beside it. Same treatment the four
     alerts either side of it already get. */
  #reply-alert:empty, #nt-alert:empty, #nt-count:empty, #won-note:empty { display:none; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--ink-v); }
  /* ── THREE HEADING RANKS ───────────────────────────────────────────────────
     The drawer had ONE, which is why nine headings flattened into one another. A section
     heading outranked the fact keys underneath it by colour alone: both are 700 uppercase,
     so at ink against ink-v "APPROVED" and "AMOUNT" still read as the same level and the
     card lost its top. Sentence case at 13px is what makes a heading a heading; the same
     words at 11px uppercase read as a field label.

     RANK 1 — .sec > .lbl, at (0,2,0). Names a CARD. It already beats bare .lbl (0,1,0) and
     the `>` keeps it off the tab strip's own .lbl, whose quieter colour is what the selected
     state then brightens. */
  .sec > .lbl { display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    font-size:13px; font-weight:700; text-transform:none; letter-spacing:-.005em; color:var(--ink); }
  /* The ANSWER LINE, on the heading's own baseline. Every count in this drawer used to be
     printed third, underneath a paragraph nobody read — "4 of 9 people", "8 sends", "opened
     6 times" was always the only part of it anybody wanted. tabular-nums so two drawers
     opened in turn line their figures up, nowrap so a count never breaks mid-phrase. */
  .sec > .lbl .sec-ans { font-size:11.5px; font-weight:600; letter-spacing:0; text-transform:none;
    color:var(--ink-v); font-variant-numeric:tabular-nums; white-space:nowrap; }
  /* RANK 2 — a heading INSIDE a card, so it takes .fact-k's spec rather than naming a card.
     WRITTEN AT (0,3,0) ON PURPOSE. Rank 1 above is (0,2,0) and would otherwise win whatever
     order these two are written in, and "make it smaller" has already been spent twice in this
     repo on a value that could never apply. The class carries the weight, not the line number.
     Both of these were direct children of .sec and therefore identical to their tab's own
     title: six of them on the Follow-up tab, and the Deposit tab's "What the customer
     submitted", which is what made that tab read as two cards of equal weight. */
  .sec > .lbl.fu-lbl, .sec > .lbl.dep-lbl { display:block; font-size:10px; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; color:var(--ink-v); }
  /* RANK 3 — the destructive rank. A red heading, a red left rule, and nothing else. The rule
     is .dep's own device (see below) rather than a new one, and it is a rule rather than a
     banner because a banner would shout louder than "Send deposit request" two tabs away. */
  .sec.sec-dang { border-left:3px solid var(--red-dark); padding-left:11px; }
  .sec.sec-dang > .lbl { color:var(--red-dark); justify-content:flex-start; align-items:center;
    gap:6px; }
  .sec.sec-dang > .lbl svg { flex:none; }
  /* ── the disclosure that replaces an explanatory paragraph ─────────────────
     Every one of these was a paragraph of 30-45 words above the control it described, which
     is read once and skipped forever after. The sentence is not deleted: it moves behind a
     summary that says what is in it, so the person who needs it can still get it. Shared by
     the Proposal tab's two cards, the Follow-up tab's three groups and the chat thread's fold,
     which is why it is declared once here rather than three times scoped. */
  .why { margin:0; }
  .why > summary { list-style:none; cursor:pointer; display:inline-flex; align-items:center;
    gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-v); padding:2px 0; }
  .why > summary::-webkit-details-marker { display:none; }
  .why > summary:hover { color:var(--ink); }
  .why > summary:focus-visible { outline:2px solid var(--red); outline-offset:1px; border-radius:4px; }
  .why > summary svg { flex:none; transition:transform .15s; }
  .why[open] > summary svg { transform:rotate(90deg); }
  .why .note { margin:5px 0 0; max-width:62ch; }
  @media (prefers-reduced-motion:reduce) { .why > summary svg { transition:none; } }
  /* No bottom margin any more: a section is its own flex column, so the gap holds the label
     off its content and a section can be hidden without leaving the space behind. */
  .sec { display:flex; flex-direction:column; gap:7px; margin:0; }
  /* direction stated, because renderNotSent uses `class="sec row3"` on its button row and
     .sec's `column` would otherwise stack the two buttons on top of each other. */
  .row3 { display:flex; flex-direction:row; gap:8px; flex-wrap:wrap; }
  /* Assigning an estimator on a project nobody has sent. The name in the facts grid above is a
     GUESS (the draft's author, drawn with a "?") until somebody picks, so the control sits under
     the facts as the way to settle it rather than replacing a fact with a form. `margin-top` is
     not needed now that .sec is a flex column with its own gap. */
  .ns-assign { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ns-assign select { flex:1 1 190px; min-width:0; min-height:38px; padding:7px 9px;
    border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); font:inherit; }
  .ns-assign .btn { min-height:38px; }
  .ns-assign-note:empty { display:none; }
  .ns-assign-note { margin:0; color:var(--red-dark); font-weight:600; }
  .btn { min-height:42px; padding:0 16px; border-radius:7px; border:1px solid transparent; font:inherit; font-weight:700;
    cursor:pointer; }
  .btn-p { background:var(--red-dark); color:#fff; } .btn-p:hover { background:var(--red); }
  .btn-s { background:#fff; color:var(--ink); border-color:var(--line); } .btn-s:hover { background:var(--surf-low); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  /* Delete project (2026-08-24). Outlined in the brand red rather than filled with it: a filled
     button would shout louder than "Send deposit request" two tabs away, and this control is one
     an estimator should have to aim at. The fill only arrives on hover, which is the last moment
     before the confirmation dialog. */
  .btn-dang { color:var(--red-dark); border-color:var(--red-dark); background:#fff; }
  .btn-dang:hover { background:var(--red-dark); color:#fff; }
  .del-note:empty { display:none; }
  .del-note { margin:0; color:var(--red-dark); font-weight:600; }
  /* .btn-sm and .btn.is-link were removed on 2026-08-26 with the only two controls that used
     them: the customer card's "Copy the link" button and the "Open the customer's view" anchor.
     Left behind they would read as a small-button size and an anchor-as-button variant this
     page supports, and the next person would style a third control against a dead rule. Same
     reasoning as a.link, which went the same way when the printed URL did. */
  .btn:focus-visible, .nt-chip:focus-visible, .dep-show:focus-visible, .dclose:focus-visible {
    outline:2px solid var(--red); outline-offset:1px; }
  /* ── labelled facts ───────────────────────────────────────────────────────
     The drawer's unit of information. It replaced two run-on sentences — the approval
     ("NAME on 2026-08-10 — Polish, Epoxy at $22,763.00") and the deposit auto-calc line —
     which buried the two things anybody scans for, the money and the date, mid-sentence
     inside a name in capitals.
     auto-fit rather than a column count: the approval card has four cells and the deposit
     card three, and a media query per card is how those two drift apart. */
  .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:11px 16px; }
  .fact { display:flex; flex-direction:column; gap:2px; min-width:0; }
  /* A cell whose value is a name rather than a number. In a 148px column "HANZ URIEL A DE LA
     CRUZ, Owner" wraps three times and drags the whole row down with it; on its own line it is
     one line. Only for the cells that hold prose, so the figures stay side by side. */
  .fact-wide { grid-column:1 / -1; }
  .fact-k { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-v); }
  .fact-v { font-size:13px; color:var(--ink); overflow-wrap:anywhere; }
  .fact-s { display:block; font-size:11.5px; color:var(--ink-v); overflow-wrap:anywhere; }
  /* Money is money: tabular figures so a column of them lines up, and the approved total
     gets the size because it is the number the whole drawer is about. */
  .amt { font-variant-numeric:tabular-nums; }
  .amt-lg { font-size:20px; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
  /* .idn, .idn-n and .idn-e were removed on 2026-08-27 with the only element they styled: the
     Customer card's big repeated name. The head carries that name 40px above every tab (see
     .dh-who), so a card whose whole content restates the head is a card with no job — and one
     test pins the head's copy of it, for a good reason. What the card answers now is "have they
     even opened it", off viewed_at / last_viewed_at, in the same .facts cells every other card
     uses. Left behind, these three rules would read as an identity block this page supports and
     the next person would style a fourth one against them. Same reasoning as a.link, .btn-sm and
     .btn.is-link, which all went the same way as the controls they were written for. */
  /* Project contacts: the ROLE leads, because "who do I call about access" is the question
     this card gets opened for. A row each, so two contacts cannot run together. */
  .ct-list { display:flex; flex-direction:column; gap:6px; }
  .ct { display:grid; grid-template-columns:94px 1fr; gap:1px 10px; align-items:baseline;
    padding:7px 10px; border:1px solid var(--line); border-radius:9px; background:#fff; }
  .ct-role { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-v); }
  .ct-n { font-size:13px; font-weight:600; overflow-wrap:anywhere; }
  .ct-m { grid-column:2; font-size:12px; color:var(--ink-v); overflow-wrap:anywhere; }
  @media (max-width:560px) { .ct { grid-template-columns:1fr; } .ct-m { grid-column:1; } }
  /* Deposit submissions — what the CUSTOMER sent, rendered directly above the
     deposit buttons so staff read it before they act. The account number ships
     masked; .dep-show swaps in the full value on click (wired in portal.js). */
  /* margins off, gaps on: these all sit in .sec, a flex column. See .dpanel above. */
  .dep { border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:8px;
    background:var(--surf-low); padding:9px 11px; margin:0; }
  .dep-lbl { margin-top:7px; }
  .dep-none { margin:0; }
  .dep-h { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    flex-wrap:wrap; margin-bottom:6px; }
  .dep-m { font-size:12.5px; font-weight:800; }
  .dep-t { font-size:11px; color:var(--ink-v); }
  .dep-f { display:flex; align-items:baseline; gap:6px; font-size:12px; margin-top:3px; }
  .dep-k { flex:0 0 92px; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; color:var(--ink-v); }
  .dep-v { color:var(--ink); word-break:break-word; }
  .dep-num { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.03em; }
  .dep-show { border:1px solid var(--line); background:#fff; color:var(--ink-v); border-radius:999px;
    padding:1px 8px; font-size:10px; font-weight:700; line-height:1.7; text-transform:uppercase;
    letter-spacing:.04em; cursor:pointer; }
  .dep-show:hover { background:var(--surf-high); color:var(--ink); }
  .dep-s { font-size:11px; color:var(--ink-v); margin-top:6px; }
  .msg { padding:9px 12px; border-radius:12px; max-width:85%; width:fit-content; }
  /* Who said it should be obvious without reading the label, so the two sides sit
     well apart and each bubble squares off the corner on its own side. Ours is a
     SOLID red rather than a pink tint: two near-white backgrounds three percent
     apart in lightness read as one colour, and any renderer that adjusts contrast
     collapses them completely. Mirrors the customer portal's own bubbles. */
  .msg.customer { align-self:flex-start; background:var(--surf-high); border-bottom-left-radius:3px; }
  .msg.staff { align-self:flex-end; background:var(--red-dark); color:#fff; border-bottom-right-radius:3px; }
  .msg.staff .when { text-align:right; color:rgba(255,255,255,.8); }
  .msg.staff .via-email { border-color:rgba(255,255,255,.6); }
  /* An emailed reply arrives with its own line breaks. Without pre-wrap they collapsed into
     one run, which is most of why a signature read as a wall of text. anywhere, not
     break-word, so a long tracking URL cannot push the bubble past its max-width. */
  .msg .mbody { white-space:pre-wrap; overflow-wrap:anywhere; }
  /* ── attachments ────────────────────────────────────────────────────────────
     A picture is SHOWN, not listed: the commonest attachment on a bid is a photo of a slab, and
     a column of filename chips makes the estimator open every one to find it.
     But the NAME HAS TO BE READABLE WITHOUT HOVERING. Hanz, 2026-08-26: "I cant see the name of
     the file well." He reads this thread out in the sales meeting; a tooltip is no use to
     somebody who is not holding a mouse over each tile in turn. So every attachment carries a
     visible caption now, photo or not, and both kinds use the same .att-name/.att-size pair so
     a JPEG and a .docx in one bubble read as two of the same thing. */
  .att-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }

  /* THE TILE: ONE SURFACE, with a fixed-height well for the picture and the caption on the rest
     of it. Every dimension is known at FIRST PAINT, before any bytes arrive — which is the whole
     point. The thread auto-scrolls to the newest message, so a photo landing late into a box that
     grows yanks the view out from under whoever is reading. Same 176x132 well as the customer
     portal, because this is one conversation seen from two ends and the two have drifted before.
     `color:inherit` and `text-decoration:none` are LOAD-BEARING, not tidiness: the old tile's
     only content was a src-less <img>'s alt text, and a browser draws alt text in the UA link
     colour with the UA underline — blue and underlined, on a dark red bubble. That was half of
     what made the screenshot unreadable.
     The surface itself is set PER BUBBLE further down, for the reason the chip discovered first:
     a neutral wash vanishes on our red. Measured in a browser, rgba(0,0,0,.06) over #9e001f is
     1.08:1 against the bubble — the same colour, to the eye — so the caption floated with nothing
     holding it to its picture while the identical rule read correctly on the grey. */
  .att-img { display:block; width:176px; border-radius:8px; overflow:hidden;
    color:inherit; text-decoration:none; }
  .att-well { display:block; position:relative; height:132px; line-height:0; }
  .att-well img { width:100%; height:100%; object-fit:cover; display:block; }

  /* THE CAPTION, UNDER the picture rather than over it. An overlay's legibility is a property of
     the photograph underneath it, and the commonest attachment here is a near-white concrete
     slab; guaranteeing 4.5:1 over arbitrary pixels needs a scrim thick enough to hide a fifth of
     the thumbnail we are showing. Under the picture it sits on the tile's own surface, which is a
     colour WE chose, so the contrast is a measurement instead of a hope.
     No background of its own: the tile is one surface and the caption is the part of it the photo
     does not cover. One value to get right per bubble instead of two. */
  .att-cap { display:block; padding:5px 8px 6px; font-size:12px; line-height:1.25; }
  .att-cap .att-name { display:block; font-weight:600; }
  /* min-height so the second line's box exists even when the size is unknown — otherwise tiles
     in the same row end up different heights. */
  .att-cap .att-size { display:block; flex:none; font-size:11px; min-height:14px; }

  /* Loading. Quiet on purpose: it is the common case and it resolves in a moment. One
     `:not(.is-loading)` rule retires the spinner for BOTH of the states that follow it.
     The moving arc is `currentColor` — white on our bubble, near-black on theirs — over a neutral
     grey ring that reads on either. The first version used a fixed dark red on a near-black ring,
     which on the red bubble was a dark red arc on a dark red tile. */
  .att-img.is-loading { cursor:default; }
  .att-spin { position:absolute; inset:0; margin:auto; width:18px; height:18px; border-radius:50%;
    border:2px solid rgba(128,128,128,.38); border-top-color:currentColor;
    animation:att-spin .7s linear infinite; }
  .att-img:not(.is-loading) .att-spin { display:none; }
  @keyframes att-spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .att-spin { animation:none; } }

  /* Failed. THE TILE KEEPS ITS SHAPE: turning a 176x132 tile into a small chip shrinks the
     bubble, which is a reflow on the error path — the one path nobody is watching. The well
     shows an image-off glyph and the caption's second line says what happened.
     A CLASS toggles it, never the `hidden` attribute: a class `display` rule beats `hidden`, and
     this repo has shipped that bug four times. `display:none` rather than `opacity:0` for the
     same family of reason — an invisible element still takes the click. */
  .att-broke { display:none; position:absolute; inset:0; margin:auto; opacity:.55; }
  .att-img.is-failed .att-broke { display:block; }
  .att-img.is-failed, .att-file.is-failed { cursor:default; }

  /* The chip, for anything without a useful preview. Its surface is set with the tile's, below —
     ONE place owns "what colour is an attachment on this bubble". */
  .att-file { display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border-radius:8px;
    text-decoration:none; color:inherit; font-size:12px; max-width:240px; }
  /* TRUNCATE, never wrap. Three lines of filename inside a chat bubble is worse than an
     ellipsis, and the untruncated name is on the anchor's title either way. */
  .att-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .att-size { opacity:.65; flex:none; }

  /* ── legible on BOTH bubbles ────────────────────────────────────────────────
     MEASURED, not eyeballed. `opacity` was the actual defect: .att-size at opacity .65 inside a
     staff bubble is white at 65% over the red, which measures 3.4:1 — under the 4.5:1 floor for
     12px text. And the old failure note was #9e001f on that same red: 1.4:1, i.e. invisible.
     So the secondary line takes a real colour per context. Contrast against the surface each one
     actually lands on (the per-bubble surfaces below, not the bubble itself):
                     staff (red) bubble          customer (grey) bubble
       name          #fff            6.6:1       --ink     12.2:1
       size          rgba(#fff,.86)  5.3:1       --ink-v    6.7:1
       did not load  --red-light     5.1:1       --red-dark 6.1:1
     opacity:1 alongside every colour, because the bare .att-size rule above still applies here
     and opacity MULTIPLIES — it would take 6.7:1 back down to 4.4:1 on its own. */
  .att-cap .att-size, .att-file .att-size { opacity:1; color:var(--ink-v); }
  .att-cap .att-name, .att-file .att-name { color:inherit; }
  .att-img.is-failed .att-size, .att-file.is-failed .att-size { color:var(--red-dark); }
  .msg.staff .att-cap .att-size, .msg.staff .att-file .att-size { color:rgba(255,255,255,.86); }
  /* Four classes, so this outranks the two three-class rules above it whichever order they end
     up in. Specificity beats source order, and relying on the latter is how "make it smaller"
     twice changed a value that could never apply. */
  .msg.staff .att-img.is-failed .att-size,
  .msg.staff .att-file.is-failed .att-size { color:var(--red-light); }

  /* ── the surface, per bubble ─────────────────────────────────────────────────
     A NEUTRAL WASH DISAPPEARS ON OUR RED, so it is recessed on theirs and lifted on ours. The
     chip has always done this; the tile now does it too, because it turned out to need it for
     exactly the same reason. Visibility of the surface against the bubble it sits on, and the
     text on top of it:
                  surface           vs bubble   name   size(.86)   did-not-load
       theirs     rgba(0,0,0,.06)     1.14:1    12.2      6.7          6.1
       ours       rgba(255,255,255,.16) 1.29:1   6.6      5.3          5.1  */
  .att-img, .att-file { background:rgba(0,0,0,.06); }
  .att-img:hover, .att-file:hover { background:rgba(0,0,0,.11); }
  .msg.staff .att-img, .msg.staff .att-file { background:rgba(255,255,255,.16); }
  .msg.staff .att-img:hover, .msg.staff .att-file:hover { background:rgba(255,255,255,.28); }
  /* The queue above the composer, before anything is sent. */
  .att-strip { display:flex; flex-wrap:wrap; gap:6px; }
  .att-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 4px;
    border-radius:8px; background:rgba(0,0,0,.06); font-size:12px; max-width:220px; }
  .att-chip img { width:26px; height:26px; object-fit:cover; border-radius:5px; display:block; }
  .att-chip.is-uploading { opacity:.7; }
  /* A failed upload keeps its chip and says why, ON the file it happened to. */
  .att-chip.is-error { background:rgba(200,16,46,.12); }
  .att-chip.is-error .att-size { color:#9e001f; opacity:1; }
  .att-x { border:0; background:none; cursor:pointer; font-size:15px; line-height:1; padding:0 2px;
    opacity:.55; color:inherit; }
  .att-x:hover { opacity:1; }
  .icon-btn { display:inline-flex; align-items:center; gap:6px; }
  #chat-compose.drop-on { outline:2px dashed rgba(200,16,46,.5); outline-offset:3px; border-radius:8px; }
  /* WHICH contact wrote it, on a proposal with more than one. The blanket author label was
     removed on 2026-08-11 ("just the reply contents and the date") because with a single contact
     it restated what the side and colour already said. On a multi-recipient proposal it says
     something nothing else can, so it comes back conditionally — customer bubbles only. */
  /* Recipients card: one chip per contact with what they have done. Its own classes, NOT
     nt-chip — green there means "receives this project's emails", which would be a false
     statement about a contact. */
  /* The board card line. Dimmer than the estimator line above it: it is a supporting fact,
     not the thing the card is about. */
  .deal .meta.rc-line { color:var(--ink-v); font-weight:600; font-size:11.5px; }
  /* "Automated follow-ups go to" — one tickable contact per row inside the Follow-up tab.
     Always visible, because the question it answers is "is this person being chased". */
  .fu-clist { display:flex; flex-direction:column; gap:5px; margin:0; }
  .fu-c { display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; }
  .fu-c input { margin:0; }
  .tw-input { flex:1; min-width:0; border:1px solid var(--line); border-radius:7px;
    padding:9px 11px; font:inherit; font-size:13px; background:#fff; }
  .tw-input:focus { outline:none; border-color:var(--red-dark); }
  .rc-list { display:flex; flex-direction:column; gap:6px; }
  .rc-chip { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:6px 8px;
    border:1px solid var(--line); border-radius:9px; background:#fff; }
  .rc-chip .rc-n { font-weight:600; margin-right:2px; }
  /* var(--line), not var(--surf-dim) — that token is defined nowhere on this page, so the
     border shorthand was invalid at computed-value time and every badge fell back to a
     currentColor edge. It looked deliberate because .rc-b also sets color: it was not. */
  .rc-b { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    border:1px solid var(--line); border-radius:999px; padding:1px 7px; color:var(--ink-v); }
  .rc-b.on { border-color:#0f7b3f; color:#0f7b3f; }
  .msg .who { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-v); margin-bottom:2px; }
  .msg .via-email { border:1px solid var(--ink-v); border-radius:999px; padding:0 5px; margin-left:4px; font-size:9px; }
  .msg .when { font-size:10px; color:var(--ink-v); margin-top:3px; }
  textarea { width:100%; min-height:74px; padding:10px; border:1px solid var(--line); border-radius:7px; font:inherit; resize:vertical; }
  /* `a.link` lived here for exactly one element: the customer's portal URL, printed in full
     under their email address. `word-break:break-all` is the tell — nothing but a 60-character
     token needs to be broken mid-word. Hanz, 2026-08-13: "remove the URL for active projects."
     The link is now two controls in the Customer card, so the rule has nothing left to style. */
  .note { color:var(--ink-v); font-size:12px; }
  /* ── THE THIRD REGISTER: EVERYTHING THE SYSTEM SAYS ────────────────────────
     Speech is a bubble. The one LIVE document is a card. Everything else in this thread is a
     line: opened, approved, contacts received, the day markers, and the fold that stands in for
     the replaced revisions. All of it centred, all of it .note.sys, which the drawer already had
     for two of those cases. So nothing the system says is a block any more, and the conversation
     is the only thing in the thread with weight.
     margin:0 so the thread's gap is the only spacing — a <p>'s default 1em
     would otherwise stack on top of it and float the note away from its event. */
  .note.sys { align-self:center; margin:0; text-align:center; background:var(--surf-low);
    border-radius:6px; padding:5px 10px; max-width:88%; }
  /* The day marker. Same shape, no fill: it divides the thread rather than reporting an event,
     and a filled pill every second message would read as more events. */
  .note.sys.is-day { font-weight:700; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; background:none; padding:9px 0 3px; }
  /* The replaced documents, expanded. Left-aligned inside a centred line, because a column of
     dates centred under its own summary is unreadable. No box: .note.sys is the box. */
  .sup-list { text-align:left; display:flex; flex-direction:column; gap:3px; padding:4px 0 2px; }
  /* Chat cards — same shape/classes the CUSTOMER portal uses, so staff read the
     thread exactly as the customer sees it. The accent bar colour keys the type.
     An event is not speech, but it still belongs to whoever caused it, so it takes
     that party's side and squares off the corner there exactly like a bubble. The
     bar swaps to the right edge on our side so it always hugs the gutter the card
     is anchored to. Type is a custom property, not a border override, so the two
     rule groups can't fight over which one paints the bar. */
  .chat-card { --cc-accent:var(--red); align-self:flex-start; max-width:88%; width:fit-content;
    background:var(--surf-low); border:1px solid var(--line); border-left:3px solid var(--cc-accent);
    border-radius:10px; padding:11px 13px; }
  .chat-card.deposit { --cc-accent:var(--ok); }
  .chat-card.system  { --cc-accent:var(--ink-v); }
  .chat-card.is-superseded { opacity:.6; --cc-accent:var(--line); }
  .chat-card.customer { border-bottom-left-radius:3px; }
  .chat-card.staff { align-self:flex-end; border-bottom-right-radius:3px;
    border-left-width:1px; border-left-color:var(--line);
    border-right:3px solid var(--cc-accent); }
  .chat-card .cc-title { font-weight:800; font-size:13px; margin-bottom:3px; }
  .chat-card .cc-meta { color:var(--ink-v); font-size:11px; margin-bottom:5px; }
  .chat-card .cc-body { color:var(--ink-v); font-size:12px; }
  .chat-card .cc-amt { color:var(--ok); }
  .chat-card .cc-tag { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    border:1px solid currentColor; border-radius:999px; padding:1px 6px; margin-left:5px; color:var(--ink-v); }
  /* Review-the-invoice dialog. Sits above the drawer (10001) — a blocking review
     must never render behind the thing that opened it. */
  .inv-ov { position:fixed; inset:0; z-index:10100; background:rgba(20,18,18,.55);
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .inv-dlg { background:#fff; border-radius:14px; padding:22px 22px 18px; width:min(620px,96vw);
    max-height:92vh; overflow:auto; box-shadow:0 24px 60px rgba(0,0,0,.3); }
  .inv-h { font-size:17px; font-weight:800; }
  .inv-sub { color:var(--ink-v); font-size:12.5px; margin:4px 0 16px; }
  .inv-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .inv-f { display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; color:var(--ink-v); }
  .inv-f input { font:400 14px system-ui; text-transform:none; letter-spacing:0; color:var(--ink);
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; }
  .inv-f input:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 1px var(--red); }
  .inv-act { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  @media (max-width:560px) { .inv-grid { grid-template-columns:1fr; } }
  /* The close-out dialog. Shares .inv-* with the invoice review above: same overlay, same card,
     same z-index above the drawer that opened it. These four rules are the parts an invoice form
     never needed — a select, a textarea, and the required-field line under them. */
  .co-f { text-transform:none; letter-spacing:0; font-size:12.5px; margin-top:12px; }
  .co-f select, .co-f textarea { font:400 14px system-ui; color:var(--ink);
    padding:8px 10px; border:1px solid var(--line); border-radius:7px; width:100%;
    background:#fff; }
  .co-f textarea { resize:vertical; min-height:66px; }
  .co-f select:focus, .co-f textarea:focus { outline:none; border-color:var(--red);
    box-shadow:0 0 0 1px var(--red); }
  /* The one required field in this tool, so the line under it has to read as an instruction
     rather than as help text nobody looks at. Empty most of the time; it has no height then. */
  .co-err { color:var(--red); font-weight:600; margin:8px 0 0; min-height:0; }
  /* A card button mid-save. The board repaints every 25s and these two buttons are the only
     controls on it that outlive a click, so they need a disabled look of their own. */
  .deal-act:disabled { opacity:.55; cursor:default; }
  /* What somebody wrote when they closed a bid out, quoted back in the drawer. Set off by a rule
     rather than a box: it is one sentence in a panel that is already all small grey text, and it
     is the only part of that panel a person wrote by hand. */
  .ns-why { border-left:2px solid var(--line); padding-left:9px; font-style:italic;
    color:var(--ink); }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Renamed with the sidebar label (Hanz, 2026-08-10: Customer Portal CRM TO "Active
         Projects"). The URL stays /portal.html: the follow-ups board, the notification bell and
         projects.js all deep-link into it. -->
    <h1>Active Projects</h1>
    <p class="sub">Proposals sent to customers — track approvals, answer questions, and advance deposit &amp; schedule status.</p>
    <!-- Which board, not how it's filtered: the same Active / Test split as the Proposals
         Database, off the same is_test flag. The two outcomes, Won and Lost, sit on this row too
         because they are the things that are no longer on the live board. -->
    <div id="crm-tabs" class="tw-tabs">
      <button type="button" class="tw-tab on" data-tab="active" aria-pressed="true">Active <span class="n">0</span></button>
      <!-- Hanz, 2026-08-20: "I marked Trabon Group project as Won but it's still in the Created but
           Not Sent bucket" — and the decision that a Won tab takes every won job, off the Active
           board the way Lost comes off it. Its columns are what is still outstanding on the job
           (C.WON_COLS in crm-core.js), which is what makes moving the card safe: the deposit and
           contacts chasing is visible on the tab that owns it. Placed between Active and Lost: the
           two outcomes read together beside the live board, and the scratch tab keeps the far end,
           which is the order he asked for when Lost moved next to Active on 2026-08-15. -->
      <button type="button" class="tw-tab" data-tab="won" aria-pressed="false">Won <span class="n">0</span></button>
      <!-- Hanz, 2026-08-12: "Actualy create another tab for 'Lost' This is where the lost projects
           will be held". This REPLACED a "0 closed lost →" link that pointed at the Proposals
           Database, which could not filter to the dead ones — /projects.html lists our drafts and
           has no notion of closed_lost, so the link landed you on an unfiltered list.
           Beside Active since 2026-08-15, at his ask: Active and Lost are both real work, so they
           read together and the scratch tab sits at the far end. -->
      <button type="button" class="tw-tab" data-tab="lost" aria-pressed="false">Lost <span class="n">0</span></button>
      <button type="button" class="tw-tab" data-tab="test" aria-pressed="false">Test <span class="n">0</span></button>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search project, customer, estimator…" />
      <select id="crm-est" class="tw-select" aria-label="Filter by estimator">
        <option value="">Any estimator</option>
      </select>
      <select id="crm-month" class="tw-select" aria-label="Filter by activity week or month">
        <option value="">Any period</option>
      </select>
      <select id="crm-sort" class="tw-select" aria-label="Sort cards by">
        <option value="stage">Time in stage</option>
        <option value="activity">Last activity</option>
        <option value="estimator">Estimator</option>
        <option value="total">Total</option>
      </select>
      <button type="button" id="crm-dir" class="tw-select tw-dir" aria-label="Toggle sort direction">↓ Desc</button>
      <button type="button" id="crm-view" class="tw-clear tw-view" aria-label="Switch between the board and a table">☰ Table</button>
      <button type="button" id="crm-clear" class="tw-clear" hidden>✕ Clear</button>
      <span id="count" class="count"></span>
      <a href="/notifications.html" class="btn btn-s" style="min-height:40px;display:inline-flex;align-items:center;text-decoration:none">Notification Sending →</a>
    </div>
    <div id="board" class="board"><div class="empty">Loading…</div></div>
  </div>

  <div id="scrim"></div>
  <aside id="drawer"></aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="/auth.js"></script>
  <script src="/shared.js"></script>
  <!-- Board logic (stages, dates, ordering) — must load BEFORE portal.js, which
       reads window.TWCrm at module scope. -->
  <script src="/js/crm-core.js"></script>
  <script src="/js/portal.js"></script>
</body>
</html>
