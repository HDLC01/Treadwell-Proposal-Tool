# Suite-wide pytest config. Before this file existed there was no pytest configuration at all in
# the repo — no addopts, no testpaths, and crucially no --durations, which is why a suite that had
# grown to 2,800 tests and ~15 minutes had never once been measured.
#
# --durations=25 is the whole point: every run now names its own slowest tests, so the next person
# to ask "why is this slow" gets an answer from the last run instead of a profiling session.
#
# Parallelism is deliberately NOT in addopts. `-n auto` costs a few seconds of worker startup,
# which is a real tax on the single-file runs you do while writing a test. Full runs ask for it
# explicitly (CI does, in .github/workflows/ci.yml):
#
#     python -m pytest tests/ -q -n auto --dist loadfile
#
# `--dist loadfile` is not optional. The default `--dist load` hands individual tests to whichever
# worker is free, which re-runs every module-scoped fixture once per worker per file — this suite
# has ~35 node-harness fixtures built to run once — and it breaks the intra-file ordering that
# tests/test_leads.py documents. loadfile keeps a file on one worker.
[pytest]
testpaths = tests
addopts = --durations=25
