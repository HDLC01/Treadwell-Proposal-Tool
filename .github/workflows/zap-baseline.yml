name: ZAP baseline

# A report-only OWASP ZAP baseline scan of the two apps this pipeline ships, on staging AND on
# production. Hanz, 2026-09-29, after asking for it: "owasp should scan production as well".
# ZAP was last run by hand in June 2026 (its findings became e65d38b, SRI on the CDN scripts, and
# 5b9b71f, no inline scripts); nothing had run it since.
#
# EXACTLY FOUR TARGETS, and nothing else is ever scanned:
#   staging     https://staging.proposals.wetreadwell.com  https://staging.portal.wetreadwell.com
#   production  https://proposals.wetreadwell.com          https://portal.wetreadwell.com
# Never the bare wetreadwell.com or www: that is the marketing WordPress site on other hosting,
# not ours to scan.
#
# WHEN IT RUNS
#   - every Sunday before dawn in Central time, all four;
#   - after every SUCCESSFUL Deploy: a staging deploy scans staging, a main deploy scans
#     production. A failed, cancelled or rejected deploy scans nothing;
#   - by hand from the Actions tab, choosing staging, production or both.
# `schedule` and `workflow_run` only ever fire from the copy of this file on the DEFAULT branch
# (main). Until this file is promoted to main, only the manual button works, and only from a
# branch that has the file.
#
# PASSIVE AND GENTLE, because production has real customers on it. .zap/baseline.yaml is the whole
# scan: a one-minute spider with two threads that never fills in or submits a form, ZAP's passive
# rules (it reads responses, it attacks nothing), no Ajax or browser spider, no active scan, and
# two portal paths that are never requested at all. Why that file is not zap-baseline.py's -z
# options: those were measured and do not work (see its header). Staging finishes before
# production starts and each job scans its two apps one at a time, so the VPS sees one scan at once.
#
# REPORT ONLY. Findings never fail this workflow; a scan that could not run does.
#
# THIS REPOSITORY IS PUBLIC. The run log and step summary are readable by anyone, so the summary
# carries only counts per risk level and alert names (.zap/summarize.py), and ZAP's own output
# goes to a file. The full HTML + JSON report, with every URL and piece of evidence, is uploaded
# as an artifact kept for 7 days, and artifacts on a public repository can be downloaded by any
# signed-in GitHub user. That is the trade for having the detail at all: download what you need,
# and treat the report as public for those 7 days.
#
# No step holds a write token: the only permission is `contents: read`, used by the checkout.

on:
  schedule:
    # Sundays 08:41 UTC = 03:41 CDT (summer) / 02:41 CST (winter). Off the hour on purpose.
    - cron: "41 8 * * 0"
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to scan
        type: choice
        options: [staging, production, both]
        default: staging
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [staging, main]

permissions:
  contents: read

env:
  # stable = ZAP 2.17.0, resolved 2026-09-29. Bump the digest and this comment together.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef # stable (2.17.0)

jobs:
  staging:
    name: staging / ${{ matrix.name }}
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.environment != 'production')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'staging'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: staging-proposals
            target: https://staging.proposals.wetreadwell.com
          - name: staging-portal
            target: https://staging.portal.wetreadwell.com
    concurrency:
      # never two scans of the same app at once; a running one always finishes
      group: zap-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      # The default branch's own plan and rules, never the deploy's head commit: a workflow_run
      # job must not check out the code that triggered it.
      - name: Check out the scan plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .zap

      - name: Scan (passive; 1-minute spider, 2 threads, no forms)
        id: scan
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          wrk="$RUNNER_TEMP/zap"
          mkdir -p "$wrk"
          cp .zap/baseline.yaml "$wrk/baseline.yaml"
          chmod 0777 "$wrk"            # the image runs as uid 1000 (zap), the runner as 1001
          docker pull --quiet "$ZAP_IMAGE" > /dev/null
          # All of ZAP's output goes to zap.log (artifact only), never to this public log. The
          # add-on update is what zap-baseline.py does first: it brings in the beta passive rules
          # (Subresource Integrity, 90003, is one), so the rules are newer than the pinned engine.
          rc=0
          timeout --kill-after=30s 15m \
            docker run --rm -e ZAP_TARGET="$TARGET" -v "$wrk:/zap/wrk:rw" "$ZAP_IMAGE" \
            sh -c 'zap.sh -cmd -addonupdate -addoninstall pscanrulesBeta || echo "add-on update failed; scanning with the bundled rules"; exec zap.sh -cmd -autorun /zap/wrk/baseline.yaml' \
            > "$wrk/zap.log" 2>&1 || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "ZAP finished with exit code $rc."

      - name: Summary (counts and alert names only)
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          ZAP_EXIT: ${{ steps.scan.outputs.exit_code || 'none' }}
        run: python3 .zap/summarize.py "$RUNNER_TEMP/zap/report.json" .zap/rules.tsv "$TARGET" "$ZAP_EXIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full report for 7 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/zap/report.html
            ${{ runner.temp }}/zap/report.json
            ${{ runner.temp }}/zap/zap.log
          retention-days: 7
          if-no-files-found: warn

  production:
    name: production / ${{ matrix.name }}
    # after staging, so the VPS never serves two scans at once. `!cancelled()` because a skipped
    # or failed staging job must not stop a production scan that was asked for.
    needs: staging
    if: >-
      !cancelled() && (
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.environment != 'staging')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: production-proposals
            target: https://proposals.wetreadwell.com
          - name: production-portal
            target: https://portal.wetreadwell.com
    concurrency:
      group: zap-${{ matrix.name }}
      cancel-in-progress: false
    # KEEP THESE STEPS IDENTICAL TO THE STAGING JOB'S. backend/tests/test_zap_baseline.py fails if
    # they drift, so a safety change can never reach one environment and not the other.
    steps:
      # The default branch's own plan and rules, never the deploy's head commit: a workflow_run
      # job must not check out the code that triggered it.
      - name: Check out the scan plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .zap

      - name: Scan (passive; 1-minute spider, 2 threads, no forms)
        id: scan
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          wrk="$RUNNER_TEMP/zap"
          mkdir -p "$wrk"
          cp .zap/baseline.yaml "$wrk/baseline.yaml"
          chmod 0777 "$wrk"            # the image runs as uid 1000 (zap), the runner as 1001
          docker pull --quiet "$ZAP_IMAGE" > /dev/null
          # All of ZAP's output goes to zap.log (artifact only), never to this public log. The
          # add-on update is what zap-baseline.py does first: it brings in the beta passive rules
          # (Subresource Integrity, 90003, is one), so the rules are newer than the pinned engine.
          rc=0
          timeout --kill-after=30s 15m \
            docker run --rm -e ZAP_TARGET="$TARGET" -v "$wrk:/zap/wrk:rw" "$ZAP_IMAGE" \
            sh -c 'zap.sh -cmd -addonupdate -addoninstall pscanrulesBeta || echo "add-on update failed; scanning with the bundled rules"; exec zap.sh -cmd -autorun /zap/wrk/baseline.yaml' \
            > "$wrk/zap.log" 2>&1 || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "ZAP finished with exit code $rc."

      - name: Summary (counts and alert names only)
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          ZAP_EXIT: ${{ steps.scan.outputs.exit_code || 'none' }}
        run: python3 .zap/summarize.py "$RUNNER_TEMP/zap/report.json" .zap/rules.tsv "$TARGET" "$ZAP_EXIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full report for 7 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/zap/report.html
            ${{ runner.temp }}/zap/report.json
            ${{ runner.temp }}/zap/zap.log
          retention-days: 7
          if-no-files-found: warn
