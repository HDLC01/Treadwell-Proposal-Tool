name: CI

# Tests + dependency audit. Runs on every PR plus pushes to main/staging. Since
# both are PR-protected, every change is covered by the PR run before it can
# merge — so we don't ALSO run on arbitrary branch pushes (avoids double runs on
# PR branches). The suite is hermetic (auth + Supabase stubbed, LibreOffice
# mocked) — no secrets needed.
#
# ONE EXCEPTION TO "hermetic", added 2026-08-21: the job also checks out the
# CUSTOMER PORTAL. backend/tests/test_close_reason_vocabulary.py compares the
# close-out vocabulary across the two repositories, and until now it could not:
# with a single checkout its four cross-repo tests hit their skipif on every run,
# so a tool-only merge went green while the comparison that would have blocked it
# never executed. It only ever protected the dev box, where both clones sit side
# by side. Still no secret involved — see the checkout step.
on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── has this exact tree already passed? ──────────────────────────────────────
  #
  # A prod promotion is a cherry-pick of commits that are already on staging, so its TREE is
  # byte-identical to one CI has just run green — different commit sha, same bytes. Running the
  # suite again feeds identical inputs to an identical suite and can only produce the identical
  # answer, and it cost Hanz ~10 minutes on a labels-only change that went through the suite four
  # times end to end.
  #
  # THE CLAIM IS TREE IDENTITY, NOT CONFIDENCE. This does not skip tests because a change looks
  # small, because it is "frontend only", or because somebody checked it by hand — every one of
  # those has been wrong here, and two of this session's worst defects were pure frontend. It
  # skips only when the thing about to be tested is bit-for-bit the thing that was tested.
  #
  # `fetch-depth: 0` because resolving another branch's commit to its tree needs that commit
  # locally. The portal's sha is part of the fingerprint on purpose: test_close_reason_vocabulary
  # compares this repo against the PORTAL'S main, so the same tree can legitimately change answer
  # when the portal moves, and a fingerprint that ignored it would cache a stale pass.
  fingerprint:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.look.outputs.skip }}
      tree: ${{ steps.look.outputs.tree }}
      matched: ${{ steps.look.outputs.matched }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for a green run on this exact tree
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PORTAL_REF: main
        run: |
          set -euo pipefail
          TREE=$(git rev-parse HEAD^{tree})
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "this tree: $TREE"

          # The portal half of the fingerprint. A failure to read it must NOT silently widen the
          # match -- an unknown portal sha means we cannot prove equivalence, so we run.
          PORTAL=$(gh api "repos/HDLC01/Treadwell-Portal/commits/${PORTAL_REF}" --jq .sha 2>/dev/null || echo "")
          if [ -z "$PORTAL" ]; then
            echo "could not read the portal sha -- running the suite"
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "portal main: $PORTAL"

          # Successful CI runs, newest first. Only completed successes count; a cancelled or
          # in-progress run proves nothing.
          RUNS=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?status=success&per_page=60" \
                   --jq '.workflow_runs[] | "\(.head_sha) \(.id)"' 2>/dev/null || echo "")

          MATCH=""
          # `if`, not `[ … ] && continue`: under `set -e` a trailing && list that evaluates false
          # is a live footgun, and the failure mode here would be a silent early exit that reads
          # as "no match" — which is at least the safe direction, but invisible.
          while read -r SHA RUNID; do
            if [ -z "${SHA:-}" ]; then continue; fi
            # The commit may not be an ancestor of HEAD (it usually is not -- that is the point),
            # so fetch it before asking for its tree. A sha that has since been GC'd just misses.
            git cat-file -e "${SHA}^{commit}" 2>/dev/null || \
              git fetch --quiet --depth=1 origin "$SHA" 2>/dev/null || continue
            OTHER=$(git rev-parse "${SHA}^{tree}" 2>/dev/null || echo "")
            if [ "$OTHER" = "$TREE" ]; then
              # Same tree -- but was it tested against the same portal? The run's own job log is
              # not queryable cheaply, so use the run's creation time as the bound: if the portal
              # has not moved since that run started, the comparison it made still holds.
              CREATED=$(gh api "repos/${REPO}/actions/runs/${RUNID}" --jq .created_at 2>/dev/null || echo "")
              PORTAL_AT=$(gh api "repos/HDLC01/Treadwell-Portal/commits/${PORTAL_REF}" --jq .commit.committer.date 2>/dev/null || echo "")
              if [ -n "$CREATED" ] && [ -n "$PORTAL_AT" ] && [[ "$PORTAL_AT" < "$CREATED" ]]; then
                MATCH="$SHA"; echo "matched run $RUNID on $SHA (portal unchanged since)"; break
              fi
              echo "tree matched $SHA but the portal moved since that run -- not reusing"
            fi
          done <<< "$RUNS"

          if [ -n "$MATCH" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "matched=$MATCH" >> "$GITHUB_OUTPUT"
            echo "::notice::Suite skipped -- tree $TREE already passed on $MATCH"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "no green run on this tree -- running the suite"
          fi

  test:
    needs: fingerprint
    # The job still EXISTS when skipped, so the required-check name stays satisfied and branch
    # protection does not have to be edited. Only the expensive steps are gated.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Reusing an earlier green run
        if: needs.fingerprint.outputs.skip == 'true'
        run: |
          echo "Tree ${{ needs.fingerprint.outputs.tree }} already passed on commit ${{ needs.fingerprint.outputs.matched }}."
          echo "Identical bytes, identical suite -- nothing new to learn from a second run."

      - uses: actions/checkout@v7
        if: needs.fingerprint.outputs.skip != 'true'

      # ── the sibling checkout the cross-repo close-out guard needs ─────────
      # NO CREDENTIAL IS REQUIRED. HDLC01/Treadwell-Portal is a PUBLIC repo, so the
      # built-in GITHUB_TOKEN actions/checkout already uses can read it; a PAT or a
      # deploy key would only be needed if the portal were made private, and if that
      # ever happens the guard at the bottom of test_close_reason_vocabulary.py turns
      # red rather than going quiet, which is the point of it.
      #
      # `main`, deliberately, because main is what the portal DEPLOYS from: the
      # question this comparison asks is "does my change agree with the portal that
      # is live", not "with some branch". The consequence is that the portal's half
      # of a shared change has to merge FIRST or this job is red — which is the
      # merge order README.md documents, enforced instead of remembered.
      #
      # `path:` has to stay inside the workspace (actions/checkout refuses a path
      # above it), so the convention the test file otherwise relies on — the two
      # clones as siblings — is supplied by TW_PORTAL_REPO on the test step instead.
      # Nothing in the suite globs the repo root, so an extra directory here is inert.
      - name: Check out the customer portal beside this repo
        if: needs.fingerprint.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: HDLC01/Treadwell-Portal
          ref: main
          path: portal

      - uses: actions/setup-python@v7
        if: needs.fingerprint.outputs.skip != 'true'
        with:
          python-version: '3.11'          # matches the production Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt starts with "-r requirements.txt", so this one
      # install pulls in both the runtime and the test dependencies.
      - name: Install dependencies
        if: needs.fingerprint.outputs.skip != 'true'
        run: pip install -r requirements-dev.txt

      # `docker build` strips the comments out of the frontend it serves
      # (tools/strip-comments.js), so the bytes in the image are not the bytes in git.
      # tests/test_frontend_comment_strip.py re-runs that exact transform and proves the
      # result is the same program -- and it SKIPS without acorn, which would leave the one
      # guard covering what production actually serves quiet instead of red. Installed at
      # the repo root because that is where node resolves it from for tools/.
      # The pin is asserted to match the Dockerfile's, so the image and CI cannot drift
      # onto different parsers.
      - name: Install the parser the frontend comment-stripper uses
        if: needs.fingerprint.outputs.skip != 'true'
        working-directory: ${{ github.workspace }}
        run: npm install --no-save --no-audit --no-fund acorn@8.18.0

      # -n auto spreads the suite over the runner's 4 vCPUs. Locally this took the full run from
      # 14m59s to 3m32s; on 4 cores expect roughly 4 minutes instead of 12m48s.
      #
      # --dist loadfile is NOT optional. The default (--dist load) hands individual tests to
      # whichever worker is free, which re-runs every module-scoped fixture once per worker per
      # file — this suite has ~35 node-harness fixtures written to run exactly once — and it
      # discards the intra-file ordering that tests/test_leads.py documents. loadfile keeps each
      # file whole on one worker, so both stay true.
      #
      # --durations comes from backend/pytest.ini, so every run names its own slowest tests.
      - name: Run tests
        if: needs.fingerprint.outputs.skip != 'true'
        env:
          # Where the step above put the portal. Without this the cross-repo tests look for
          # a sibling directory that does not exist on a runner, skip, and the guard fails
          # the job — which is the designed outcome, but the job is meant to be GREEN and
          # actually comparing, not red.
          TW_PORTAL_REPO: ${{ github.workspace }}/portal
        run: python -m pytest tests/ -q -n auto --dist loadfile

  audit:
    # pip-audit scans the PRODUCTION dependencies for known CVEs.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        # Fails on ANY known CVE in the production deps — no ignores. (The earlier
        # starlette ignores were removed once the FastAPI 0.137 / starlette 1.3
        # upgrade cleared them.)
        run: pip-audit -r requirements.txt --strict --progress-spinner off
