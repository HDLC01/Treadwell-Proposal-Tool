name: Deploy

# Continuous deployment. The image is BUILT ON A GITHUB RUNNER, pushed to GHCR, and the
# VPS only pulls and restarts it.
#
# WHY, because the previous arrangement looks simpler and cost us an outage. The VPS used
# to run `docker compose up -d --build` itself. It is 1 core / 2 GB and hosts ~13
# containers for other Treadwell sites (portal, roadmap, assess, profiles, newsfeed,
# KBID), and this image bakes in Node, the Claude CLI and LibreOffice — so building it
# there spikes load to ~60 and browns out every site on the box. That is how production
# went down on 2026-06-24, and retrying the deploy made it worse.
#
#   push to `staging` -> build, push, deploy staging automatically
#   push to `main`    -> build and push, then WAIT for the `production` environment's
#                        required reviewer (HDLC01) before touching prod
#
# The build runs BEFORE the approval gate on purpose: a broken build should fail while
# nobody is waiting on it, and the reviewer should only ever be asked to approve an
# artifact that already exists.
#
# Rollback is one variable: every build is tagged with its commit SHA, so
#   TW_IMAGE=ghcr.io/<owner>/treadwell-proposal-tool:sha-<old> docker compose up -d
# on the box puts the previous image back without a build or a revert commit.
#
# `deploy/ship.sh` remains the manual fallback for when CI or the registry is unavailable
# (it builds locally and ships the tarball over SSH). The compose `build:` blocks are
# kept for the same reason.
#
# Auth: `VPS_SSH_KEY` / `VPS_HOST` / `VPS_USER` secrets for the box; the built-in
# `GITHUB_TOKEN` for GHCR — no long-lived registry credential exists anywhere.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:        # allow a manual re-deploy from the Actions tab

concurrency:
  # never let two deploys to the same branch overlap; let a running one finish
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # lowercase: GHCR rejects a repository path containing capitals, and the owner here
  # is `HDLC01`.
  IMAGE: ghcr.io/hdlc01/treadwell-proposal-tool

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # push to GHCR with the built-in token
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Work out the tags
        id: meta
        run: |
          # An immutable per-commit tag is what makes rollback trivial; the moving
          # staging/prod tag is what a bare `docker compose up -d` on the box resolves.
          echo "sha_tag=${IMAGE}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "move_tag=${IMAGE}:${{ github.ref_name == 'main' && 'prod' || 'staging' }}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.move_tag }}
          # The layer cache is what keeps this off the critical path: LibreOffice and the
          # Claude CLI are the slow layers and they almost never change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    if: github.ref_name == 'staging'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Pull + restart staging over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true          # abort on the first failing command
          envs: TW_IMAGE,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/treadwell-staging
            git pull --ff-only origin staging
            # The token is short-lived and job-scoped; logging out again means no registry
            # credential is ever left sitting on the box.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose -f docker-compose.staging.yml pull app
            docker compose -f docker-compose.staging.yml up -d     # NO --build
            for i in $(seq 1 24); do
              if curl -fsS http://localhost:8889/healthz >/dev/null; then
                echo "staging healthy on $TW_IMAGE"; exit 0
              fi
              sleep 5
            done
            echo "staging post-deploy healthcheck failed"; exit 1
        env:
          TW_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      # ── the tests CI cannot run ────────────────────────────────────────────
      # A handful of tests need LibreOffice, because the PDF every customer receives is
      # produced by `soffice --headless`, not by Word. Installing it on the runner would add
      # minutes and a few hundred MB to every build, so those tests carry a skipif and were
      # silently skipping in CI AND on the dev box — nothing was checking them anywhere.
      #
      # That mattered most for box resizing. Project experience is that LibreOffice ignores
      # docx text-box autofit (which is why the writer scales run sizes directly), so whether
      # it honours an explicit box extent was an open question — and if it didn't, an estimator
      # would resize a box, see it change in Word, and the customer's PDF would be unchanged.
      # Measured in this container: 7 of 60 lines reach the PDF at the template's box height,
      # 50 of 60 once the box is enlarged. It honours it.
      #
      # Runs in a THROWAWAY container from the image just deployed, with the checkout mounted
      # read-only, so a test run can never disturb the live staging service or leave packages
      # behind in it.
      #
      # This step FAILS the run when the check fails or silently skips, and that is deliberate.
      # Staging is already deployed and healthy by now, so failing does not roll anything back —
      # what it buys is a red run somebody notices. `continue-on-error` would leave a failed
      # step inside a green run, which is precisely the kind of thing that gets missed and is
      # how this test came to be skipping everywhere in the first place. The one tolerated
      # non-failure is pip being unable to reach the index; that is infrastructure, not the
      # product, and it exits 0 with a message.
      - name: PDF fidelity smoke (LibreOffice, in the deployed image)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: TW_IMAGE
          script: |
            set -euo pipefail
            docker run --rm \
              -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp \
              -v /opt/treadwell-staging:/src:ro \
              "$TW_IMAGE" \
              sh -c 'pip install --quiet --no-input pytest pymupdf >/dev/null 2>&1 || {
                       echo "could not install pytest/pymupdf - skipping"; exit 0; }
                     cd /src/backend
                     # test_box_resize.py is the only file with a genuinely LibreOffice-gated
                     # test. test_pdf_export.py monkeypatches docx_to_pdf away in every case,
                     # so running it here would imply PDF coverage that does not exist.
                     python -m pytest tests/test_box_resize.py \
                       -q -p no:cacheprovider -p no:warnings
                     # Fail loudly if the one test this step exists for silently skipped -
                     # a green "46 passed" with the PDF case skipped is the exact false
                     # reassurance this step was added to remove.
                     python -m pytest tests/test_box_resize.py -p no:cacheprovider \
                       -p no:warnings -q -k pdf 2>&1 | tee /tmp/pdf.out
                     grep -q "1 passed" /tmp/pdf.out || {
                       echo "PDF fidelity test did not RUN (skipped or missing)"; exit 1; }'
        env:
          # Each ssh-action step gets its own environment, so TW_IMAGE has to be passed again
          # here — without it `set -u` aborts on the first line and the step never runs the
          # check it exists for.
          TW_IMAGE: ${{ needs.build.outputs.image }}

  production:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment: production          # required reviewer -> waits for approval
    steps:
      - name: Pull + restart production over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: TW_IMAGE,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/treadwell
            git pull --ff-only
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull proposal-tool
            docker compose up -d                                   # NO --build
            for i in $(seq 1 24); do
              if curl -fsS http://localhost:8888/healthz >/dev/null; then
                echo "prod healthy on $TW_IMAGE"; exit 0
              fi
              sleep 5
            done
            echo "prod post-deploy healthcheck failed"; exit 1
        env:
          TW_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
