name: Deploy

# Continuous deployment. The image is BUILT ON A GITHUB RUNNER, pushed to GHCR, and the
# VPS only pulls and restarts it.
#
# WHY, because the previous arrangement looks simpler and cost us an outage. The VPS used
# to run `docker compose up -d --build` itself. It is 1 core / 2 GB and hosts ~13
# containers for other Treadwell sites (portal, roadmap, assess, profiles, newsfeed,
# KBID), and this image bakes in Node, the Claude CLI and LibreOffice — so building it
# there spikes load to ~60 and browns out every site on the box. That is how production
# went down on 2026-06-24, and retrying the deploy made it worse.
#
#   push to `staging` -> build, push, deploy staging automatically
#   push to `main`    -> build and push, then WAIT for the `production` environment's
#                        required reviewer (HDLC01) before touching prod
#
# The build runs BEFORE the approval gate on purpose: a broken build should fail while
# nobody is waiting on it, and the reviewer should only ever be asked to approve an
# artifact that already exists.
#
# Rollback is one variable: every build is tagged with its commit SHA, so
#   TW_IMAGE=ghcr.io/<owner>/treadwell-proposal-tool:sha-<old> docker compose up -d
# on the box puts the previous image back without a build or a revert commit. A deploy whose
# health check fails does that by itself (deploy/remote-deploy.sh).
#
# `deploy/ship.sh` remains the manual fallback for when CI or the registry is unavailable
# (it builds locally and ships the tarball over SSH). The compose `build:` blocks are
# kept for the same reason.
#
# Auth: `VPS_HOST` / `VPS_PORT` / `VPS_FINGERPRINT` for the box, and `VPS_DEPLOY_USER` /
# `VPS_DEPLOY_KEY` for a box account of this app's own that can run ONE program, never a shell
# and never as root by itself (see the deploy jobs below and deploy/README.md). The built-in
# `GITHUB_TOKEN` is the GHCR login, on the runner and inside the request to the box: no long-lived
# registry credential exists anywhere, and the box keeps it in a throw-away DOCKER_CONFIG.
#
# Every `uses:` in these workflows is a full commit SHA with its release tag in the trailing
# comment. A tag is whatever the action's owner points it at today, and the SSH steps below are
# handed the deploy key: a moved tag would run someone else's code with it. Dependabot
# (.github/dependabot.yml) bumps the SHA and the comment together.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:        # a manual re-deploy from the Actions tab: main or staging ONLY (see build.if)

concurrency:
  # never let two deploys to the same branch overlap; let a running one finish
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # lowercase: GHCR rejects a repository path containing capitals, and the owner here
  # is `HDLC01`.
  IMAGE: ghcr.io/hdlc01/treadwell-proposal-tool

jobs:
  build:
    # THE DISPATCH GUARD. A push only ever fires this workflow for staging or main (the branch
    # filter above), but "Run workflow" lets anyone with write access pick ANY branch or tag. From
    # a feature branch that used to build and push the image under the moving `staging` tag (see
    # `move_tag` below), which the staging box then starts on its next plain `up -d`. And the
    # deploy jobs keyed on `github.ref_name`, which a TAG named `main` also satisfies — a manual
    # run from that tag reached production. Full refs here, so a manual run from anywhere else
    # builds nothing, and both deploy jobs `needs: build`, so it deploys nothing either.
    # (backend/tests/test_deploy_pipeline.py evaluates this against branch, tag and event.)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # push to GHCR with the built-in token
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      # The same guard, exactly. Every string comparison in a GitHub expression ignores case, so
      # the `if:` above would also pass a branch named `Main` or `STAGING`. This one is bash and
      # case-exact, and it runs before anything is checked out, built or pushed.
      - name: Only main or staging may deploy
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/staging) echo "deploying from $GITHUB_REF" ;;
            *) echo "::error::Deploys run from main or staging only, not $GITHUB_REF."; exit 1 ;;
          esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Work out the tags
        id: meta
        run: |
          # An immutable per-commit tag is what makes rollback trivial; the moving
          # staging/prod tag is what a bare `docker compose up -d` on the box resolves.
          echo "sha_tag=${IMAGE}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "move_tag=${IMAGE}:${{ github.ref_name == 'main' && 'prod' || 'staging' }}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.move_tag }}
          # The layer cache is what keeps this off the critical path: LibreOffice and the
          # Claude CLI are the slow layers and they almost never change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── the two deploy jobs: ONE request line each, to a key that can run only the box's program ──
  #
  # The deploy key (VPS_DEPLOY_KEY) belongs to a box account of the proposal tool's own
  # (VPS_DEPLOY_USER), not in the docker or sudo group, whose authorized_keys line forces
  # /usr/local/sbin/treadwell-tool-deploy: a root-owned copy of deploy/remote-deploy.sh, installed by
  # deploy/install-deploy-account.sh. The `script:` below is therefore NOT a shell script: it is the
  # one line that program reads from SSH_ORIGINAL_COMMAND and matches by regex (never runs). The box
  # then, in this order: takes a lock shared with the other environment's deploys, fetches the
  # branch and refuses a commit that is not on it, keeps and checks the Zetta Serif files in
  # /opt/treadwell-fonts, logs in to GHCR with this job's token in a throw-away DOCKER_CONFIG and
  # pulls exactly sha-<12>, fast-forwards the checkout to exactly this commit (staying on its
  # branch), applies staging's schema, `docker compose up -d` (NEVER --build), health-checks the
  # new image and ROLLS BACK to the previous checkout and image when that fails, re-points the
  # moving tag, and keeps three sha images of this app. deploy/README.md has the whole runbook.
  #
  # Why: the old steps logged in as root with a key that ran any script, and repository secrets are
  # readable by a workflow run on ANY branch of this repository. The production environment's
  # reviewer gate stays, but it was never what protected the key.
  #
  # An empty VPS_FINGERPRINT would make the SSH action accept ANY host key, so a spoofed endpoint
  # could take the request (and its registry token) and answer "healthy". Each job refuses that
  # before it connects.
  staging:
    if: github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    # The job's GITHUB_TOKEN goes to the box inside the request, for the image pull, so it gets
    # exactly that and nothing else: no repo contents, no write to anything.
    permissions:
      packages: read
    steps:
      - name: The deploy account and the box's host key are configured
        env:
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_DEPLOY_USER" ]; then
            echo "::error::The VPS_DEPLOY_USER repository secret is empty (deploy/README.md, One-time setup)."; exit 1
          fi
          if [ -z "$VPS_FINGERPRINT" ]; then
            echo "::error::The VPS_FINGERPRINT repository secret is empty (deploy/README.md, One-time setup)."; exit 1
          fi

      - name: Deploy staging on the VPS (the key runs only the box's deploy program)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}   # SSH moved off 22 on 2026-09-28
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m
          script: deploy staging ${{ github.sha }} ${{ secrets.GITHUB_TOKEN }}

      # ── the tests CI cannot run ────────────────────────────────────────────
      # A handful of tests need LibreOffice, because the PDF every customer receives is produced
      # by `soffice --headless`, not by Word. They carry a skipif and were silently skipping in CI
      # AND on the dev box, so this step runs them on the box, in a THROWAWAY container of the
      # image staging was just deployed with (deploy/remote-deploy.sh, run_pdf_smoke, holds the
      # test script and why each line of it is there).
      #
      # This step FAILS the run when the check fails or silently skips, and that is deliberate.
      # Staging is already deployed and healthy by now, so failing does not roll anything back —
      # what it buys is a red run somebody notices. `continue-on-error` would leave a failed step
      # inside a green run, which is how this test came to be skipping everywhere in the first place.
      - name: PDF fidelity smoke (LibreOffice, in the deployed image)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}   # SSH moved off 22 on 2026-09-28
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m
          script: pdf-smoke staging ${{ github.sha }}

  production:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production          # required reviewer -> waits for approval
    permissions:
      packages: read                 # the pull on the box; same reasoning as the staging job
    steps:
      - name: The deploy account and the box's host key are configured
        env:
          VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_DEPLOY_USER" ]; then
            echo "::error::The VPS_DEPLOY_USER repository secret is empty (deploy/README.md, One-time setup)."; exit 1
          fi
          if [ -z "$VPS_FINGERPRINT" ]; then
            echo "::error::The VPS_FINGERPRINT repository secret is empty (deploy/README.md, One-time setup)."; exit 1
          fi

      - name: Deploy production on the VPS (the key runs only the box's deploy program)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}   # SSH moved off 22 on 2026-09-28
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m
          script: deploy main ${{ github.sha }} ${{ secrets.GITHUB_TOKEN }}
