# Dependabot: weekly version-update PRs + (with native security updates enabled
# in repo settings) immediate PRs for vulnerable deps. Scheduled PRs target the
# `staging` branch to respect the staging-first flow. NOTE: native *security*
# update PRs always target the default branch (main) — that's a GitHub limit.
version: 2
updates:
  # Python dependencies (the app's requirements live in /backend)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
    labels: [dependencies]

  # Keep the GitHub Actions themselves current (also clears the Node 20 nag). The workflows pin
  # each action to a commit SHA with its tag in a trailing comment; Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    labels: [dependencies, ci]

  # The Dockerfile's base images are pinned by digest. Without this entry a digest pin never
  # moves, and the image would quietly stop receiving Debian and Python security fixes. Digest and
  # patch bumps only: the container is Python 3.11 and Node 20 on purpose, and a new minor or major
  # is a decision, not a weekly PR. (The Claude CLI version is pinned in a RUN line, which this
  # cannot see; it is bumped by hand.)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: staging
    labels: [dependencies]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
